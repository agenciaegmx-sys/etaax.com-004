<script>
var log=[];function L(s){log.push(s);document.getElementById('out').textContent='RES\n'+log.join('\n')+'\nFIN';}
var hoy=Date.now();
var CAT=[
 {id:'i0',nombre:'Zanahoria',familia:'Verduras',categoria:'Raíz',activo:'1',presentaciones:[{precio:'10'}],createdAt:new Date(hoy-5*864e5).toISOString()},
 {id:'i1',nombre:'Aceite',familia:'Abarrotes',categoria:'Grasas',activo:'1',presentaciones:[{precio:'10'}],createdAt:new Date(hoy-1*864e5).toISOString()},
 {id:'i2',nombre:'Mezcal',familia:'Bebidas',categoria:'Destilados',activo:'1',presentaciones:[{precio:'10'}],createdAt:new Date(hoy-9*864e5).toISOString()},
 {id:'i3',nombre:'Azúcar',familia:'Abarrotes',categoria:'Dulces',activo:'1',presentaciones:[{precio:'10'}],createdAt:new Date(hoy-3*864e5).toISOString()}];
getInsumos=function(){return CAT;}; setInsumos=function(d){CAT=d;};
_catGlobalIns=function(){return false;}; _getSucActivaIns=function(){return '';};
renderStats=function(){}; _poblarFiltroSucIns=function(){}; init=function(){};
function noms(){ return Array.prototype.map.call(document.querySelectorAll('#tbodyInsumos tr[data-ord-id]'),function(t){
  return (CAT.find(function(x){return x.id===t.getAttribute('data-ord-id');})||{}).nombre; }).join(' · '); }
try{
 cargarFiltros(); vistaInsumos='lista'; filtrar();
 L('── Modos de orden en insumos ──');
 setOrdenModoIns('alfa');   L('  A–Z:            '+noms());
 setOrdenModoIns('grupo');  L('  Por familia:    '+noms());
 setOrdenModoIns('nuevo');  L('  Más recientes:  '+noms());
 setOrdenModoIns('libre');  L('  A mano:         '+noms());
 L('  el selector refleja: "'+document.getElementById('ordenModoIns').value+'"');
 L('');
 L('── Arrastrar solo "a mano" ──');
 setOrdenModoIns('alfa'); toggleModoOrden();
 L('  prender arrastre desde A–Z pasa a: "'+document.getElementById('ordenModoIns').value+'"');
 L('  engancha:            '+(document.querySelectorAll('#tbodyInsumos tr.ord-mov').length===4));
 L('  agarraderas:         '+document.querySelectorAll('.ord-grip').length);
 setOrdenModoIns('grupo');
 L('  cambiar a "por familia" apaga el arrastre: '+(document.querySelectorAll('#tbodyInsumos tr.ord-mov').length===0));
}catch(e){ L('THROW '+e.message+'\n'+(e.stack||'').split('\n').slice(0,3).join('\n')); }
