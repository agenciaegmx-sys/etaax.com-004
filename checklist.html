<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<script src="/negocio-tab.js"></script><!-- negocio activo POR PESTAÑA: debe ir primero -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ETAAX – Check list operativo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 40px;box-sizing:border-box}
.cap-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:460px;padding:24px 22px;text-align:center}
.cap-logo{margin-bottom:14px}
.cap-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text)}
.cap-sub{font-size:13px;color:var(--text-dim);margin:4px 0 18px}
label.lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);display:block;margin:0 0 6px;text-align:left}
.fld{width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;margin-bottom:14px}
#pinInput{text-align:center;letter-spacing:10px;font-size:26px;font-weight:600}
.cap-btn{display:block;width:100%;box-sizing:border-box;background:var(--green);color:#0a0908;border:none;border-radius:10px;padding:15px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.cap-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-weight:500}
.cap-btn:disabled{opacity:.5}
.cap-msg{font-size:13px;margin-top:12px;min-height:18px}
.cap-msg.ok{color:var(--green)} .cap-msg.err{color:var(--red)}
.quien{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:13px;color:var(--text);text-align:left}
#countBox{font-size:12px;color:var(--text-dim);margin:-6px 0 14px}
.volver{background:transparent;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:10px;display:block}
/* Tarjetas de plantilla */
.pl-btn{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif}
.pl-btn:active{border-color:var(--green)}
.pl-btn .pi{font-size:26px;flex-shrink:0}
.pl-btn .pt{font-size:15px;font-weight:600;color:var(--text)}
.pl-btn .pd{font-size:12px;color:var(--text-dim);margin-top:2px}
/* Botones del portal y del recetario.
   El HTML ya usaba .plant-card / .plant-nom / .plant-meta, pero NUNCA se
   escribieron sus estilos: se renderizaban como texto suelto, centrado por el
   text-align de la tarjeta madre. De ahí que el portal se viera como una lista
   de palabras en vez de botones. */
.plant-card{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;
    background:var(--surface2);border:1px solid var(--border);border-radius:14px;
    padding:15px 16px;margin-bottom:11px;cursor:pointer;text-align:left;
    transition:border-color .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.plant-card:active{border-color:var(--green);transform:scale(.985)}
.plant-nom{font-size:15.5px;font-weight:600;color:var(--text);line-height:1.25}
.plant-meta{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.35;text-align:left}
/* El ícono en su propio cuadro: da al botón un ancla visual y un área de toque
   clara, en vez de un emoji flotando junto al texto. */
.plant-ico{width:46px;height:46px;flex-shrink:0;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:24px;line-height:1;
    background:rgba(61,190,122,.10);border:1px solid rgba(61,190,122,.22);overflow:hidden}
.plant-ico img{width:100%;height:100%;object-fit:cover;display:block}
.plant-go{color:var(--green);font-size:20px;flex-shrink:0;opacity:.8}
.plant-card[aria-disabled="true"]{opacity:.45;cursor:default}
/* Encabezado de grupo dentro de una lista larga */
.plant-sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px;text-align:left}
.plant-sec:first-child{margin-top:4px}
.plant-sec span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.plant-sec i{flex:1;height:1px;background:var(--border);display:block}
/* Tareas del checklist */
.tk-row{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:13px 14px;margin-bottom:9px;text-align:left;cursor:pointer;user-select:none}
.tk-row .tk-freq{font-size:9px;font-weight:700;color:var(--text-dim);border:1px solid var(--border);border-radius:5px;padding:2px 6px;flex-shrink:0}
.tk-row .tk-txt{flex:1;font-size:13.5px;color:var(--text);line-height:1.3}
.tk-mark{width:34px;height:34px;border-radius:9px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;background:var(--bg);color:var(--text-dim)}
.tk-row.ok   .tk-mark{border-color:var(--green);color:var(--green);background:rgba(61,190,122,.14)}
.tk-row.no   .tk-mark{border-color:#e05a3a;color:#e05a3a;background:rgba(224,90,58,.14)}
.tk-row.pend .tk-mark{border-color:#e0a52e;color:#e0a52e;background:rgba(224,165,46,.14)}
.tk-hint{font-size:11px;color:var(--text-dim);margin:-2px 0 12px;text-align:left}
.prog-wrap{position:sticky;top:0;z-index:2;background:var(--surface);padding:8px 0 10px;margin-bottom:6px}
.prog-bar{height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.prog-fill{height:100%;background:var(--green);transition:width .2s}
.prog-lbl{font-size:12px;color:var(--text-dim);margin-top:6px;display:flex;justify-content:space-between}
/* Fotos evidencia */
.foto-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.foto-strip .fs-it{position:relative;width:56px;height:56px}
.foto-strip .fs-it img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.foto-strip .fs-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foto-cnt{font-size:11px;color:var(--text-dim);margin:-4px 0 10px}
.cap-par{display:flex;gap:10px;margin-top:8px}
.cap-par .cap-btn{flex:1;margin-top:0;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:15px;padding:15px 8px;min-height:54px}
.done-big{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;margin:6px 0}
</style>
</head>
<body>
<div class="cap-card">
    <div class="cap-logo">
        <img src="/marca/etaax-logo-oscuro.svg" alt="ETAAX" style="height:29px;width:auto;display:block">
    </div>
    <div class="cap-title" id="capTitle">Portal del colaborador</div>
    <div class="cap-sub" id="capSub">Identifícate con tu PIN</div>

    <!-- ── PIN ── -->
    <div id="pinScreen">
        <label class="lbl">PIN de 5 dígitos</label>
        <input id="pinInput" class="fld" type="tel" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off">
        <button class="cap-btn" id="pinBtn" onclick="entrar()">Entrar</button>
        <div class="cap-msg" id="pinMsg"></div>
    </div>

    <!-- ── PORTAL: qué quiere hacer ──
         El QR dejó de ser solo el checklist. La URL NO cambia (hay códigos ya
         impresos apuntando a checklist.html?n=…&t=…), así que el portal vive
         aquí adentro y el checklist pasa a ser una de sus opciones. -->
    <div id="menuScreen" style="display:none">
        <div class="quien">👤 <b id="quienNomMenu">—</b> <span id="quienAreaMenu" style="color:var(--text-dim)"></span></div>
        <label class="lbl">¿Qué necesitas?</label>
        <div id="portalOpts"></div>
    </div>

    <!-- ── Recetario operativo (sin costos) ── -->
    <div id="recScreen" style="display:none">
        <button class="volver" onclick="_verMenu()">← Regresar</button>
        <input id="recBuscar" class="fld" placeholder="🔍 Buscar receta…" oninput="_pintarRecetas()">
        <div id="recList"></div>
    </div>
    <div id="recDetalle" style="display:none">
        <button class="volver" onclick="_verRecetas()">← Otras recetas</button>
        <div id="recFicha"></div>
    </div>

    <!-- ── Guías de uso ── -->
    <div id="guiaScreen" style="display:none">
        <button class="volver" onclick="_verMenu()">← Regresar</button>
        <div id="guiaList"></div>
    </div>

    <!-- ── Lista de checklists ── -->
    <div id="listScreen" style="display:none">
        <button class="volver" onclick="_verMenu()">← Regresar</button>
        <div class="quien">👤 Registra: <b id="quienNom">—</b></div>
        <div id="countBox">⏱️ Tiempo en el check list: <b id="countVal" style="color:var(--text)">0:00</b></div>
        <label class="lbl">Elige el check list a realizar</label>
        <div id="plantList"></div>
    </div>

    <!-- ── Ejecución del checklist ── -->
    <div id="runScreen" style="display:none">
        <button class="volver" onclick="volverLista()">← Otros check lists</button>
        <div class="prog-wrap">
            <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
            <div class="prog-lbl"><span id="progTxt">0 de 0 hechas</span><span id="progPct">0%</span></div>
        </div>
        <div class="tk-hint">Toca cada tarea para marcarla: 1 toque = ✓ hecha · 2 = ✗ no realizada · 3 = ▲ pendiente · 4 = sin marcar.</div>
        <div id="tareasList"></div>

        <label class="lbl" style="margin-top:6px">Nota (opcional)</label>
        <input id="runNota" class="fld" placeholder="Novedad, pendiente, incidencia…">

        <label class="lbl">Evidencia · hasta 7 fotos o un video de 1 min</label>
        <div class="foto-strip" id="runFotoStrip"></div>
        <div class="foto-cnt" id="runFotoCnt">0 / 7 fotos</div>
        <input type="file" id="runFotoCam" accept="image/*" capture="environment" style="display:none" onchange="_addFoto(this)">
        <!-- Video: se abre la cámara del teléfono. Máximo 5 minutos; se valida el
             archivo antes de subirlo para no gastar datos en algo que se rechaza. -->
        <input type="file" id="runVidCam" accept="video/*" capture="environment" style="display:none" onchange="_addVideo(this)">
        <div id="runVidBox" style="margin-top:8px"></div>
        <input type="file" id="runFotoGal" accept="image/*" multiple style="display:none" onchange="_addFoto(this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('runFotoCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('runFotoGal').click()">🖼️ Galería</button>
            <button class="cap-btn ghost" onclick="document.getElementById('runVidCam').click()">🎥 Video</button>
        </div>

        <button class="cap-btn" id="runBtn" style="margin-top:12px" onclick="registrarCumplimiento()">✓ Registrar cumplimiento</button>
        <div class="cap-msg" id="runMsg"></div>
    </div>

    <!-- ── Resultado ── -->
    <div id="doneScreen" style="display:none">
        <div class="done-big" id="donedPct" style="color:var(--green)">0%</div>
        <div style="font-size:14px;color:var(--text);font-weight:600" id="doneTitle">Check list registrado</div>
        <div style="font-size:12.5px;color:var(--text-dim);margin:6px 0 18px" id="doneSub">—</div>
        <button class="cap-btn" onclick="volverLista()">Hacer otro check list</button>
    </div>

    <!-- ── Error ── -->
    <div id="errScreen" style="display:none">
        <div style="font-size:38px;margin:10px 0">🔒</div>
        <div id="errTxt" style="font-size:13px;color:var(--text-dim);line-height:1.6"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="/staff-area.js"></script><!-- el área de un colaborador: fuente única -->
<script>
(function(){var s=localStorage.getItem('etaax_theme')||'dark';document.documentElement.setAttribute('data-theme',s);})();
function _q(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowHora(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function etx(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function _hashNip(pin){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('etaax-staff|nip|' + pin));
    return 'v2$' + Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}

var NEG = _q('n') || _q('neg');
var TOKEN = _q('t');
var SUC = _q('s') || '';
/* El QR ya NO expira mientras se llena: un check de cierre puede tomar media hora y
   no tiene sentido echar al colaborador a media captura. El cronómetro ahora cuenta
   HACIA ARRIBA, desde que entra hasta que envía, y ese lapso es justo el dato que se
   guarda. La sesión sigue atada al NIP validado por la RPC en cada registro. */
var COLAB = '', _NIPHASH = '', PLANTILLAS = [], _countTimer = null, _t0 = 0;
var TIPO = { apertura:['🌅','Apertura'], cierre:['🌙','Cierre'], intermedio:['🔄','Intermedio'], limpieza:['🧽','Limpieza'], otro:['📋','Check list'] };
var MARCA = { '':'', ok:'✓', no:'✗', pend:'▲' };
var CICLO = { '':'ok', ok:'no', no:'pend', pend:'' };

var RUN = null;   // { plant, marcas:{tareaId:estado}, fotos:[] }
var PERFIL = null, RECETAS = null, GUIAS = null;

// Área del colaborador, normalizada. Vacío = sin v46 o sin asignar → sin filtro.
function _area(){ return PERFIL ? _normArea(PERFIL.area) : ''; }
/* Los datos viejos traen el área escrita a mano ("Barra", "COCINA", "Cocina fría").
   Se normaliza a las cuatro que entiende el portal para que un acento o una
   mayúscula no dejen a alguien sin sus checklists. */
/* Alias delgados: la verdad del área vive en /staff-area.js. Había DOS copias de
   este mapeo (aquí y en el editor de staff) y una tercera en camino; si se
   separan, el colaborador ve en el QR los checklists de otra área. */
function _normArea(a){ return StaffArea.norm(a); }
var AREA_NOM = StaffArea.NOMBRES;

var _PANTALLAS = ['pinScreen','menuScreen','recScreen','recDetalle','guiaScreen','listScreen','runScreen','doneScreen','errScreen'];
function _show(id){ _PANTALLAS.forEach(function(x){ var el=document.getElementById(x); if(el) el.style.display = x===id?'block':'none'; }); }
function _err(txt){ document.getElementById('errTxt').innerHTML = txt; document.getElementById('capSub').textContent = ''; _show('errScreen'); if(_countTimer){clearInterval(_countTimer);_countTimer=null;} }

async function entrar(){
    var pin = (document.getElementById('pinInput').value || '').trim();
    var msg = document.getElementById('pinMsg'); msg.className = 'cap-msg'; msg.textContent = '';
    if (!/^\d{4,6}$/.test(pin)) { msg.className='cap-msg err'; msg.textContent='Pon tu NIP (5 dígitos).'; return; }
    var btn = document.getElementById('pinBtn'); btn.disabled = true; msg.textContent = 'Validando…';
    try {
        var h = await _hashNip(pin);
        var rv = await _supabase.rpc('entrada_validar_nip', { p_neg: NEG, p_token: TOKEN, p_niphash: h });
        if (rv.error) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'No se pudo validar.<br><span style="font-size:11px;color:var(--text-dim)">' + etx(rv.error.message) + ' — ¿se corrió la migración v27 en Supabase?</span>';
            return;
        }
        if (!rv.data) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'NIP no reconocido.<br><span style="font-size:11px;color:var(--text-dim)">Verifica con tu encargado tu NIP de 5 dígitos (Gestión de Staff).</span>';
            return;
        }
        COLAB = rv.data; _NIPHASH = h;

        /* El perfil (nombre + ÁREA) sale de portal_perfil, de v46. Si esa migración
           todavía no corre, la RPC no existe y el portal sigue funcionando SIN filtro
           por área — el colaborador ve todo, como antes. Degradar así es preferible a
           dejarlo fuera por una migración pendiente. */
        try {
            var rperf = await _supabase.rpc('portal_perfil', { p_neg: NEG, p_token: TOKEN, p_niphash: h });
            if (!rperf.error && rperf.data) PERFIL = rperf.data;
        } catch (e) { /* v46 sin correr */ }

        var rp = await _supabase.rpc('checklist_plantillas', { p_neg: NEG, p_token: TOKEN });
        if (rp.error) {
            btn.disabled = false; msg.className='cap-msg err';
            msg.innerHTML = 'No se pudieron cargar los check lists.<br><span style="font-size:11px;color:var(--text-dim)">' + etx(rp.error.message) + ' — ¿se corrió la migración v38?</span>';
            return;
        }
        PLANTILLAS = (rp.data || []).filter(function(p){
            if (!p || !p.id || p.activo === false) return false;
            if (SUC && p.sucursalId && p.sucursalId !== SUC) return false;
            /* Filtro por ÁREA: al de barra solo sus checklists. Una plantilla SIN área
               se le muestra a todos — es la general del negocio, y esconderla dejaría
               al colaborador sin nada que hacer por un dato que nadie llenó. */
            if (_area() && p.area && _normArea(p.area) !== _area()) return false;
            return true;
        });
        PLANTILLAS.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
        document.getElementById('quienNom').textContent = COLAB;
        _verMenu();
        _t0 = Date.now(); _tick(); _countTimer = setInterval(_tick, 1000);
    } catch (e) {
        btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e);
    }
}

function _tick(){
    var seg = Math.max(0, Math.round((Date.now() - _t0) / 1000));
    var el = document.getElementById('countVal');
    if (el) el.textContent = Math.floor(seg/60) + ':' + String(seg%60).padStart(2,'0');
}


/* ══ PORTAL DEL COLABORADOR ═════════════════════════════════════════════
   El QR era solo el checklist; ahora es la puerta. Todo lo que se agregue aquí
   tiene que salir por una RPC con token + NIP: el dispositivo NO tiene sesión de
   Supabase, así que no puede leer ninguna tabla por su cuenta. */
function _verMenu(){
    document.getElementById('capTitle').textContent = 'Portal del colaborador';
    document.getElementById('capSub').textContent   = '';
    document.getElementById('quienNomMenu').textContent = COLAB || '—';
    var a = _area();
    document.getElementById('quienAreaMenu').textContent = a ? ' · ' + AREA_NOM[a] : '';

    /* El recetario solo tiene sentido para quien cocina o prepara. A piso y
       administración no se les enseña: no es un permiso, es no llenarles la
       pantalla con algo que no van a abrir nunca. */
    var verRecetas = !a || a === 'barra' || a === 'cocina';
    var ops = [];
    ops.push(_opt('📋', 'Mis check lists',
        PLANTILLAS.length ? PLANTILLAS.length + (PLANTILLAS.length===1?' disponible':' disponibles') : 'Ninguno para tu área',
        PLANTILLAS.length ? 'volverLista()' : ''));
    if (verRecetas) ops.push(_opt('📖', 'Recetario', 'Cómo se prepara, paso a paso', '_verRecetas()'));
    ops.push(_opt('📚', 'Guías de uso', 'Manuales de ETAAX', '_verGuias()'));
    document.getElementById('portalOpts').innerHTML = ops.join('');
    _show('menuScreen');
}
function _opt(ico, tit, sub, accion){
    var off = !accion;
    return '<div class="plant-card"' + (off ? ' aria-disabled="true"' : ' onclick="' + accion + '"') + '>' +
        '<div class="plant-ico">' + ico + '</div>' +
        '<div style="flex:1;min-width:0"><div class="plant-nom">' + etx(tit) + '</div>' +
        '<div class="plant-meta">' + etx(sub) + '</div></div>' +
        (off ? '' : '<div class="plant-go">›</div>') + '</div>';
}

/* ── Recetario OPERATIVO ──
   La RPC devuelve las recetas YA sin costos (v46). No se filtra aquí: si el
   filtrado viviera en el navegador, bastaría abrir la consola para ver el precio
   de cada ingrediente. Lo que no debe salir, no sale del servidor. */
async function _verRecetas(){
    _show('recScreen');
    var cont = document.getElementById('recList');
    if (RECETAS === null) {
        cont.innerHTML = '<div class="plant-meta" style="padding:16px 2px">Cargando recetas…</div>';
        try {
            var r = await _supabase.rpc('portal_recetas', { p_neg: NEG, p_token: TOKEN, p_niphash: _NIPHASH });
            if (r.error) throw new Error(r.error.message);
            RECETAS = (r.data || []).sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
        } catch (e) {
            RECETAS = [];
            cont.innerHTML = '<div class="cap-msg err">No se pudo cargar el recetario.<br>' +
                '<span style="font-size:11px">' + etx((e&&e.message)||e) + ' — ¿se corrió la migración v46?</span></div>';
            return;
        }
    }
    _pintarRecetas();
}
/* Una SUB-receta es una preparación que entra en otras (un adobo, una salsa base),
   no un platillo que sale a la mesa. La RPC ya lo dice en `tipo`
   ('sub-alimentos' / 'sub-bebidas'), así que no hace falta migración. */
function _esSubReceta(r){ return String((r && r.tipo) || '').indexOf('sub-') === 0; }

function _recCard(r, i){
    /* Si la receta tiene foto, la foto ES el ícono: en cocina se reconoce antes
       un platillo por su imagen que por su nombre escrito. */
    var ico = r.foto
        ? '<img src="' + etx(r.foto) + '" alt="" loading="lazy">'
        : (String(r.tipo||'').indexOf('bebida') >= 0 ? '🥃' : '🍽️');
    var meta = [];
    if (r.grupo) meta.push(etx(r.grupo));
    if ((r.ingredientes||[]).length) meta.push(r.ingredientes.length + ' ingredientes');
    if (r.tiempo) meta.push('⏱️ ' + etx(r.tiempo));
    return '<div class="plant-card" onclick="_verReceta(' + i + ')">' +
        '<div class="plant-ico">' + ico + '</div>' +
        '<div style="flex:1;min-width:0"><div class="plant-nom">' + etx(r.nombre) + '</div>' +
        '<div class="plant-meta">' + meta.join(' · ') + '</div></div>' +
        '<div class="plant-go">›</div></div>';
}
function _recSec(txt){ return '<div class="plant-sec"><span>' + txt + '</span><i></i></div>'; }

function _pintarRecetas(){
    var q = (document.getElementById('recBuscar').value || '').toLowerCase().trim();
    var lista = (RECETAS||[]).filter(function(r){
        return !q || (r.nombre||'').toLowerCase().indexOf(q) >= 0 || (r.grupo||'').toLowerCase().indexOf(q) >= 0;
    });
    if (!lista.length) {
        document.getElementById('recList').innerHTML =
            '<div class="plant-meta" style="padding:16px 2px">' +
            (q ? 'Ninguna receta con ese nombre.' : 'Todavía no hay recetas de tu área.') + '</div>';
        _RECVIS = [];
        return;
    }
    /* Los platillos primero y las preparaciones después: quien busca "cómo se
       hace el aguachile" no quiere tropezar antes con quince adobos. El índice va
       contra el ORDEN PINTADO, no contra el filtrado, o el detalle abriría otra. */
    var platos = lista.filter(function(r){ return !_esSubReceta(r); });
    var subs   = lista.filter(_esSubReceta);
    _RECVIS = platos.concat(subs);

    var html = '', i = 0;
    if (platos.length) {
        if (subs.length) html += _recSec('🍽️ Recetas');
        platos.forEach(function(r){ html += _recCard(r, i++); });
    }
    if (subs.length) {
        if (platos.length) html += _recSec('🧪 Preparaciones y bases');
        subs.forEach(function(r){ html += _recCard(r, i++); });
    }
    document.getElementById('recList').innerHTML = html;
}
var _RECVIS = [];
function _verReceta(i){
    var r = _RECVIS[i]; if (!r) return;
    var ing = (r.ingredientes||[]).map(function(x){
        return '<tr><td style="padding:7px 0;border-bottom:1px solid var(--border)">' + etx(x.nombre||'—') +
            (x.desc ? '<div style="font-size:11px;color:var(--text-dim)">' + etx(x.desc) + '</div>' : '') + '</td>' +
            '<td style="padding:7px 0;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-weight:600">' +
            etx(x.cantidad||'') + ' <span style="color:var(--text-dim);font-weight:400">' + etx(x.unidad||'') + '</span></td></tr>';
    }).join('');
    document.getElementById('recFicha').innerHTML =
        '<div class="cap-title" style="font-size:22px;margin:4px 0 2px">' + etx(r.nombre) + '</div>' +
        '<div class="plant-meta" style="margin-bottom:14px">' +
            (_esSubReceta(r) ? '🧪 Preparación · ' : '') + etx(r.grupo||'') +
            (r.cristaleria ? ' · ' + etx(r.cristaleria) : '') + (r.tiempo ? ' · ⏱️ ' + etx(r.tiempo) : '') + '</div>' +
        (r.foto ? '<img src="' + etx(r.foto) + '" style="width:100%;border-radius:12px;margin-bottom:14px">' : '') +
        '<label class="lbl">Ingredientes</label>' +
        '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px">' + ing + '</table>' +
        (r.procedimiento
            ? '<label class="lbl">Procedimiento</label><div style="font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--text-muted)">' + etx(r.procedimiento) + '</div>'
            : '');
    _show('recDetalle');
}

/* ── Guías de uso ── */
async function _verGuias(){
    _show('guiaScreen');
    var cont = document.getElementById('guiaList');
    if (GUIAS === null) {
        cont.innerHTML = '<div class="plant-meta" style="padding:16px 2px">Cargando guías…</div>';
        try {
            var r = await _supabase.rpc('portal_guias', { p_neg: NEG, p_token: TOKEN, p_niphash: _NIPHASH });
            if (r.error) throw new Error(r.error.message);
            GUIAS = r.data || [];
        } catch (e) {
            GUIAS = [];
            cont.innerHTML = '<div class="cap-msg err">No se pudieron cargar las guías.<br>' +
                '<span style="font-size:11px">' + etx((e&&e.message)||e) + ' — ¿se corrió la migración v46?</span></div>';
            return;
        }
    }
    if (!GUIAS.length) { cont.innerHTML = '<div class="plant-meta" style="padding:16px 2px">Todavía no hay guías para tu área.</div>'; return; }
    var porCat = {}, orden = [];
    GUIAS.forEach(function(g){ var c = g.categoria || 'General'; if(!porCat[c]){porCat[c]=[];orden.push(c);} porCat[c].push(g); });
    cont.innerHTML = orden.map(function(c){
        return '<label class="lbl">' + etx(c) + '</label>' + porCat[c].map(function(g){
            return '<a class="plant-card" href="' + etx(g.url) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">' +
                '<div class="plant-ico">' + (g.tipo==='video'?'▶️':'📕') + '</div>' +
                '<div style="flex:1;min-width:0"><div class="plant-nom">' + etx(g.titulo) + '</div>' +
                (g.descripcion ? '<div class="plant-meta">' + etx(g.descripcion) + '</div>' : '') + '</div>' +
                '<div class="plant-go">›</div></a>';
        }).join('');
    }).join('');
}

function volverLista(){
    document.getElementById('capSub').textContent = '¿Qué check list vas a realizar?';
    RUN = null;
    var cont = document.getElementById('plantList');
    if (!PLANTILLAS.length){
        cont.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:20px 0">No hay check lists para esta sucursal. Créalos en Administrativo → Checklists.</div>';
    } else {
        cont.innerHTML = PLANTILLAS.map(function(p){
            var t = TIPO[p.tipo] || TIPO.otro;
            var nT = (p.tareas||[]).length;
            var meta = (t[1]) + (p.area ? ' · ' + etx(p.area) : '') + ' · ' + nT + ' tarea' + (nT!==1?'s':'');
            return '<button class="pl-btn" onclick="abrirRun(\''+p.id+'\')"><span class="pi">'+t[0]+'</span>'+
                '<span><span class="pt">'+etx(p.nombre||'Check list')+'</span><br><span class="pd">'+meta+'</span></span></button>';
        }).join('');
    }
    _show('listScreen');
}

function abrirRun(id){
    var p = PLANTILLAS.find(function(x){ return x.id===id; });
    if (!p) return;
    // Se sella CUÁNDO empezó: la hora de envío sola no dice si el check tomó tres
    // minutos o dos horas, que es justo lo que interesa revisar.
    RUN = { plant: p, marcas: {}, fotos: [], video: '', inicioTs: new Date().toISOString(), horaInicio: nowHora() };
    _t0 = Date.now();   // el cronómetro en pantalla mide ESTE check, igual que lo guardado
    document.getElementById('capSub').textContent = (TIPO[p.tipo]?TIPO[p.tipo][1]:'') + ' · ' + (p.nombre||'');
    document.getElementById('runNota').value = '';
    document.getElementById('runMsg').textContent = '';
    _renderTareas(); _renderFotos();
    _show('runScreen');
    window.scrollTo(0,0);
}

function _renderTareas(){
    var cont = document.getElementById('tareasList');
    var tareas = (RUN.plant.tareas||[]);
    cont.innerHTML = tareas.map(function(t){
        var est = RUN.marcas[t.id] || '';
        return '<div class="tk-row '+est+'" onclick="ciclar(\''+t.id+'\')">'+
            (t.freq ? '<span class="tk-freq">'+etx(t.freq)+'</span>' : '')+
            '<span class="tk-txt">'+etx(t.texto)+'</span>'+
            '<span class="tk-mark">'+(MARCA[est]||'')+'</span></div>';
    }).join('');
    _renderProg();
}
function ciclar(tid){
    RUN.marcas[tid] = CICLO[RUN.marcas[tid] || ''];
    _renderTareas();
}
function _renderProg(){
    var tareas = (RUN.plant.tareas||[]), tot = tareas.length;
    var ok = tareas.filter(function(t){ return RUN.marcas[t.id]==='ok'; }).length;
    var pct = tot ? Math.round(ok/tot*100) : 0;
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('progTxt').textContent = ok+' de '+tot+' hechas';
    document.getElementById('progPct').textContent = pct+'%';
    var col = pct>=90?'var(--green)':pct>=70?'#e0a52e':'#e05a3a';
    document.getElementById('progFill').style.background = col;
    document.getElementById('progPct').style.color = col;
}

/* ── Fotos (evidencia, hasta 6) ── */
var MAX_FOTOS = 7;
function _comprimir(file){
    return new Promise(function(resolve){
        var r=new FileReader();
        r.onload=function(e){ var img=new Image(); img.onload=function(){
            var w=img.width,h=img.height,M=1024; if(w>h){if(w>M){h=Math.round(h*M/w);w=M;}}else{if(h>M){w=Math.round(w*M/h);h=M;}}
            var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
            c.toBlob(function(b){resolve(b);},'image/jpeg',0.65);
        }; img.onerror=function(){resolve(null);}; img.src=e.target.result; };
        r.onerror=function(){resolve(null);}; r.readAsDataURL(file);
    });
}
async function _subirFotoBlob(file, msgEl){
    if (!file) return '';
    var blob = await _comprimir(file);
    if (!blob){ if(msgEl){msgEl.className='cap-msg err';msgEl.textContent='No se pudo procesar la imagen.';} return ''; }
    var path = NEG+'/entradas/'+TOKEN+'/'+genId()+'.jpg'; // mismo prefijo permitido para subida anónima (v28)
    var up = await _supabase.storage.from('evidencias').upload(path, blob, {contentType:'image/jpeg'});
    if (up.error){ if(msgEl){msgEl.className='cap-msg err';msgEl.textContent='Error al subir foto: '+up.error.message;} return ''; }
    return _supabase.storage.from('evidencias').getPublicUrl(path).data.publicUrl;
}
async function _addFoto(input){
    var files = Array.prototype.slice.call(input.files||[]); input.value='';
    if (!files.length || !RUN) return;
    var msg = document.getElementById('runMsg');
    for (var i=0;i<files.length;i++){
        if (RUN.fotos.length >= MAX_FOTOS){ msg.className='cap-msg err'; msg.textContent='Máximo '+MAX_FOTOS+' fotos.'; break; }
        msg.className='cap-msg'; msg.textContent='Subiendo foto '+(RUN.fotos.length+1)+'…';
        var url = await _subirFotoBlob(files[i], msg);
        if (url){ RUN.fotos.push(url); _renderFotos(); }
    }
    if (RUN.fotos.length){ msg.className='cap-msg ok'; msg.textContent='✓ '+RUN.fotos.length+' foto(s) listas'; }
}
function _delFoto(i){ RUN.fotos.splice(i,1); _renderFotos(); }
/* 60 segundos, no 5 minutos. La razón es dura: Supabase rechaza archivos de más de
   50 MB por defecto y un video de teléfono pesa ~60 MB POR MINUTO en 1080p (y ~190 MB
   en 4K). Con 5 minutos el colaborador grababa, esperaba la subida y recibía un error
   al final. Se valida la duración Y el peso, porque un clip corto en 4K también revienta
   el límite: la duración sola no basta. */
var MAX_VIDEO_SEG = 60;
var MAX_VIDEO_MB  = 45;    // margen bajo el tope de 50 MB de Storage
/* Se mide la duración ANTES de subir: rechazar después de gastar los datos del
   colaborador sería peor que no aceptar video. */
function _duracionVideo(file){
    return new Promise(function(res){
        try {
            var v = document.createElement('video');
            v.preload = 'metadata';
            v.onloadedmetadata = function(){ URL.revokeObjectURL(v.src); res(v.duration || 0); };
            v.onerror = function(){ res(0); };
            v.src = URL.createObjectURL(file);
        } catch(e){ res(0); }
    });
}
async function _addVideo(input){
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var msg = document.getElementById('runMsg');
    var seg = await _duracionVideo(f);
    if (seg > MAX_VIDEO_SEG + 2){
        msg.className='cap-msg err';
        msg.textContent = 'El video dura '+Math.round(seg)+' s. El máximo es 1 minuto — graba uno más corto.';
        return;
    }
    var mb = f.size / 1048576;
    if (mb > MAX_VIDEO_MB){
        msg.className='cap-msg err';
        msg.textContent = 'El video pesa '+Math.round(mb)+' MB y el máximo son '+MAX_VIDEO_MB+' MB. '
            + 'Graba en menor calidad (Ajustes → Cámara → 1080p) o más corto.';
        return;
    }
    msg.className='cap-msg'; msg.textContent = 'Subiendo video… (puede tardar)';
    // MISMO prefijo que las fotos: es el único que la política de Storage permite
    // subir sin sesión (v28). Con otra ruta el colaborador recibiría un 403.
    var url = '';
    try {
        var path = NEG+'/entradas/'+TOKEN+'/'+genId()+'.'+((f.name||'').split('.').pop()||'mp4').toLowerCase();
        var up = await _supabase.storage.from('evidencias').upload(path, f, { contentType: f.type || 'video/mp4' });
        if (!up.error) url = _supabase.storage.from('evidencias').getPublicUrl(path).data.publicUrl;
        else { msg.className='cap-msg err'; msg.textContent='Error al subir el video: '+up.error.message; return; }
    } catch(e){ msg.className='cap-msg err'; msg.textContent='Error al subir el video.'; return; }
    if (!url){ msg.className='cap-msg err'; msg.textContent='No se pudo subir el video. Intenta de nuevo.'; return; }
    RUN.video = url;
    RUN.videoSeg = Math.round(seg);
    _renderVideo();
    msg.className='cap-msg ok'; msg.textContent = '✓ Video listo ('+_mmss(seg)+')';
}
function _mmss(seg){ var m=Math.floor(seg/60), s=Math.round(seg%60); return m+':'+String(s).padStart(2,'0'); }
function _delVideo(){ RUN.video=''; RUN.videoSeg=0; _renderVideo(); }
function _renderVideo(){
    var box = document.getElementById('runVidBox'); if (!box) return;
    box.innerHTML = RUN.video
        ? '<div style="display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px">'
          + '<span style="font-size:18px">🎥</span>'
          + '<span style="flex:1;font-size:13px;color:var(--text)">Video adjunto <span style="color:var(--dim)">· '+_mmss(RUN.videoSeg||0)+'</span></span>'
          + '<button onclick="_delVideo()" style="background:none;border:none;color:#e05a3a;font-size:18px;cursor:pointer">✕</button></div>'
        : '';
}
function _renderFotos(){
    document.getElementById('runFotoCnt').textContent = RUN.fotos.length+' / '+MAX_FOTOS+' fotos';
    document.getElementById('runFotoStrip').innerHTML = RUN.fotos.map(function(u,i){
        return '<div class="fs-it"><img src="'+etx(u)+'"><button class="fs-del" onclick="_delFoto('+i+')">✕</button></div>';
    }).join('');
}

/* ── Registrar cumplimiento ── */
async function registrarCumplimiento(){
    var msg = document.getElementById('runMsg'); msg.className='cap-msg'; msg.textContent='';
    // (Sin corte por tiempo: el check puede tomar lo que tome. El NIP se revalida
    //  en la RPC en cada registro, que es lo que de verdad autoriza.)
    if (!RUN) return;
    var tareas = (RUN.plant.tareas||[]), tot = tareas.length;
    var ok=0, no=0, pend=0;
    tareas.forEach(function(t){ var m=RUN.marcas[t.id]; if(m==='ok')ok++; else if(m==='no')no++; else if(m==='pend')pend++; });
    if (ok+no+pend === 0){ msg.className='cap-msg err'; msg.textContent='Marca al menos una tarea.'; return; }
    var pct = tot ? Math.round(ok/tot*100) : 0;
    var btn = document.getElementById('runBtn'); btn.disabled = true; msg.textContent = 'Registrando…';
    var entry = {
        id: genId()+genId(),
        plantillaId: RUN.plant.id,
        plantillaNombre: RUN.plant.nombre || '',
        tipo: RUN.plant.tipo || 'otro',
        area: RUN.plant.area || '',
        sucursalId: SUC,
        fecha: todayStr(),
        hora: nowHora(),                 // hora de ENVÍO (se conserva el nombre de siempre)
        horaInicio: RUN.horaInicio || '',
        inicioTs: RUN.inicioTs || '',
        finTs: new Date().toISOString(),
        duracionMin: RUN.inicioTs ? Math.max(0, Math.round((Date.now() - Date.parse(RUN.inicioTs)) / 60000)) : null,
        marcas: RUN.marcas,
        totalTareas: tot,
        cumplidas: ok,
        noRealizadas: no,
        pendientes: pend,
        pct: pct,
        notas: (document.getElementById('runNota').value||'').trim(),
        foto_url: RUN.fotos[0] || '',
        foto_urls: RUN.fotos.slice(),
        video_url: RUN.video || '',
        video_seg: RUN.videoSeg || 0,
        registrado: new Date().toISOString()
        // colaborador lo sella el servidor (RPC) desde el NIP validado
    };
    try {
        var r = await _supabase.rpc('checklist_registrar', { p_neg: NEG, p_token: TOKEN, p_niphash: _NIPHASH, p_datos: entry });
        if (r.error) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='No se pudo guardar: '+r.error.message; return; }
        btn.disabled=false;
        var col = pct>=90?'var(--green)':pct>=70?'#e0a52e':'#e05a3a';
        var d = document.getElementById('donedPct'); d.textContent = pct+'%'; d.style.color = col;
        document.getElementById('doneTitle').textContent = '✓ ' + (RUN.plant.nombre||'Check list') + ' registrado';
        document.getElementById('doneSub').innerHTML = '<b>'+etx(COLAB)+'</b> · '+ok+' hechas · '+no+' no · '+pend+' pendientes<br>'
            + todayStr()+' · inicio '+etx(entry.horaInicio||'—')+' → envío '+entry.hora
            + (entry.duracionMin!=null ? ' <span style="opacity:.7">('+entry.duracionMin+' min)</span>' : '');
        document.getElementById('capSub').textContent = '';
        _show('doneScreen');
        window.scrollTo(0,0);
    } catch (e) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e); }
}

document.addEventListener('DOMContentLoaded', function(){
    if (!NEG || !TOKEN) { _err('Este QR no es válido o está incompleto.<br>Genera uno nuevo desde Checklists → 📱 QR de check list.'); return; }
    document.getElementById('pinInput').focus();
    document.getElementById('pinInput').addEventListener('keydown', function(e){ if (e.key==='Enter') entrar(); });
});
</script>
