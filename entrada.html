<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ETAAX – Registro de barra/cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 40px;box-sizing:border-box}
.cap-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;padding:24px 22px;text-align:center}
.cap-logo{margin-bottom:14px}
.cap-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text)}
.cap-sub{font-size:13px;color:var(--text-dim);margin:4px 0 18px}
label.lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);display:block;margin:0 0 6px;text-align:left}
.fld{width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;margin-bottom:14px}
#pinInput{text-align:center;letter-spacing:10px;font-size:26px;font-weight:600}
.cap-btn{display:block;width:100%;box-sizing:border-box;background:var(--green);color:#0a0908;border:none;border-radius:10px;padding:15px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.cap-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-weight:500}
/* iOS Safari: los input date usan ancho intrínseco y se salen del recuadro
   si no se les quita la apariencia nativa */
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left}
.cap-par{display:flex;gap:10px;margin-top:8px}
.cap-par .cap-btn{flex:1;margin-top:0;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:15px;padding:15px 8px;min-height:54px}
@media(max-width:380px){.cap-par .cap-btn{font-size:13.5px;gap:5px}}

.cap-btn:disabled{opacity:.5}
.cap-msg{font-size:13px;margin-top:12px;min-height:18px}
.cap-msg.ok{color:var(--green)} .cap-msg.err{color:var(--red)}
.row{display:flex;gap:10px}.row>*{flex:1}
.buscaList{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:9px;margin-bottom:14px;text-align:left}
.ins-it{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--text)}
.ins-it:active{background:var(--surface2)}
.ins-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(61,190,122,.12);border:1px solid var(--green);border-radius:9px;padding:11px 13px;margin-bottom:14px;text-align:left}
.ins-sel b{color:var(--text);font-size:14px}
.chip{font-size:12px;color:var(--text-dim)}
#countBox{font-size:12px;color:var(--text-dim);margin:-6px 0 14px}
.thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);margin:0 auto 12px;display:block}
.quien{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:13px;color:var(--text);text-align:left}
/* Menú de conceptos */
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:12px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.menu-btn:active{border-color:var(--green)}
.menu-btn .mi{font-size:30px;flex-shrink:0}
.menu-btn .mt{font-size:15px;font-weight:600;color:var(--text)}
.menu-btn .md{font-size:12px;color:var(--text-dim);margin-top:2px}
/* Chips de área y de tipo de merma */
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips button{flex:1;min-width:90px;background:transparent;border:1.5px solid var(--border);color:var(--text-muted);border-radius:20px;padding:9px 8px;font-size:13px;cursor:pointer;font-family:inherit}
.chips button.on{border-color:var(--green);background:rgba(61,190,122,.12);color:var(--green);font-weight:600}
.volver{background:transparent;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:10px;display:block}
</style>
</head>
<body>
<div class="cap-card">
    <div class="cap-logo">
        <svg width="120" height="29" viewBox="0 0 300 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 31C4 19.5 12.5 10.5 25 10.5C37.5 10.5 45.5 19.5 45.5 30.5C45.5 32 45.3 33.5 45 35H14C15.5 40.5 19.5 44 25 44C29.5 44 33 42 35 39.5L43.5 43.5C40 49.5 33 53 25 53C12.5 53 4 44 4 31Z" fill="#f0ece4"/>
            <circle cx="45" cy="11" r="6" fill="#f5c842"/>
            <path d="M52 12H61V21H72V30H61V42C61 44.8 62.5 46 65 46H72V54.5H64.5C57 54.5 52 50.5 52 43V30H46V21H52V12Z" fill="#f0ece4"/>
            <path d="M168 13H179L190 30L201 13H212L196.5 34.5L213 54.5H202L190 38.5L178 54.5H167L183.5 34.5L168 13Z" fill="#f0ece4"/>
        </svg>
    </div>
    <div class="cap-title" id="capTitle">Registro de barra / cocina</div>
    <div class="cap-sub" id="capSub">Identifícate con tu PIN</div>

    <!-- ── Pantalla PIN ── -->
    <div id="pinScreen">
        <label class="lbl">PIN de 5 dígitos</label>
        <input id="pinInput" class="fld" type="tel" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off">
        <button class="cap-btn" id="pinBtn" onclick="entrar()">Entrar</button>
        <div class="cap-msg" id="pinMsg"></div>
    </div>

    <!-- ── Pantalla MENÚ: qué vas a registrar ── -->
    <div id="menuScreen" style="display:none">
        <div class="quien">👤 Registra: <b id="quienNom">—</b></div>
        <div id="countBox">⏱️ Esta sesión expira en <b id="countVal" style="color:var(--text)">5:00</b></div>
        <button class="menu-btn" onclick="irEntrada()">
            <span class="mi">📦</span>
            <span><span class="mt">Entrada de insumos</span><br><span class="md">Llegó mercancía: compra, bonificación o consignación</span></span>
        </button>
        <button class="menu-btn" onclick="irMerma()">
            <span class="mi">🍷</span>
            <span><span class="mt">Merma</span><br><span class="md">Se rompió, derramó o desperdició un insumo o un producto del menú</span></span>
        </button>
    </div>

    <!-- ── Pantalla ENTRADA de insumos ── -->
    <div id="formScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsEnt"></div>

        <label class="lbl">Insumo</label>
        <input id="insBusca" class="fld" placeholder="Buscar insumo…" oninput="filtrarIns(this.value)" autocomplete="off">
        <div id="insSelBox"></div>
        <div id="insList" class="buscaList"></div>

        <div class="row">
            <div>
                <label class="lbl">Tipo</label>
                <select id="entTipo" class="fld">
                    <option value="compra">Compra</option>
                    <option value="bonificacion">Bonificación</option>
                    <option value="consignacion">Consignación</option>
                </select>
            </div>
            <div>
                <label class="lbl">Cantidad</label>
                <input id="entCant" class="fld" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
        </div>

        <label class="lbl">Fecha</label>
        <input id="entFecha" class="fld" type="date">

        <label class="lbl">Nota (opcional)</label>
        <input id="entNota" class="fld" placeholder="Proveedor, ticket, etc.">

        <img id="fotoThumb" class="thumb" style="display:none">
        <input type="file" id="fotoInputCam" accept="image/*" capture="environment" style="display:none" onchange="onFoto(this)">
        <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="onFoto(this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('fotoInputCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('fotoInput').click()">🖼️ Galería</button>
        </div>

        <button class="cap-btn" id="regBtn" style="margin-top:12px" onclick="registrar()">✓ Registrar entrada</button>
        <div class="cap-msg" id="formMsg"></div>
    </div>

    <!-- ── Pantalla MERMA (insumo o producto del menú) ── -->
    <div id="mermaScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsMer"></div>

        <label class="lbl">¿Qué se mermó?</label>
        <div class="chips" id="merTipoChips">
            <button id="merTipoIns" class="on" onclick="setMermaTipo('insumo')">🧴 Insumo</button>
            <button id="merTipoProd" onclick="setMermaTipo('producto')">🍹 Producto del menú</button>
        </div>

        <input id="merBusca" class="fld" placeholder="Buscar insumo…" oninput="filtrarMer(this.value)" autocomplete="off">
        <div id="merSelBox"></div>
        <div id="merList" class="buscaList"></div>

        <div class="row">
            <div>
                <label class="lbl">Cantidad</label>
                <input id="merCant" class="fld" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
            <div>
                <label class="lbl">Unidad</label>
                <select id="merUnidad" class="fld">
                    <option value="copa">Copa(s)</option>
                    <option value="oz">Onza(s)</option>
                    <option value="ml">ml</option>
                    <option value="botella">Botella(s)</option>
                    <option value="pza">Pieza(s)</option>
                    <option value="g">Gramos</option>
                    <option value="porcion">Porción(es)</option>
                </select>
            </div>
        </div>

        <label class="lbl">Motivo</label>
        <select id="merMotivo" class="fld">
            <option value="se_rompio">Se rompió</option>
            <option value="se_derramo">Se derramó</option>
            <option value="mal_preparado">Mal preparado / regresado</option>
            <option value="caducado">Caducado / en mal estado</option>
            <option value="otro">Otro</option>
        </select>

        <label class="lbl">Nota (opcional)</label>
        <input id="merNota" class="fld" placeholder="Detalle de lo que pasó…">

        <img id="merFotoThumb" class="thumb" style="display:none">
        <input type="file" id="merFotoInputCam" accept="image/*" capture="environment" style="display:none" onchange="onFotoMer(this)">
        <input type="file" id="merFotoInput" accept="image/*" style="display:none" onchange="onFotoMer(this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('merFotoInputCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('merFotoInput').click()">🖼️ Galería</button>
        </div>

        <button class="cap-btn" id="merBtn" style="margin-top:12px;background:var(--red);color:#fff" onclick="registrarMerma()">✓ Registrar merma</button>
        <div class="cap-msg" id="merMsg"></div>
    </div>

    <!-- ── Pantalla error ── -->
    <div id="errScreen" style="display:none">
        <div style="font-size:38px;margin:10px 0">🔒</div>
        <div id="errTxt" style="font-size:13px;color:var(--text-dim);line-height:1.6"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
(function(){var s=localStorage.getItem('etaax_theme')||'dark';document.documentElement.setAttribute('data-theme',s);})();
function _q(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function etx(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Mismo hash que security.js (_hashPwdStaff): el NIP del staff se guarda como nipHash = v2$sha256('etaax-staff|nip|'+pin)
async function _hashNip(pin){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('etaax-staff|nip|' + pin));
    return 'v2$' + Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}

var NEG = _q('n') || _q('neg');
var TOKEN = _q('t');             // token secreto del negocio (va en el QR) — NO requiere login
var SUC = _q('s') || '';         // sucursal del QR (cada sucursal imprime SU QR) — sella cada registro
// ¿El insumo/receta pertenece a la sucursal del QR? (compat: sin lista de sucursales = visible)
function _enSucQR(x){
    if (!SUC || !x) return true;
    if ((x.inactivoEn||[]).indexOf(SUC) >= 0 || (x.inactivaEn||[]).indexOf(SUC) >= 0) return false; // pausado ahí
    var ss = (x.sucursales && x.sucursales.length) ? x.sucursales : (x.sucursalId ? [x.sucursalId] : null);
    if (!ss || !ss.length) return true;
    return ss.indexOf(SUC) >= 0;
}
var VIDA_MS = 300000;            // la sesión / ventana para subir la foto dura 5 minutos
var COLAB = '', _NIPHASH = '', INSUMOS = [], SEL = null, FOTO_URL = '', _countTimer = null, _t0 = 0;
var RECETAS = null;              // menú del negocio (lazy: se carga al entrar a merma de producto)
var AREA = 'barra';              // área elegida (aplica a entrada Y merma)
var MERMA_TIPO = 'insumo';       // 'insumo' | 'producto'
var MSEL = null, MFOTO_URL = '';

var AREAS = [ ['barra','🍸 Barra'], ['cocina','🍳 Cocina'], ['almacen','📦 Almacén'] ];
function _pintarAreas(){
    ['areaChipsEnt','areaChipsMer'].forEach(function(cid){
        var c = document.getElementById(cid); if (!c) return;
        c.innerHTML = AREAS.map(function(a){
            return '<button class="'+(AREA===a[0]?'on':'')+'" onclick="setArea(\''+a[0]+'\')">'+a[1]+'</button>';
        }).join('');
    });
}
function setArea(a){ AREA = a; _pintarAreas(); }

function _show(id){ ['pinScreen','menuScreen','formScreen','mermaScreen','errScreen'].forEach(function(x){ document.getElementById(x).style.display = x===id?'block':'none'; }); }
function _err(txt){ document.getElementById('errTxt').innerHTML = txt; document.getElementById('capSub').textContent = ''; _show('errScreen'); if(_countTimer){clearInterval(_countTimer);_countTimer=null;} }
function volverMenu(){ document.getElementById('capSub').textContent='¿Qué vas a registrar?'; _show('menuScreen'); }
function irEntrada(){ document.getElementById('capSub').textContent='Registra insumos que llegaron'; _pintarAreas(); _show('formScreen'); }
async function irMerma(){
    document.getElementById('capSub').textContent='Registra lo que se mermó';
    _pintarAreas(); setMermaTipo(MERMA_TIPO);
    _show('mermaScreen');
}

async function entrar(){
    var pin = (document.getElementById('pinInput').value || '').trim();
    var msg = document.getElementById('pinMsg'); msg.className = 'cap-msg'; msg.textContent = '';
    if (!/^\d{4,6}$/.test(pin)) { msg.className='cap-msg err'; msg.textContent='Pon tu NIP (5 dígitos).'; return; }
    var btn = document.getElementById('pinBtn'); btn.disabled = true; msg.textContent = 'Validando…';
    try {
        var h = await _hashNip(pin);
        // 1) Validar token + NIP en el SERVIDOR (sin sesión, login efímero por RPC).
        var rv = await _supabase.rpc('entrada_validar_nip', { p_neg: NEG, p_token: TOKEN, p_niphash: h });
        if (rv.error) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'No se pudo validar.<br><span style="font-size:11px;color:var(--text-dim)">' + etx(rv.error.message) + ' — ¿se corrió la migración v27 en Supabase?</span>';
            return;
        }
        if (!rv.data) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'NIP no reconocido.<br><span style="font-size:11px;color:var(--text-dim)">Verifica con tu encargado tu NIP de 5 dígitos (Gestión de Staff). El rol "Jefe de Barra" usa usuario/contraseña, no NIP.</span>';
            return;
        }
        COLAB = rv.data; _NIPHASH = h;
        // 2) Cargar insumos (token-gated, también por RPC).
        var ri = await _supabase.rpc('entrada_insumos', { p_neg: NEG, p_token: TOKEN });
        INSUMOS = (ri.data || []).filter(function(x){ return x && x.id && x.activo !== '0' && _enSucQR(x); }); // solo los de ESTA sucursal
        INSUMOS.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
        // 3) Menú de conceptos.
        document.getElementById('quienNom').textContent = COLAB;
        document.getElementById('entFecha').value = todayStr();
        filtrarIns('');
        volverMenu();
        _t0 = Date.now(); _tick(); _countTimer = setInterval(_tick, 1000);
    } catch (e) {
        btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e);
    }
}

function _tick(){
    var rest = Math.max(0, _t0 + VIDA_MS - Date.now());
    var s = Math.ceil(rest/1000);
    var el = document.getElementById('countVal'); if (el) el.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if (rest <= 0) { _err('Tu sesión expiró (dura 5&nbsp;minutos).<br>Vuelve a escanear el QR e ingresa tu PIN.'); }
}

/* ── ENTRADA: buscador de insumos ── */
function filtrarIns(q){
    q = (q||'').toLowerCase();
    var lista = INSUMOS.filter(function(x){
        return !q || (x.nombre||'').toLowerCase().indexOf(q)>=0 || (x.marca||'').toLowerCase().indexOf(q)>=0 || (x.variedad||'').toLowerCase().indexOf(q)>=0;
    }).slice(0, 60);
    document.getElementById('insList').innerHTML = lista.length
        ? lista.map(function(x){
            var sub = [x.variedad, x.marca].filter(Boolean).join(' · ');
            return '<div class="ins-it" onclick="selIns(\''+x.id+'\')">'+etx(x.nombre)+(sub?' <span class="chip">'+etx(sub)+'</span>':'')+'</div>';
        }).join('')
        : '<div class="ins-it" style="color:var(--text-dim);cursor:default">Sin resultados</div>';
}
function selIns(id){
    SEL = INSUMOS.find(function(x){ return x.id===id; });
    if (!SEL) return;
    var sub = [SEL.variedad, SEL.marca].filter(Boolean).join(' · ');
    document.getElementById('insSelBox').innerHTML =
        '<div class="ins-sel"><div><b>'+etx(SEL.nombre)+'</b>'+(sub?'<div class="chip">'+etx(sub)+'</div>':'')+'</div>'+
        '<button class="cap-btn ghost" style="width:auto;margin:0;padding:6px 12px" onclick="limpiarIns()">cambiar</button></div>';
    document.getElementById('insList').innerHTML = '';
    document.getElementById('insBusca').value = '';
}
function limpiarIns(){ SEL=null; document.getElementById('insSelBox').innerHTML=''; filtrarIns(''); }

/* ── MERMA: insumo o producto del menú ── */
function setMermaTipo(t){
    MERMA_TIPO = t; MSEL = null;
    document.getElementById('merTipoIns').className  = t==='insumo'   ? 'on' : '';
    document.getElementById('merTipoProd').className = t==='producto' ? 'on' : '';
    document.getElementById('merBusca').placeholder = t==='insumo' ? 'Buscar insumo…' : 'Buscar producto del menú…';
    document.getElementById('merBusca').value = '';
    document.getElementById('merSelBox').innerHTML = '';
    // Unidad default según tipo: producto = pza; insumo = copa.
    document.getElementById('merUnidad').value = t==='producto' ? 'pza' : 'copa';
    if (t === 'producto' && RECETAS === null) _cargarRecetas();
    else filtrarMer('');
}
async function _cargarRecetas(){
    document.getElementById('merList').innerHTML = '<div class="ins-it" style="color:var(--text-dim);cursor:default">Cargando menú…</div>';
    try {
        var rr = await _supabase.rpc('entrada_recetas', { p_neg: NEG, p_token: TOKEN });
        RECETAS = (rr.data || []).filter(function(x){ return x && x.id && _enSucQR(x); });
        RECETAS.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
    } catch(e) { RECETAS = []; }
    if (!RECETAS.length) {
        document.getElementById('merList').innerHTML = '<div class="ins-it" style="color:var(--text-dim);cursor:default">No se pudo cargar el menú (¿se corrió la migración v32?)</div>';
        return;
    }
    filtrarMer('');
}
function _mermaFuente(){ return MERMA_TIPO === 'producto' ? (RECETAS || []) : INSUMOS; }
function filtrarMer(q){
    q = (q||'').toLowerCase();
    var lista = _mermaFuente().filter(function(x){
        return !q || (x.nombre||'').toLowerCase().indexOf(q)>=0 || (x.marca||'').toLowerCase().indexOf(q)>=0 || (x.variedad||'').toLowerCase().indexOf(q)>=0 || (x.grupo||'').toLowerCase().indexOf(q)>=0;
    }).slice(0, 60);
    document.getElementById('merList').innerHTML = lista.length
        ? lista.map(function(x){
            var sub = MERMA_TIPO==='producto' ? (x.grupo||'') : [x.variedad, x.marca].filter(Boolean).join(' · ');
            return '<div class="ins-it" onclick="selMer(\''+x.id+'\')">'+etx(x.nombre)+(sub?' <span class="chip">'+etx(sub)+'</span>':'')+'</div>';
        }).join('')
        : '<div class="ins-it" style="color:var(--text-dim);cursor:default">Sin resultados</div>';
}
function selMer(id){
    MSEL = _mermaFuente().find(function(x){ return x.id===id; });
    if (!MSEL) return;
    var sub = MERMA_TIPO==='producto' ? (MSEL.grupo||'') : [MSEL.variedad, MSEL.marca].filter(Boolean).join(' · ');
    document.getElementById('merSelBox').innerHTML =
        '<div class="ins-sel"><div><b>'+etx(MSEL.nombre)+'</b>'+(sub?'<div class="chip">'+etx(sub)+'</div>':'')+'</div>'+
        '<button class="cap-btn ghost" style="width:auto;margin:0;padding:6px 12px" onclick="limpiarMer()">cambiar</button></div>';
    document.getElementById('merList').innerHTML = '';
    document.getElementById('merBusca').value = '';
}
function limpiarMer(){ MSEL=null; document.getElementById('merSelBox').innerHTML=''; filtrarMer(''); }

/* ── Foto (compartida): compresión agresiva para señal de cocina ── */
function _comprimir(file){
    return new Promise(function(resolve){
        var r=new FileReader();
        r.onload=function(e){ var img=new Image(); img.onload=function(){
            // 1024px / 65%: mitad de peso que antes (1280/72) → sube al doble de rápido con señal débil.
            var w=img.width,h=img.height,M=1024; if(w>h){if(w>M){h=Math.round(h*M/w);w=M;}}else{if(h>M){w=Math.round(w*M/h);h=M;}}
            var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
            c.toBlob(function(b){resolve(b);},'image/jpeg',0.65);
        }; img.onerror=function(){resolve(null);}; img.src=e.target.result; };
        r.onerror=function(){resolve(null);}; r.readAsDataURL(file);
    });
}
async function _subirFoto(input, msgEl, thumbId){
    var f = input.files && input.files[0]; input.value='';
    if (!f) return '';
    msgEl.className='cap-msg'; msgEl.textContent='Subiendo foto…';
    var blob = await _comprimir(f);
    if (!blob){ msgEl.className='cap-msg err'; msgEl.textContent='No se pudo procesar la imagen.'; return ''; }
    var path = NEG+'/entradas/'+TOKEN+'/'+genId()+'.jpg'; // path validado por la política de v28
    var up = await _supabase.storage.from('evidencias').upload(path, blob, {contentType:'image/jpeg'});
    if (up.error){ msgEl.className='cap-msg err'; msgEl.textContent='Error al subir foto: '+up.error.message+' (¿corriste v28?)'; return ''; }
    var url = _supabase.storage.from('evidencias').getPublicUrl(path).data.publicUrl;
    var im=document.getElementById(thumbId); im.src=url; im.style.display='block';
    msgEl.className='cap-msg ok'; msgEl.textContent='✓ Foto lista';
    return url;
}
async function onFoto(input){ FOTO_URL = await _subirFoto(input, document.getElementById('formMsg'), 'fotoThumb') || FOTO_URL; }
async function onFotoMer(input){ MFOTO_URL = await _subirFoto(input, document.getElementById('merMsg'), 'merFotoThumb') || MFOTO_URL; }

/* ── Registrar ENTRADA ── */
async function registrar(){
    var msg = document.getElementById('formMsg'); msg.className='cap-msg'; msg.textContent='';
    if (Date.now() - _t0 >= VIDA_MS) { _err('Tu sesión expiró.<br>Vuelve a escanear el QR.'); return; }
    if (!SEL) { msg.className='cap-msg err'; msg.textContent='Elige un insumo.'; return; }
    var cant = parseFloat(document.getElementById('entCant').value) || 0;
    if (cant <= 0) { msg.className='cap-msg err'; msg.textContent='Pon una cantidad mayor a 0.'; return; }
    var btn = document.getElementById('regBtn'); btn.disabled = true; msg.textContent = 'Registrando…';
    var entry = {
        id: genId()+genId(),
        concepto: 'entrada',
        sucursalId: SUC,
        area: AREA,
        insumoId: SEL.id,
        nombre: SEL.nombre + (SEL.variedad ? ' '+SEL.variedad : ''),
        familia: SEL.familia || SEL.categoria || '',
        cantidad: cant,
        costo: 0,
        tipo: document.getElementById('entTipo').value,
        notas: (document.getElementById('entNota').value||'').trim(),
        fecha: document.getElementById('entFecha').value || todayStr(),
        registrado: new Date().toISOString(),
        foto_url: FOTO_URL || ''
        // registradoPor lo sella el servidor (RPC) a partir del NIP validado
    };
    try {
        var ins = await _supabase.rpc('entrada_registrar', { p_neg: NEG, p_token: TOKEN, p_niphash: _NIPHASH, p_datos: entry });
        if (ins.error) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='No se pudo guardar: '+ins.error.message; return; }
        // Reset para la siguiente entrada (la sesión sigue viva).
        limpiarIns();
        document.getElementById('entCant').value=''; document.getElementById('entNota').value='';
        FOTO_URL=''; var im=document.getElementById('fotoThumb'); im.style.display='none'; im.src='';
        btn.disabled=false;
        msg.className='cap-msg ok'; msg.textContent='✓ Entrada de '+etx(entry.nombre)+' registrada. Puedes capturar otra.';
    } catch (e) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e); }
}

/* ── Registrar MERMA ── */
async function registrarMerma(){
    var msg = document.getElementById('merMsg'); msg.className='cap-msg'; msg.textContent='';
    if (Date.now() - _t0 >= VIDA_MS) { _err('Tu sesión expiró.<br>Vuelve a escanear el QR.'); return; }
    if (!MSEL) { msg.className='cap-msg err'; msg.textContent = MERMA_TIPO==='producto' ? 'Elige el producto del menú.' : 'Elige el insumo.'; return; }
    var cant = parseFloat(document.getElementById('merCant').value) || 0;
    if (cant <= 0) { msg.className='cap-msg err'; msg.textContent='Pon una cantidad mayor a 0.'; return; }
    var btn = document.getElementById('merBtn'); btn.disabled = true; msg.textContent = 'Registrando…';
    var entry = {
        id: genId()+genId(),
        concepto: 'merma',                     // se importa como MERMA del inventario de su sucursal
        sucursalId: SUC,
        mermaTipo: MERMA_TIPO,                 // 'insumo' | 'producto'
        area: AREA,
        insumoId: MERMA_TIPO==='insumo'   ? MSEL.id : '',
        recetaId: MERMA_TIPO==='producto' ? MSEL.id : '',
        nombre: MSEL.nombre + (MSEL.variedad ? ' '+MSEL.variedad : ''),
        familia: MSEL.familia || MSEL.categoria || MSEL.grupo || '',
        cantidad: cant,
        unidad: document.getElementById('merUnidad').value,
        motivo: document.getElementById('merMotivo').value,
        notas: (document.getElementById('merNota').value||'').trim(),
        fecha: todayStr(),
        registrado: new Date().toISOString(),
        foto_url: MFOTO_URL || ''
    };
    try {
        var ins = await _supabase.rpc('entrada_registrar', { p_neg: NEG, p_token: TOKEN, p_niphash: _NIPHASH, p_datos: entry });
        if (ins.error) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='No se pudo guardar: '+ins.error.message; return; }
        limpiarMer();
        document.getElementById('merCant').value=''; document.getElementById('merNota').value='';
        MFOTO_URL=''; var im=document.getElementById('merFotoThumb'); im.style.display='none'; im.src='';
        btn.disabled=false;
        msg.className='cap-msg ok'; msg.textContent='✓ Merma de '+etx(entry.nombre)+' registrada. Puedes capturar otra.';
    } catch (e) { btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e); }
}

document.addEventListener('DOMContentLoaded', function(){
    if (!NEG || !TOKEN) { _err('Este QR no es válido o está incompleto.<br>Genera uno nuevo desde Inventarios → 📱 QR de entradas.'); return; }
    document.getElementById('pinInput').focus();
    document.getElementById('pinInput').addEventListener('keydown', function(e){ if (e.key==='Enter') entrar(); });
});
