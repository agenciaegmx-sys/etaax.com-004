<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<script src="/negocio-tab.js"></script><!-- negocio activo POR PESTAÑA: debe ir primero -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ETAAX – Registro de barra/cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 40px;box-sizing:border-box}
.cap-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;padding:24px 22px;text-align:center}
.cap-logo{margin-bottom:14px}
.cap-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text)}
.cap-sub{font-size:13px;color:var(--text-dim);margin:4px 0 18px}
label.lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);display:block;margin:0 0 6px;text-align:left}
.fld{width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;margin-bottom:14px}
#pinInput{text-align:center;letter-spacing:10px;font-size:26px;font-weight:600}
.cap-btn{display:block;width:100%;box-sizing:border-box;background:var(--green);color:#0a0908;border:none;border-radius:10px;padding:15px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.cap-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-weight:500}
/* iOS Safari: los input date usan ancho intrínseco y se salen del recuadro
   si no se les quita la apariencia nativa */
input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left}
.cap-par{display:flex;gap:10px;margin-top:8px}
.cap-par .cap-btn{flex:1;margin-top:0;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:15px;padding:15px 8px;min-height:54px}
@media(max-width:380px){.cap-par .cap-btn{font-size:13.5px;gap:5px}}

.cap-btn:disabled{opacity:.5}
.cap-msg{font-size:13px;margin-top:12px;min-height:18px}
.cap-msg.ok{color:var(--green)} .cap-msg.err{color:var(--red)}
.row{display:flex;gap:10px}.row>*{flex:1}
.buscaList{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:9px;margin-bottom:14px;text-align:left}
.ins-it{padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--text)}
.ins-it:active{background:var(--surface2)}
.ins-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(61,190,122,.12);border:1px solid var(--green);border-radius:9px;padding:11px 13px;margin-bottom:14px;text-align:left}
.ins-sel b{color:var(--text);font-size:14px}
.chip{font-size:12px;color:var(--text-dim)}
#countBox{font-size:12px;color:var(--text-dim);margin:-6px 0 14px}
.thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);margin:0 auto 12px;display:block}
.quien{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:13px;color:var(--text);text-align:left}
/* Menú de conceptos */
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:12px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.menu-btn:active{border-color:var(--green)}
.menu-btn .mi{font-size:30px;flex-shrink:0}
.menu-btn .mt{font-size:15px;font-weight:600;color:var(--text)}
.menu-btn .md{font-size:12px;color:var(--text-dim);margin-top:2px}
/* Chips de área y de tipo de merma */
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips button{flex:1;min-width:90px;background:transparent;border:1.5px solid var(--border);color:var(--text-muted);border-radius:20px;padding:9px 8px;font-size:13px;cursor:pointer;font-family:inherit}
.chips button.on{border-color:var(--green);background:rgba(61,190,122,.12);color:var(--green);font-weight:600}
.volver{background:transparent;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:10px;display:block}
/* Lista (carrito) de registro múltiple */
.cart-box{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;text-align:left;overflow:hidden}
.cart-it{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
.cart-it:last-child{border-bottom:none}
.cart-it .ci-nom{flex:1;color:var(--text);min-width:0}
.cart-it .ci-nom b{font-weight:600}
.cart-it .ci-cant{color:var(--green);font-weight:600;white-space:nowrap}
.cart-it .ci-cant.out{color:#9b7fe0}
.cart-it .ci-cant.mer{color:var(--red)}
.cart-it .ci-del{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:0 2px;flex-shrink:0}
.cart-empty{padding:14px;text-align:center;color:var(--text-dim);font-size:12.5px}
.add-btn{display:block;width:100%;box-sizing:border-box;background:var(--surface2);border:1px dashed var(--border);color:var(--text);border-radius:9px;padding:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
.foto-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.foto-strip .fs-it{position:relative;width:56px;height:56px}
.foto-strip .fs-it img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.foto-strip .fs-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foto-cnt{font-size:11px;color:var(--text-dim);margin:-4px 0 10px}
</style>
</head>
<body>
<div class="cap-card">
    <div class="cap-logo">
        <img src="/marca/etaax-logo-oscuro.svg" alt="ETAAX" style="height:29px;width:auto;display:block">
    </div>
    <div class="cap-title" id="capTitle">Registro de barra / cocina</div>
    <div class="cap-sub" id="capSub">Identifícate con tu PIN</div>

    <!-- ── Pantalla PIN ── -->
    <div id="pinScreen">
        <label class="lbl">PIN de 5 dígitos</label>
        <input id="pinInput" class="fld" type="tel" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off">
        <button class="cap-btn" id="pinBtn" onclick="entrar()">Entrar</button>
        <div class="cap-msg" id="pinMsg"></div>
    </div>

    <!-- ── Pantalla HISTORIAL: qué se lleva registrado en este periodo ── -->
    <div id="histScreen" style="display:none">
        <button class="volver" onclick="_show('menuScreen')">← Menú</button>
        <div class="cap-title">Lo registrado</div>
        <div class="cap-sub" id="histSub">Desde el último inventario</div>
        <div id="histTot" style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px"></div>
        <div id="histBody" style="margin-top:10px"></div>
    </div>

    <!-- ── Pantalla MENÚ: qué vas a registrar ── -->
    <div id="menuScreen" style="display:none">
        <div class="quien">👤 Registra: <b id="quienNom">—</b></div>
        <div id="countBox">⏱️ Tiempo en sesión: <b id="countVal" style="color:var(--text)">0:00</b></div>
        <button class="menu-btn" onclick="irEntrada()">
            <span class="mi">📦</span>
            <span><span class="mt">Entrada de insumos</span><br><span class="md">Llegó mercancía: compra, bonificación, consignación o préstamo pagado</span></span>
        </button>
        <button class="menu-btn" onclick="irMerma()">
            <span class="mi">🍷</span>
            <span><span class="mt">Merma</span><br><span class="md">Se rompió, derramó o desperdició un insumo o un producto del menú</span></span>
        </button>
        <button class="menu-btn" onclick="irSalida()">
            <span class="mi">🎁</span>
            <span><span class="mt">Cortesía o préstamo</span><br><span class="md">Salió un insumo sin ser venta: cortesía a un cliente o préstamo a otra área/sucursal</span></span>
        </button>
        <button class="menu-btn" onclick="irHistorial()">
            <span class="mi">🧾</span>
            <span><span class="mt">Ver lo registrado</span><br><span class="md">Todo lo que se ha capturado desde el último inventario: entradas, mermas, cortesías y conteos</span></span>
        </button>
        <button class="menu-btn" onclick="irConteo()">
            <span class="mi">📋</span>
            <span><span class="mt">Contar existencias</span><br><span class="md">Cuenta tus botellas o pésalas antes del inventario: el conteo llega al sistema y solo se aplica</span></span>
        </button>
    </div>

    <!-- ── Pantalla CONTAR EXISTENCIAS ── -->
    <div id="conteoScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsCnt"></div>

        <div id="cntForm" style="display:none">
            <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:10px 0 14px">
                <div style="font-size:15px;font-weight:600;color:var(--text)" id="cntNom">—</div>
                <div style="font-size:11px;color:var(--dim);margin-top:2px" id="cntMeta">—</div>
            </div>

            <div id="cntEmpaque" style="display:none"></div>

            <label class="lbl">Botellas / piezas cerradas</label>
            <div style="display:flex;gap:10px">
                <div style="flex:1">
                    <div style="font-size:11px;color:var(--dim);margin-bottom:5px">Bodega</div>
                    <input type="text" inputmode="decimal" class="fld" id="cntBodega" placeholder="—" style="margin-bottom:0">
                </div>
                <div style="flex:1">
                    <div style="font-size:11px;color:var(--dim);margin-bottom:5px">Barra</div>
                    <input type="text" inputmode="decimal" class="fld" id="cntBarra" placeholder="—" style="margin-bottom:0">
                </div>
            </div>
            <div style="font-size:11px;color:var(--dim);margin:6px 0 14px">Puedes escribir operaciones: <b>3*24+5</b></div>

            <label class="lbl">Botellas abiertas · peso con envase (kg)</label>
            <div style="display:flex;gap:8px;margin-bottom:14px">
                <input type="text" inputmode="decimal" class="fld" id="cntP0" placeholder="B1" style="margin-bottom:0;text-align:center">
                <input type="text" inputmode="decimal" class="fld" id="cntP1" placeholder="B2" style="margin-bottom:0;text-align:center">
                <input type="text" inputmode="decimal" class="fld" id="cntP2" placeholder="B3" style="margin-bottom:0;text-align:center">
                <input type="text" inputmode="decimal" class="fld" id="cntP3" placeholder="B4" style="margin-bottom:0;text-align:center">
            </div>

            <label class="lbl">Nota (opcional)</label>
            <input type="text" class="fld" id="cntNota" placeholder="Ej. quedaron 2 cajas en bodega chica">

            <button class="cap-btn" id="cntBtn" onclick="enviarConteo()">Guardar conteo</button>
            <div class="cap-msg" id="cntMsg"></div>
        </div>

        <label class="lbl">Producto</label>
        <input type="text" class="fld" id="cntBuscar" placeholder="Escribe el nombre…" oninput="filtrarCnt(this.value)" autocomplete="off">
        <div id="cntLista" class="ins-list"></div>

        <div id="cntHechos" style="margin-top:16px"></div>
    </div>

    <!-- ── Pantalla ENTRADA de insumos ── -->
    <div id="formScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsEnt"></div>

        <label class="lbl">Insumo</label>
        <input id="insBusca" class="fld" placeholder="Buscar insumo…" oninput="filtrarIns(this.value)" autocomplete="off">
        <div id="insSelBox"></div>
        <div id="insList" class="buscaList"></div>

        <div class="row">
            <div>
                <label class="lbl">Tipo</label>
                <select id="entTipo" class="fld">
                    <option value="compra">Compra</option>
                    <option value="bonificacion">Bonificación</option>
                    <option value="consignacion">Consignación</option>
                    <option value="prestamo_pagado">Préstamo pagado</option>
                </select>
            </div>
            <div>
                <label class="lbl">Cantidad</label>
                <input id="entCant" class="fld" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
        </div>
        <div id="entEmpaque" style="display:none"></div>

        <button class="add-btn" onclick="_addItem('entrada')">➕ Agregar a la lista</button>

        <label class="lbl">Lista de entradas (<span id="entradaCartN">0</span>/15)</label>
        <div class="cart-box" id="entradaCartList"></div>

        <label class="lbl">Fecha (para todo el lote)</label>
        <input id="entradaFecha" class="fld" type="date">

        <label class="lbl">Nota (opcional, para todo el lote)</label>
        <input id="entradaNota" class="fld" placeholder="Proveedor, ticket, etc.">

        <label class="lbl">Evidencia (fotos, hasta 10)</label>
        <div class="foto-strip" id="entradaFotoStrip"></div>
        <div class="foto-cnt" id="entradaFotoCnt">0 / 10 fotos</div>
        <input type="file" id="entradaFotoCam" accept="image/*" capture="environment" style="display:none" onchange="_addFotoBatch('entrada',this)">
        <input type="file" id="entradaFotoGal" accept="image/*" multiple style="display:none" onchange="_addFotoBatch('entrada',this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('entradaFotoCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('entradaFotoGal').click()">🖼️ Galería</button>
        </div>

        <button class="cap-btn" id="entradaSubmitBtn" style="margin-top:12px" onclick="_registrarBatch('entrada')">✓ Registrar todo (0)</button>
        <div class="cap-msg" id="entradaMsg"></div>
    </div>

    <!-- ── Pantalla MERMA (insumo o producto del menú) ── -->
    <div id="mermaScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsMer"></div>

        <label class="lbl">¿Qué se mermó?</label>
        <div class="chips" id="merTipoChips">
            <button id="merTipoIns" class="on" onclick="setMermaTipo('insumo')">🧴 Insumo</button>
            <button id="merTipoProd" onclick="setMermaTipo('producto')">🍹 Producto del menú</button>
        </div>

        <input id="merBusca" class="fld" placeholder="Buscar insumo…" oninput="filtrarMer(this.value)" autocomplete="off">
        <div id="merSelBox"></div>
        <div id="merList" class="buscaList"></div>

        <div class="row">
            <div>
                <label class="lbl">Cantidad</label>
                <input id="merCant" class="fld" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
            <div>
                <label class="lbl">Unidad</label>
                <select id="merUnidad" class="fld">
                    <option value="copa">Copa(s)</option>
                    <option value="oz">Onza(s)</option>
                    <option value="ml">ml</option>
                    <option value="botella">Botella(s)</option>
                    <option value="pza">Pieza(s)</option>
                    <option value="g">Gramos</option>
                    <option value="porcion">Porción(es)</option>
                </select>
            </div>
        </div>

        <label class="lbl">Motivo</label>
        <select id="merMotivo" class="fld">
            <option value="se_rompio">Se rompió</option>
            <option value="se_derramo">Se derramó</option>
            <option value="mal_preparado">Mal preparado / regresado</option>
            <option value="caducado">Caducado / en mal estado</option>
            <option value="otro">Otro</option>
        </select>

        <button class="add-btn" onclick="_addItem('merma')">➕ Agregar a la lista</button>

        <label class="lbl">Lista de mermas (<span id="mermaCartN">0</span>/15)</label>
        <div class="cart-box" id="mermaCartList"></div>

        <label class="lbl">Nota (opcional, para todo el lote)</label>
        <input id="mermaNota" class="fld" placeholder="Detalle de lo que pasó…">

        <label class="lbl">Evidencia (fotos, hasta 10)</label>
        <div class="foto-strip" id="mermaFotoStrip"></div>
        <div class="foto-cnt" id="mermaFotoCnt">0 / 10 fotos</div>
        <input type="file" id="mermaFotoCam" accept="image/*" capture="environment" style="display:none" onchange="_addFotoBatch('merma',this)">
        <input type="file" id="mermaFotoGal" accept="image/*" multiple style="display:none" onchange="_addFotoBatch('merma',this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('mermaFotoCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('mermaFotoGal').click()">🖼️ Galería</button>
        </div>

        <button class="cap-btn" id="mermaSubmitBtn" style="margin-top:12px;background:var(--red);color:#fff" onclick="_registrarBatch('merma')">✓ Registrar todo (0)</button>
        <div class="cap-msg" id="mermaMsg"></div>
    </div>

    <!-- ── Pantalla SALIDA de insumo (cortesía / préstamo) ── -->
    <div id="salidaScreen" style="display:none">
        <button class="volver" onclick="volverMenu()">← Menú</button>

        <label class="lbl">Área</label>
        <div class="chips" id="areaChipsSal"></div>

        <label class="lbl">Tipo de salida</label>
        <div class="chips" id="salTipoChips">
            <button id="salTipoCort" class="on" onclick="setSalidaTipo('cortesia')">🎁 Cortesía</button>
            <button id="salTipoPres" onclick="setSalidaTipo('prestamo')">🔁 Préstamo</button>
        </div>

        <label class="lbl">Insumo</label>
        <input id="salBusca" class="fld" placeholder="Buscar insumo…" oninput="filtrarSal(this.value)" autocomplete="off">
        <div id="salSelBox"></div>
        <div id="salList" class="buscaList"></div>

        <div class="row">
            <div>
                <label class="lbl">Cantidad</label>
                <input id="salCant" class="fld" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
            <div>
                <label class="lbl">Unidad</label>
                <select id="salUnidad" class="fld">
                    <option value="copa">Copa(s)</option>
                    <option value="oz">Onza(s)</option>
                    <option value="ml">ml</option>
                    <option value="botella">Botella(s)</option>
                    <option value="pza">Pieza(s)</option>
                    <option value="g">Gramos</option>
                    <option value="porcion">Porción(es)</option>
                </select>
            </div>
        </div>

        <button class="add-btn" onclick="_addItem('salida')">➕ Agregar a la lista</button>

        <label class="lbl">Lista de salidas (<span id="salidaCartN">0</span>/15)</label>
        <div class="cart-box" id="salidaCartList"></div>

        <label class="lbl" id="salidaNotaLbl">Motivo / a quién (para todo el lote)</label>
        <input id="salidaNota" class="fld" placeholder="Ej. cortesía VIP, préstamo a sucursal Centro…">

        <label class="lbl">Evidencia (fotos, hasta 10)</label>
        <div class="foto-strip" id="salidaFotoStrip"></div>
        <div class="foto-cnt" id="salidaFotoCnt">0 / 10 fotos</div>
        <input type="file" id="salidaFotoCam" accept="image/*" capture="environment" style="display:none" onchange="_addFotoBatch('salida',this)">
        <input type="file" id="salidaFotoGal" accept="image/*" multiple style="display:none" onchange="_addFotoBatch('salida',this)">
        <div class="cap-par">
            <button class="cap-btn ghost" onclick="document.getElementById('salidaFotoCam').click()">📷 Tomar foto</button>
            <button class="cap-btn ghost" onclick="document.getElementById('salidaFotoGal').click()">🖼️ Galería</button>
        </div>

        <button class="cap-btn" id="salidaSubmitBtn" style="margin-top:12px;background:#7c5fd3;color:#fff" onclick="_registrarBatch('salida')">✓ Registrar todo (0)</button>
        <div class="cap-msg" id="salidaMsg"></div>
    </div>

    <!-- ── Pantalla error ── -->
    <div id="errScreen" style="display:none">
        <div style="font-size:38px;margin:10px 0">🔒</div>
        <div id="errTxt" style="font-size:13px;color:var(--text-dim);line-height:1.6"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
(function(){var s=localStorage.getItem('etaax_theme')||'dark';document.documentElement.setAttribute('data-theme',s);})();
function _q(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowHora(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function etx(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Contenido por envase del insumo (750 ml, 1 L, 235 ml, 1 kg…) — de su 1ª presentación.
function _fmtContenidoQR(x){
    var p = (x && x.presentaciones && x.presentaciones[0]) || {};
    var cn = parseFloat(p.contNeto) || 0;
    if (cn <= 0) return '';
    var um = (p.umContenido || 'ml').toString().toLowerCase();
    var uMap = { lt:'L', ml:'ml', kg:'kg', g:'g', pza:'pza', oz:'oz' };
    var nn = (cn % 1) ? (Math.round(cn*100)/100) : cn;
    return nn + ' ' + (uMap[um] || um);
}
// Chip de meta del insumo (📦 contenido · variedad · marca) — lista y seleccionado.
function _insMetaParts(x){
    var parts = []; var cont = _fmtContenidoQR(x);
    if (cont) parts.push('📦 ' + cont);
    var sub = [x.variedad, x.marca].filter(Boolean).join(' · ');
    if (sub) parts.push(sub);
    return parts.join(' · ');
}
function _insMetaHTML(x){ var m = _insMetaParts(x); return m ? ' <span class="chip">'+etx(m)+'</span>' : ''; }
function _insMetaChip(x){ var m = _insMetaParts(x); return m ? '<div class="chip">'+etx(m)+'</div>' : ''; }
// Mismo hash que security.js (_hashPwdStaff): el NIP del staff se guarda como nipHash = v2$sha256('etaax-staff|nip|'+pin)
async function _hashNip(pin){
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('etaax-staff|nip|' + pin));
    return 'v2$' + Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}

var NEG = _q('n') || _q('neg');
var TOKEN = _q('t');             // token secreto del negocio (va en el QR) — NO requiere login
var SUC = _q('s') || '';         // sucursal del QR (cada sucursal imprime SU QR) — sella cada registro
// ¿El insumo/receta pertenece a la sucursal del QR? (compat: sin lista de sucursales = visible)
/* UN RENGLÓN POR PRODUCTO. El catálogo guarda un maestro global y una copia por
   sucursal del mismo producto (misma botella, dos registros). Sin esto, la barra ve
   "400 Conejos" dos veces y no hay manera de saber cuál tocar — y dos personas
   podrían contar la misma botella en registros distintos.
   Manda la COPIA de esta sucursal (es la que trae sus costos); si no existe, el
   maestro. Da igual cuál se elija para el conteo: al aplicarlo, el inventario
   resuelve el id canónico de las dos. */
function _unoPorProductoQR(lista){
    var por = {}, orden = [];
    (lista||[]).forEach(function(x){
        if (!x || !x.id) return;
        var k = x.origenId || x.id;             // id canónico (copia → maestro)
        if (!por[k]) { por[k] = x; orden.push(k); return; }
        var gana = SUC ? !!x.origenId           // en sucursal manda la copia
                       : !x.origenId;           // sin sucursal manda el maestro
        var actualEsCopia = !!por[k].origenId;
        if (gana && (SUC ? !actualEsCopia : actualEsCopia)) por[k] = x;
    });
    return orden.map(function(k){ return por[k]; });
}
function _enSucQR(x){
    if (!SUC || !x) return true;
    if ((x.inactivoEn||[]).indexOf(SUC) >= 0 || (x.inactivaEn||[]).indexOf(SUC) >= 0) return false; // pausado ahí
    var ss = (x.sucursales && x.sucursales.length) ? x.sucursales : (x.sucursalId ? [x.sucursalId] : null);
    if (!ss || !ss.length) return true;
    return ss.indexOf(SUC) >= 0;
}
/* La sesión ya NO expira: registrar entradas o contar existencias puede tomar lo que
   tome, y echar al colaborador a media captura no protege nada. El contador pasa a ser

async function entrar(){
    var pin = (document.getElementById('pinInput').value || '').trim();
    var msg = document.getElementById('pinMsg'); msg.className = 'cap-msg'; msg.textContent = '';
    if (!/^\d{4,6}$/.test(pin)) { msg.className='cap-msg err'; msg.textContent='Pon tu NIP (5 dígitos).'; return; }
    var btn = document.getElementById('pinBtn'); btn.disabled = true; msg.textContent = 'Validando…';
    try {
        var h = await _hashNip(pin);
        // 1) Validar token + NIP en el SERVIDOR (sin sesión, login efímero por RPC).
        var rv = await _supabase.rpc('entrada_validar_nip', { p_neg: NEG, p_token: TOKEN, p_niphash: h });
        if (rv.error) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'No se pudo validar.<br><span style="font-size:11px;color:var(--text-dim)">' + etx(rv.error.message) + ' — ¿se corrió la migración v27 en Supabase?</span>';
            return;
        }
        if (!rv.data) {
            btn.disabled = false; msg.className = 'cap-msg err';
            msg.innerHTML = 'NIP no reconocido.<br><span style="font-size:11px;color:var(--text-dim)">Verifica con tu encargado tu NIP de 5 dígitos (Gestión de Staff). El rol "Jefe de Barra" usa usuario/contraseña, no NIP.</span>';
            return;
        }
        COLAB = rv.data; _NIPHASH = h;
        // 2) Cargar insumos (token-gated, también por RPC).
        var ri = await _supabase.rpc('entrada_insumos', { p_neg: NEG, p_token: TOKEN });
        INSUMOS = _unoPorProductoQR(                                    // sin duplicados maestro/copia
            (ri.data || []).filter(function(x){ return x && x.id && x.activo !== '0' && _enSucQR(x); })  // solo los de ESTA sucursal
        );
        INSUMOS.sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||''); });
        // 3) Menú de conceptos.
        document.getElementById('quienNom').textContent = COLAB;
        document.getElementById('entradaFecha').value = todayStr();
        filtrarIns('');
        volverMenu();
        _t0 = Date.now(); _tick(); _countTimer = setInterval(_tick, 1000);
    } catch (e) {
        btn.disabled=false; msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e);
    }
}

function _tick(){
    var seg = Math.max(0, Math.round((Date.now() - _t0) / 1000));
    var el = document.getElementById('countVal');
    if (el) el.textContent = Math.floor(seg/60) + ':' + String(seg%60).padStart(2,'0');
}

async function _cargarRecetas(){
    document.getElementById('merList').innerHTML = '<div class="ins-it" style="color:var(--text-dim);cursor:default">Cargando menú…</div>';
    try {
        var rr = await _supabase.rpc('entrada_recetas', { p_neg: NEG, p_token: TOKEN });

/* ══ CONTAR EXISTENCIAS ═══════════════════════════════════════════════════════

var CNT_SEL = null, CNT_HECHOS = [];
function irConteo(){

    // Si ya lo contó antes en esta sesión, se precargan sus números para corregir.

/* ══ CONTAR / RECIBIR POR EMPAQUE ═══════════════════════════════════════════
   La barra no cuenta 72 botellas: cuenta 3 rejillas. El insumo ya trae en qué
   viene ("Caja de 24 Botellas"), así que se elige la unidad y el sistema
   multiplica. Se GUARDAN PIEZAS siempre — el inventario que recibe el conteo
   habla en piezas y no tiene por qué enterarse de las rejillas. */
function _empaqueQR(ins){
    var p = (ins && (ins.presentaciones||[])[0]) || {};
    var n = parseFloat(p.cantPresCompra) || 0;
    if (!(n > 1)) return null;                        // "caja de 1" no ahorra nada
    var pres = (p.presentacionCompra || '').toString().trim();
    if (!pres || /^(pieza|piezas|botella|botellas)$/i.test(pres)) return null;
    return { label: pres, factor: n, um: (p.umPresCompra || 'Piezas') };
}
var _UM_CNT = 'pza';           // unidad elegida en el conteo (por producto)
var _UM_ENT = 'pza';           // unidad elegida en la entrada
function _pintarSelEmpaque(cont, ins, modo, onSet){
    var el = document.getElementById(cont); if (!el) return;
    var e = _empaqueQR(ins);
    if (!e) { el.innerHTML = ''; el.style.display = 'none'; return; }
    el.style.display = '';
    var pza = (e.um || 'Piezas');
    var b = function(v, txt, on){
        return '<button type="button" onclick="'+onSet+'(\''+v+'\')" style="flex:1;padding:9px;border-radius:10px;'
            + 'font-size:13px;font-family:inherit;cursor:pointer;border:1px solid '
            + (on ? 'var(--green);background:rgba(61,190,122,.14);color:var(--green)'
                  : 'var(--border);background:var(--surface2);color:var(--text-dim)') + '">' + txt + '</button>';
    };
    el.innerHTML = '<div class="lbl">Contar en</div><div style="display:flex;gap:8px;margin-bottom:12px">'
        + b('pza', etx(pza), modo !== 'pres')
        + b('pres', etx(e.label) + ' ×' + e.factor, modo === 'pres') + '</div>';
}
// Lo tecleado (cajas) → piezas, que es lo único que viaja al sistema.
function _aPiezas(v, ins, modo){
    if (v === '' || v == null) return v;
    var e = (modo === 'pres') ? _empaqueQR(ins) : null;
    if (!e) return v;
    return Math.round((parseFloat(v)||0) * e.factor * 1000) / 1000;
}
function setUmCnt(m){ _UM_CNT = m; _pintarSelEmpaque('cntEmpaque', CNT_SEL, _UM_CNT, 'setUmCnt'); }
function setUmEnt(m){ _UM_ENT = m; _pintarSelEmpaque('entEmpaque', SEL, _UM_ENT, 'setUmEnt'); }

/* Mismo evaluador que las celdas del sistema: "3*24+5" es como se cuenta de verdad. */
function _evalCnt(txt){
    var t = String(txt==null?'':txt).trim();
    if (!t) return '';
    if (/^-?\d*\.?\d*$/.test(t)) return parseFloat(t);
    if (!/^[0-9+\-*/(). ]+$/.test(t) || /[+\-*/]{2,}/.test(t)) return '';
    try { var v = Function('"use strict";return ('+t+')')(); return (typeof v==='number'&&isFinite(v)) ? Math.round(v*10000)/10000 : ''; }
    catch(e){ return ''; }
}
async function enviarConteo(){
    var msg = document.getElementById('cntMsg');
    if (!CNT_SEL){ msg.className='cap-msg err'; msg.textContent='Elige un producto.'; return; }
    var bod = _aPiezas(_evalCnt(document.getElementById('cntBodega').value), CNT_SEL, _UM_CNT);
    var bar = _aPiezas(_evalCnt(document.getElementById('cntBarra').value),  CNT_SEL, _UM_CNT);
    var pesos = [0,1,2,3].map(function(i){ return _evalCnt(document.getElementById('cntP'+i).value); });
    if (bod==='' && bar==='' && !pesos.some(function(p){ return p!==''; })){
        msg.className='cap-msg err'; msg.textContent='Pon al menos una cantidad o un peso.'; return;
    }
    var btn = document.getElementById('cntBtn'); btn.disabled = true;
    msg.className='cap-msg'; msg.textContent='Guardando…';
    try {
        var hoy = todayStr();
        var entry = {
            // id estable: si vuelve a contar el mismo producto hoy, CORRIGE su conteo
            // en vez de dejar dos verdades en la tabla.
            id: 'cnt_'+NEG+'_'+(SUC||'suc_principal')+'_'+AREA+'_'+hoy+'_'+CNT_SEL.id,
            insumoId: CNT_SEL.id, nombre: CNT_SEL.nombre || '',
            sucursalId: SUC || '', area: AREA, fecha: hoy, hora: nowHora(),
            cerradasBodega: bod, cerradasBarra: bar,
            pesos: pesos,
            nota: (document.getElementById('cntNota').value||'').trim(),
            aplicado: false
        };
        var r = await _supabase.rpc('inventario_conteo_registrar', { p_neg:NEG, p_token:TOKEN, p_niphash:_NIPHASH, p_datos:entry });
        if (r.error){ msg.className='cap-msg err'; msg.textContent='No se pudo guardar: '+r.error.message; return; }
        CNT_HECHOS = CNT_HECHOS.filter(function(h){ return h.insumoId!==entry.insumoId; });
        CNT_HECHOS.unshift(entry);
        msg.className='cap-msg ok'; msg.textContent='✓ '+(CNT_SEL.nombre||'Producto')+' contado';
        document.getElementById('cntForm').style.display='none';
        document.getElementById('cntBuscar').value=''; CNT_SEL=null;
        filtrarCnt(''); _renderCntHechos();
    } catch(e){ msg.className='cap-msg err'; msg.textContent='Error: '+((e&&e.message)||e); }
    finally { btn.disabled = false; }   // pase lo que pase, el botón vuelve a servir
}
function _renderCntHechos(){
    var c = document.getElementById('cntHechos'); if (!c) return;
    if (!CNT_HECHOS.length){ c.innerHTML=''; return; }
    c.innerHTML = '<div class="lbl">Contados en esta sesión ('+CNT_HECHOS.length+')</div>'
        + CNT_HECHOS.map(function(h){
            var partes = [];
            if (h.cerradasBodega!=='') partes.push(h.cerradasBodega+' bodega');
            if (h.cerradasBarra!=='')  partes.push(h.cerradasBarra+' barra');
            var np = (h.pesos||[]).filter(function(p){ return p!==''; }).length;
            if (np) partes.push(np+' abierta'+(np!==1?'s':'')+' pesada'+(np!==1?'s':''));
            return '<div style="display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px">'
                + '<span style="font-size:13px;color:var(--text)">'+etx(h.nombre)+'</span>'
                + '<span style="font-size:11.5px;color:var(--dim);text-align:right">'+etx(partes.join(' · '))+'</span></div>';
        }).join('');
}

/* ══ Motor de REGISTRO MÚLTIPLE (lista/carrito + fotos), común a los 3 flujos ══ */
function _cartMsg(flujo, txt, cls){
    var m = document.getElementById(flujo+'Msg'); if(!m) return;
    m.className = 'cap-msg' + (cls==='err'?' err':cls==='ok'?' ok':'');
    m.textContent = txt;
}
function _entTipoLbl(t){ return {compra:'compra',bonificacion:'bonificación',consignacion:'consignación',prestamo_pagado:'préstamo pagado'}[t]||t; }
function _merMotivoLbl(m){ return {se_rompio:'se rompió',se_derramo:'se derramó',mal_preparado:'mal preparado',caducado:'caducado',otro:'otro'}[m]||''; }

// Agregar el insumo seleccionado (con su cantidad) a la lista del lote.
function _addItem(flujo){
    var st = CART[flujo];
    if (st.items.length >= MAX_ITEMS){ _cartMsg(flujo,'Máximo '+MAX_ITEMS+' por lote. Registra este y arma otro.','err'); return; }
    var it;
    if (flujo==='entrada'){
        if (!SEL){ _cartMsg(flujo,'Elige un insumo.','err'); return; }
        var c = parseFloat(document.getElementById('entCant').value)||0;
        if (c<=0){ _cartMsg(flujo,'Pon una cantidad mayor a 0.','err'); return; }
        c = parseFloat(_aPiezas(c, SEL, _UM_ENT)) || c;   // rejillas → piezas
        it = { id:genId()+genId(), insumoId:(SEL.origenId||SEL.id), nombre:SEL.nombre+(SEL.variedad?' '+SEL.variedad:''), familia:SEL.familia||SEL.categoria||'', cantidad:c, tipo:document.getElementById('entTipo').value };
        limpiarIns(); document.getElementById('entCant').value='';
    } else if (flujo==='merma'){
        if (!MSEL){ _cartMsg(flujo, MERMA_TIPO==='producto'?'Elige el producto del menú.':'Elige el insumo.','err'); return; }
        var cm = parseFloat(document.getElementById('merCant').value)||0;
        if (cm<=0){ _cartMsg(flujo,'Pon una cantidad mayor a 0.','err'); return; }
        it = { id:genId()+genId(), mermaTipo:MERMA_TIPO, insumoId:(MSEL.origenId||MSEL.id), nombre:MSEL.nombre+(MSEL.variedad?' '+MSEL.variedad:''), familia:MSEL.familia||MSEL.categoria||MSEL.grupo||'', cantidad:cm, unidad:document.getElementById('merUnidad').value, motivo:document.getElementById('merMotivo').value };
        limpiarMer(); document.getElementById('merCant').value='';
    } else { // salida
        if (!SSEL){ _cartMsg(flujo,'Elige un insumo.','err'); return; }
        var cs = parseFloat(document.getElementById('salCant').value)||0;
        if (cs<=0){ _cartMsg(flujo,'Pon una cantidad mayor a 0.','err'); return; }
        it = { id:genId()+genId(), salidaTipo:SALIDA_TIPO, insumoId:(SSEL.origenId||SSEL.id), nombre:SSEL.nombre+(SSEL.variedad?' '+SSEL.variedad:''), familia:SSEL.familia||SSEL.categoria||'', cantidad:cs, unidad:document.getElementById('salUnidad').value };
        limpiarSal(); document.getElementById('salCant').value='';
    }
    st.items.push(it); _renderCart(flujo); _cartMsg(flujo,'','');
}
function _delItem(flujo, i){ CART[flujo].items.splice(i,1); _renderCart(flujo); }
function _renderCart(flujo){
    var st = CART[flujo];
    var nEl = document.getElementById(flujo+'CartN'); if (nEl) nEl.textContent = st.items.length;
    var btn = document.getElementById(flujo+'SubmitBtn'); if (btn) btn.textContent = '✓ Registrar todo ('+st.items.length+')';
    var box = document.getElementById(flujo+'CartList'); if (!box) return;
    if (!st.items.length){ box.innerHTML = '<div class="cart-empty">Aún no agregas nada. Elige un insumo, pon su cantidad y toca «Agregar».</div>'; return; }
    box.innerHTML = st.items.map(function(it, i){
        var cls = flujo==='entrada' ? '' : (flujo==='salida' ? 'out' : 'mer');
        var sign = flujo==='entrada' ? '+' : '−';
        var extra = flujo==='entrada' ? _entTipoLbl(it.tipo)
                  : (flujo==='salida' ? (it.salidaTipo==='prestamo'?'🔁 préstamo':'🎁 cortesía')
                  : (it.mermaTipo==='producto'?'🍹 producto':_merMotivoLbl(it.motivo)));
        var unidad = flujo==='entrada' ? '' : (' '+etx(it.unidad||''));
        var cc = it.cantidad % 1 ? it.cantidad.toFixed(1) : it.cantidad;
        return '<div class="cart-it"><span class="ci-nom"><b>'+etx(it.nombre)+'</b>'+(extra?' <span style="color:var(--text-dim);font-size:11px">· '+etx(extra)+'</span>':'')+'</span>'+
            '<span class="ci-cant '+cls+'">'+sign+cc+unidad+'</span>'+
            '<button class="ci-del" onclick="_delItem(\''+flujo+'\','+i+')">✕</button></div>';
    }).join('');
}
// Fotos del lote (varias): sube cada archivo elegido y arma la tira de miniaturas.
async function _addFotoBatch(flujo, input){
    var files = Array.prototype.slice.call(input.files||[]); input.value='';
    if (!files.length) return;
    var st = CART[flujo], msg = document.getElementById(flujo+'Msg');
    for (var i=0;i<files.length;i++){
        if (st.fotos.length >= MAX_FOTOS){ _cartMsg(flujo,'Máximo '+MAX_FOTOS+' fotos por lote.','err'); break; }
        if (msg){ msg.className='cap-msg'; msg.textContent='Subiendo foto '+(st.fotos.length+1)+'…'; }
        var url = await _subirFotoBlob(files[i], msg);
        if (url){ st.fotos.push(url); _renderFotos(flujo); }
    }
    if (st.fotos.length){ _cartMsg(flujo,'✓ '+st.fotos.length+' foto(s) listas','ok'); }
}
function _delFoto(flujo, i){ CART[flujo].fotos.splice(i,1); _renderFotos(flujo); }
function _renderFotos(flujo){
    var st = CART[flujo];
    var cnt = document.getElementById(flujo+'FotoCnt'); if (cnt) cnt.textContent = st.fotos.length+' / '+MAX_FOTOS+' fotos';
    var strip = document.getElementById(flujo+'FotoStrip'); if (!strip) return;
    strip.innerHTML = st.fotos.map(function(u,i){
        return '<div class="fs-it"><img src="'+etx(u)+'"><button class="fs-del" onclick="_delFoto(\''+flujo+'\','+i+')">✕</button></div>';
    }).join('');
}
// Arma el registro (misma forma que antes) de un item del lote, con las fotos y nota compartidas.
/* ══ HISTORIAL DEL PERIODO ═════════════════════════════════════════════════
   Todo lo capturado desde que se cerró el último inventario, de TODOS los
   colaboradores. Ver solo lo propio no serviría para lo que importa: si dos
   personas cuentan la misma barra, la segunda necesita ver lo del compañero
   para no volver a contarlo. Por eso cada renglón dice quién lo registró. */
var ICONO_MOV = { entrada:'📦', merma:'🍷', salida:'🎁' };
var NOMBRE_MOV = { entrada:'Entrada', merma:'Merma', salida:'Cortesía / préstamo' };

async function irHistorial(){
    _show('histScreen');
    document.getElementById('histSub').textContent = 'Cargando…';
    document.getElementById('histTot').innerHTML = '';
    document.getElementById('histBody').innerHTML = '';

    var r;
    try {
        r = await _supabase.rpc('entrada_historial',
            { p_neg:NEG, p_token:TOKEN, p_niphash:_NIPHASH, p_suc:(SUC||''), p_area:AREA });
    } catch(e){ r = { error:e }; }

    if (r.error || !r.data || !r.data.ok){
        var motivo = (r.data && r.data.motivo) || '';
        document.getElementById('histSub').textContent =
            motivo === 'nip'   ? 'Tu NIP ya no es válido. Vuelve a entrar.' :
            motivo === 'token' ? 'Este código QR ya venció. Pide uno nuevo.' :
            'No se pudo cargar. Revisa tu conexión.';
        return;
    }

    var d = r.data;
    var movs = d.movimientos || [], cnts = d.conteos || [];
    document.getElementById('histSub').textContent = d.desde
        ? ('Desde el cierre de ' + (d.inventario || 'el último inventario'))
        : 'Todo lo registrado (aún no hay un inventario cerrado)';

    /* Los totales primero: es lo que se mira de reojo antes de ponerse a
       capturar, y responde la pregunta real —"¿ya lo hizo alguien?"— sin tener
       que leer la lista completa. */
    var cta = {};
    movs.forEach(function(m){ cta[m.concepto] = (cta[m.concepto]||0) + 1; });
    var chips = [
        ['📦', cta.entrada||0, 'entradas'],
        ['🍷', cta.merma||0,   'mermas'],
        ['🎁', cta.salida||0,  'cortesías'],
        ['📋', cnts.length,    'contados']
    ].map(function(c){
        var vacio = !c[1];
        return '<div style="flex:1;min-width:74px;background:var(--surface2);border:1px solid var(--border);' +
               'border-radius:10px;padding:9px 6px;text-align:center;opacity:'+(vacio?'.5':'1')+'">' +
               '<div style="font-size:16px">'+c[0]+'</div>' +
               '<div style="font-size:19px;font-weight:700;color:var(--text)">'+c[1]+'</div>' +
               '<div style="font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)">'+c[2]+'</div></div>';
    }).join('');
    document.getElementById('histTot').innerHTML = chips;

    if (!movs.length && !cnts.length){
        document.getElementById('histBody').innerHTML =
            '<div style="text-align:center;padding:34px 14px;color:var(--text-dim);font-size:13.5px;line-height:1.7">' +
            'Todavía no se ha registrado nada en este periodo.<br>Lo que captures aparecerá aquí.</div>';
        return;
    }

    function fila(ico, titulo, sub, quien){
        return '<div style="display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border)">' +
            '<span style="font-size:15px;flex-shrink:0">'+ico+'</span>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-size:13.5px;color:var(--text);line-height:1.35">'+etx(titulo)+'</div>' +
              '<div style="font-size:11.5px;color:var(--text-dim);margin-top:2px">'+etx(sub)+
                 (quien ? ' · '+etx(quien) : '')+'</div>' +
            '</div></div>';
    }

    var html = '';
    if (cnts.length){
        html += '<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin:16px 0 4px">Ya contados ('+cnts.length+')</div>';
        html += cnts.map(function(c){
            return fila('📋', c.nombre || '—', (c.fecha||'') + (c.hora ? ' · '+c.hora : ''), c.quien);
        }).join('');
    }
    if (movs.length){
        html += '<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin:18px 0 4px">Movimientos ('+movs.length+')</div>';
        html += movs.map(function(m){
            var cant = m.cantidad ? (m.cantidad + (m.unidad ? ' '+m.unidad : '')) : '';
            return fila(ICONO_MOV[m.concepto] || '•',
                (m.nombre || '—') + (cant ? '  ·  ' + cant : ''),
                (NOMBRE_MOV[m.concepto] || m.concepto || '') + ' · ' + (m.fecha||'') + (m.hora ? ' '+m.hora : ''),
                m.quien);
        }).join('');
    }
    document.getElementById('histBody').innerHTML = html;
}

function _buildEntry(flujo, it){
    var fotos = CART[flujo].fotos.slice();
    var nota = (document.getElementById(flujo+'Nota').value||'').trim();
    var fecha = flujo==='entrada' ? (document.getElementById('entradaFecha').value || todayStr()) : todayStr();
    var base = { id:it.id, sucursalId:SUC, area:AREA, fecha:fecha, registrado:new Date().toISOString(), foto_url:fotos[0]||'', foto_urls:fotos, notas:nota };
    if (flujo==='entrada') return Object.assign(base,{ concepto:'entrada', insumoId:it.insumoId, nombre:it.nombre, familia:it.familia, cantidad:it.cantidad, costo:0, tipo:it.tipo });
    if (flujo==='merma')   return Object.assign(base,{ concepto:'merma', mermaTipo:it.mermaTipo, insumoId: it.mermaTipo==='insumo'?it.insumoId:'', recetaId: it.mermaTipo==='producto'?it.insumoId:'', nombre:it.nombre, familia:it.familia, cantidad:it.cantidad, unidad:it.unidad, motivo:it.motivo });
    return Object.assign(base,{ concepto:'salida', salidaTipo:it.salidaTipo, insumoId:it.insumoId, nombre:it.nombre, familia:it.familia, cantidad:it.cantidad, unidad:it.unidad });
}
// Registra TODO el lote (un RPC por item). Los que fallen quedan en la lista para reintentar.
async function _registrarBatch(flujo){
    var st = CART[flujo];
    // (Sin corte por tiempo: el NIP se revalida en la RPC, que es lo que autoriza.)
    if (!st.items.length){ _cartMsg(flujo,'Agrega al menos un insumo a la lista.','err'); return; }
    var btn = document.getElementById(flujo+'SubmitBtn'); if (btn) btn.disabled=true;
    var total = st.items.length, ok=0, fallidos=[];
    for (var i=0;i<st.items.length;i++){
        var it = st.items[i];
        _cartMsg(flujo,'Registrando '+(ok+1)+' de '+total+'…','');
        try {
            var r = await _supabase.rpc('entrada_registrar', { p_neg:NEG, p_token:TOKEN, p_niphash:_NIPHASH, p_datos:_buildEntry(flujo, it) });
            if (r.error) fallidos.push(it); else ok++;
        } catch(e){ fallidos.push(it); }
    }
    if (btn) btn.disabled=false;
    st.items = fallidos; _renderCart(flujo);
    if (!fallidos.length){
        st.fotos = []; _renderFotos(flujo);
        document.getElementById(flujo+'Nota').value='';
        _cartMsg(flujo,'✓ '+ok+' registro(s) guardados. Puedes armar otro lote.','ok');
    } else {
        _cartMsg(flujo, ok+' guardados · '+fallidos.length+' fallaron (quedan en la lista, reintenta).','err');
    }
}

/* ── Foto (compartida): compresión agresiva para señal de cocina ── */
function _comprimir(file){
    return new Promise(function(resolve){
        var r=new FileReader();
        r.onload=function(e){ var img=new Image(); img.onload=function(){
            // 1024px / 65%: mitad de peso que antes (1280/72) → sube al doble de rápido con señal débil.
            var w=img.width,h=img.height,M=1024; if(w>h){if(w>M){h=Math.round(h*M/w);w=M;}}else{if(h>M){w=Math.round(w*M/h);h=M;}}
            var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
            c.toBlob(function(b){resolve(b);},'image/jpeg',0.65);
        }; img.onerror=function(){resolve(null);}; img.src=e.target.result; };
        r.onerror=function(){resolve(null);}; r.readAsDataURL(file);
    });
}
// Sube UN archivo (comprimido) a Storage y devuelve su URL pública ('' si falla).
async function _subirFotoBlob(file, msgEl){
    if (!file) return '';
    var blob = await _comprimir(file);
    if (!blob){ if(msgEl){msgEl.className='cap-msg err';msgEl.textContent='No se pudo procesar la imagen.';} return ''; }
    var path = NEG+'/entradas/'+TOKEN+'/'+genId()+'.jpg'; // path validado por la política de v28
    var up = await _supabase.storage.from('evidencias').upload(path, blob, {contentType:'image/jpeg'});
    if (up.error){ if(msgEl){msgEl.className='cap-msg err';msgEl.textContent='Error al subir foto: '+up.error.message+' (¿corriste v28?)';} return ''; }
    return _supabase.storage.from('evidencias').getPublicUrl(path).data.publicUrl;
}

document.addEventListener('DOMContentLoaded', function(){
    if (!NEG || !TOKEN) { _err('Este QR no es válido o está incompleto.<br>Genera uno nuevo desde Inventarios → 📱 QR de entradas.'); return; }
    document.getElementById('pinInput').focus();
    document.getElementById('pinInput').addEventListener('keydown', function(e){ if (e.key==='Enter') entrar(); });
});
