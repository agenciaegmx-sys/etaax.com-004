[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20.18.1"

# ── Security Headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: solo el propio sitio puede enmarcarse (lo usa el editor de
    # insumo/escandallo en un iframe). Sigue bloqueando enmarcado de terceros.
    X-Frame-Options = "SAMEORIGIN"
    # Sniffing: el browser respeta el Content-Type declarado
    X-Content-Type-Options = "nosniff"
    # Referrer: no filtra la URL completa a terceros
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Permisos: deshabilita APIs que no usa la app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP: restringe desde dónde se pueden cargar recursos
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://byjuocnkyuxxudondciz.supabase.co wss://byjuocnkyuxxudondciz.supabase.co;
      img-src 'self' data: blob: https://byjuocnkyuxxudondciz.supabase.co;
      object-src 'none';
      frame-src 'self';
      frame-ancestors 'self';
      base-uri 'self';
      form-action 'self';
    """

# ── Archivos internos fuera del alcance público ───────────────
# Netlify publica la raíz del repo TAL CUAL, así que las migraciones y la
# documentación operativa quedaban descargables desde el sitio
# (etaax.com/supabase-migration-v40.sql). No exponen datos —de eso se encarga
# RLS— pero sí el esquema completo, las políticas y los procedimientos internos.
# Con clientes reales en la plataforma, eso se cierra.
# OJO: Netlify solo admite el asterisco al FINAL de la ruta — un patrón como
# "/*.sql" NUNCA hace match y el archivo se sigue sirviendo. Por eso el bloqueo
# va por PREFIJO. Cuidado de no ampliarlo a "/supabase-*": eso tumbaría
# supabase-config.js, que la app sí necesita.
[[redirects]]
  from = "/supabase-migration-*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql_*"
  to = "/index.html"
  status = 404
  force = true

# El CÓDIGO de las Edge Functions vive en el repo y Netlify publica la raíz tal
# cual: sin esto, /supabase/functions/stripe-webhook/index.ts se descarga desde el
# sitio. No trae secretos (esos viven en Supabase), pero sí enseña la mecánica del
# cobro y qué eventos se aceptan — información de más para quien quiera empujarle
# un webhook falso.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
