[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20.18.1"

# ── Security Headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: solo el propio sitio puede enmarcarse (lo usa el editor de
    # insumo/escandallo en un iframe). Sigue bloqueando enmarcado de terceros.
    X-Frame-Options = "SAMEORIGIN"
    # Sniffing: el browser respeta el Content-Type declarado
    X-Content-Type-Options = "nosniff"
    # Referrer: no filtra la URL completa a terceros
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: fuerza HTTPS por 1 año
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Permisos: deshabilita APIs que no usa la app
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP: restringe desde dónde se pueden cargar recursos.
    #
    # ⚠️ NO PONER COMENTARIOS DENTRO DE LA CADENA. En TOML, ''"""'' es texto
    # LITERAL: un "#" ahí no es un comentario, se manda tal cual en el header. El
    # navegador lee esa línea como una directiva desconocida, la ignora… Y SE
    # LLEVA LA DIRECTIVA QUE VENGA PEGADA. Así se rompió img-src (imágenes
    # bloqueadas en toda la app, y "No se pudo procesar la imagen" al subir,
    # porque el canvas tampoco podía cargar el data: URL) y así llevaba tiempo
    # roto frame-src. Las notas van AQUÍ ARRIBA, como comentarios de verdad.
    #
    # img-src   · data: y blob: son imprescindibles: la compresión de imágenes
    #             carga el archivo como data: URL antes de subirlo, y las vistas
    #             previas usan blob:. i.ytimg.com es la miniatura de los videos
    #             de YouTube, que se saca de su id.
    # frame-src · blob: para la vista previa del expediente (INE, contratos);
    #             Supabase para ver los PDF de las guías sin salir de la app;
    #             youtube-nocookie para los tutoriales (no deja cookies de
    #             seguimiento en el navegador del cliente).
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://byjuocnkyuxxudondciz.supabase.co wss://byjuocnkyuxxudondciz.supabase.co;
      img-src 'self' data: blob: https://byjuocnkyuxxudondciz.supabase.co https://i.ytimg.com;
      object-src 'none';
      frame-src 'self' blob: https://byjuocnkyuxxudondciz.supabase.co https://www.youtube-nocookie.com;
      frame-ancestors 'self';
      base-uri 'self';
      form-action 'self';
    """

# ── Caché: que navegar no cueste un viaje al servidor por archivo ──────────
# MEDIDO (15-sep-2026, producción): abrir un módulo pide 19 scripts. Con la
# cabecera por defecto de Netlify —max-age=0, must-revalidate— el navegador tiene
# que PREGUNTARLE AL SERVIDOR por cada uno antes de usarlo, aunque los tenga
# guardados y nada haya cambiado. Medido en serie: ~4.4 s de pura revalidación
# con la caché llena. En una tablet con datos móviles eso se siente en CADA
# navegación, y es tiempo que no compra nada.
#
# `stale-while-revalidate` cambia el trato: el navegador USA lo que tiene, de
# inmediato, y revalida por detrás. La navegación deja de esperar.
#
# EL RIESGO, dicho claro: justo después de un despliegue, una carga puede juntar
# el HTML nuevo (que sí se revalida siempre) con un .js de la visita anterior. Es
# UNA carga: esa misma visita dispara la revalidación y la siguiente ya viene
# pareja. Para que ni esa se sienta, /negocio-tab.js —el primer script de toda
# página— detecta el síntoma de esa mezcla (una función que "no existe") y
# recarga una sola vez.
#
# El HTML NO se toca: sigue revalidándose siempre, para que un despliegue se vea
# sin pedirle a nadie que recargue.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=604800"

# La marca no cambia nunca: se guarda de verdad.
[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ── Documentos legales con URL corta ──────────────────────────
# Estas ligas se escriben en contratos, correos y se dictan por teléfono:
# "etaax.com/privacidad" se entiende y se teclea; "aviso-privacidad.html" no.
# Son REESCRITURAS (200), no redirecciones: la URL corta es la que se queda a la
# vista y el archivo sigue viviendo donde siempre. Las rutas .html siguen
# funcionando para no romper lo ya enviado.
[[redirects]]
  from = "/privacidad"
  to = "/aviso-privacidad.html"
  status = 200

[[redirects]]
  from = "/terminos"
  to = "/terminos.html"
  status = 200

[[redirects]]
  from = "/colaboradores"
  to = "/aviso-colaboradores.html"
  status = 200

# ── Archivos internos fuera del alcance público ───────────────
# Netlify publica la raíz del repo TAL CUAL, así que las migraciones y la
# documentación operativa quedaban descargables desde el sitio
# (etaax.com/supabase-migration-v40.sql). No exponen datos —de eso se encarga
# RLS— pero sí el esquema completo, las políticas y los procedimientos internos.
# Con clientes reales en la plataforma, eso se cierra.
# OJO: Netlify solo admite el asterisco al FINAL de la ruta — un patrón como
# "/*.sql" NUNCA hace match y el archivo se sigue sirviendo. Por eso el bloqueo
# va por PREFIJO. Cuidado de no ampliarlo a "/supabase-*": eso tumbaría
# supabase-config.js, que la app sí necesita.
[[redirects]]
  from = "/supabase-migration-*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql_*"
  to = "/index.html"
  status = 404
  force = true

# El CÓDIGO de las Edge Functions vive en el repo y Netlify publica la raíz tal
# cual: sin esto, /supabase/functions/stripe-webhook/index.ts se descarga desde el
# sitio. No trae secretos (esos viven en Supabase), pero sí enseña la mecánica del
# cobro y qué eventos se aceptan — información de más para quien quiera empujarle
# un webhook falso.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
