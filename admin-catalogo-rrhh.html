<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<script src="/negocio-tab.js"></script><!-- negocio activo POR PESTAÑA: debe ir primero -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>ETAAX · Catálogo Global de RRHH</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .adm-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);}
        .btn-adm-back{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:7px;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;}
        .btn-adm-back:hover{border-color:var(--green);color:var(--green);}
        .rh-tabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;width:fit-content;}
        .rh-tab{background:transparent;border:none;color:var(--text-muted);padding:8px 18px;border-radius:7px;font-family:inherit;font-size:13px;cursor:pointer;}
        .rh-tab.active{background:var(--surface);color:var(--green);font-weight:600;border:1px solid var(--border);}
        .rh-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
        .rh-nom{font-size:15px;font-weight:600;color:var(--text);}
        .rh-meta{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
        .rh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
        .rh-btn.del{border-color:rgba(224,90,58,.45);color:var(--red);}
        .rh-btn.del:hover{background:rgba(224,90,58,.12);}
        .rh-vacio{text-align:center;color:var(--text-dim);font-size:13px;padding:44px 20px;line-height:1.7;}
        .rh-ov{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.68);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;}
        .rh-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;padding:20px 22px;box-shadow:0 26px 70px rgba(0,0,0,.55);resize:both;overflow:auto;min-width:320px;min-height:280px;}
        .rh-sel{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-family:inherit;font-size:13.5px;outline:none;}
        .rh-check{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;background:var(--surface2);cursor:pointer;}
        .rh-check input{width:16px;height:16px;accent-color:var(--green);flex-shrink:0;}
    </style>
</head>
<body>

<div class="adm-top">
    <div style="display:flex;align-items:center;gap:12px">
        <img src="/marca/etaax-logo-oscuro.svg" alt="ETAAX" style="height:22px;display:block">
        <span style="font-size:9px;letter-spacing:2px;text-transform:uppercase;background:rgba(245,200,66,.12);color:var(--accent);padding:3px 9px;border-radius:20px;border:1px solid rgba(245,200,66,.3)">⚡ Admin Master</span>
    </div>
    <button class="btn-adm-back" onclick="window.location.href='admin.html'">← Panel Admin</button>
</div>

<div class="app-shell">
    <main class="main-content" id="mainContent" style="margin-left:0">
        <div class="header">
            <div class="brand">
                <span class="brand-label">Catálogo maestro global</span>
                <span class="brand-title">Perfiles y Evaluaciones</span>
            </div>
            <div class="hdr-acts">
                <button class="btn-vista" onclick="abrirTraer()" title="Copia perfiles o evaluaciones de un negocio al catálogo maestro">📥 Traer de un negocio</button>
                <a class="btn-vista" href="admin-catalogo-insumos.html">🗄️ Catálogo de insumos</a>
            </div>
        </div>

        <div class="wrap">
            <div class="rh-tabs">
                <button class="rh-tab active" id="tabPerfiles" onclick="setTab('perfiles')">🧑‍🍳 Perfiles de puesto</button>
                <button class="rh-tab" id="tabEvals" onclick="setTab('evals')">📝 Evaluaciones</button>
            </div>
            <div style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;line-height:1.6">
                Lo que esté aquí lo puede jalar cualquier negocio con el botón <b>🌐 ETAAX</b> de su módulo.
                Solo viajan <b>plantillas</b>: nunca respuestas de evaluaciones ni datos de personas.
            </div>
            <div id="lista"><div class="rh-vacio">Cargando…</div></div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script>
var ADMIN_EMAIL='admin@etaax.com';
var TABLA={ perfiles:'catalogo_perfiles', evals:'catalogo_evaluaciones' };
var _tab='perfiles', _cat={perfiles:[], evals:[]}, _negocios=[];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function nombreDe(d){ return _tab==='perfiles' ? (d.puesto||'Sin título') : (d.titulo||'Sin título'); }
function metaDe(d){
    if(_tab==='perfiles'){
        var f=(d.funciones||[]).length, r=(d.requisitos||[]).length;
        return [(d.general&&d.general.concepto)||'', f?f+' funciones':'', r?r+' requisitos':''].filter(Boolean).join(' · ')||'—';
    }
    var n=(d.preguntas||[]).length;
    return [d.categoria||'', n+' pregunta'+(n!==1?'s':'')].filter(Boolean).join(' · ');
}

function setTab(t){
    _tab=t;
    document.getElementById('tabPerfiles').classList.toggle('active', t==='perfiles');
    document.getElementById('tabEvals').classList.toggle('active', t==='evals');
    render();
}

function render(){
    var cont=document.getElementById('lista'), lista=_cat[_tab]||[];
    if(!lista.length){
        cont.innerHTML='<div class="rh-vacio">Todavía no hay nada en este catálogo.<br>' +
            'Crea el contenido en un negocio (donde está el editor completo) y tráelo con <b>📥 Traer de un negocio</b>.</div>';
        return;
    }
    cont.innerHTML=lista.map(function(d,i){
        return '<div class="rh-item">'+
            '<div style="flex:1;min-width:0">'+
                '<div class="rh-nom">'+esc(nombreDe(d))+'</div>'+
                '<div class="rh-meta">'+esc(metaDe(d))+'</div>'+
            '</div>'+
            '<button class="rh-btn del" onclick="quitar('+i+')">🗑 Quitar</button>'+
        '</div>';
    }).join('');
}

async function cargar(){
    var r=await Promise.all([
        _supabase.from(TABLA.perfiles).select('datos').order('created_at',{ascending:true}),
        _supabase.from(TABLA.evals).select('datos').order('created_at',{ascending:true})
    ]);
    if(r[0].error||r[1].error){
        document.getElementById('lista').innerHTML='<div class="rh-vacio">No se pudieron leer los catálogos.<br>'+
            '<span style="font-size:11.5px">'+esc((r[0].error||r[1].error).message)+'</span><br>'+
            '<span style="font-size:11.5px;opacity:.7">Si dice que la tabla no existe, falta correr la migración v41.</span></div>';
        return;
    }
    _cat.perfiles=(r[0].data||[]).map(function(x){return x.datos;}).filter(Boolean);
    _cat.evals   =(r[1].data||[]).map(function(x){return x.datos;}).filter(Boolean);
    render();
}

async function quitar(i){
    var d=(_cat[_tab]||[])[i]; if(!d) return;
    if(!confirm('¿Quitar «'+nombreDe(d)+'» del catálogo ETAAX?\n\nLos negocios que ya lo jalaron conservan su copia.')) return;
    var r=await _supabase.from(TABLA[_tab]).delete().eq('id', d.id);
    if(r.error){ alert('No se pudo quitar: '+r.error.message); return; }
    _cat[_tab]=_cat[_tab].filter(function(x){return x.id!==d.id;});
    render();
}

/* ── Traer de un negocio ───────────────────────────────────────────────
   El editor bueno vive en el módulo del negocio; aquí solo se COPIA lo ya
   hecho al maestro. Al copiar se limpia todo lo que es del negocio: el link
   público (token), el estado activo y cualquier respuesta. */
function abrirTraer(){
    var ov=document.createElement('div'); ov.className='rh-ov';
    ov.innerHTML='<div class="rh-box">'+
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--text);margin-bottom:4px">📥 Traer al catálogo ETAAX</div>'+
        '<div style="font-size:12px;color:var(--text-dim);margin-bottom:16px">'+
            (_tab==='perfiles'?'Perfiles de puesto':'Plantillas de evaluación')+' de un negocio → catálogo maestro. Se copian, no se mueven.</div>'+
        '<select class="rh-sel" id="trNeg"><option value="">Elige un negocio…</option>'+
            _negocios.map(function(n){ return '<option value="'+esc(n.id)+'">'+esc(n.nombre)+'</option>'; }).join('')+
        '</select>'+
        '<div id="trLista" style="margin-top:14px;max-height:44vh;overflow:auto"></div>'+
        '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">'+
            '<button class="rh-btn" data-act="no">Cancelar</button>'+
            '<button class="rh-btn" id="trOk" style="background:var(--green);border-color:var(--green);color:#0a0908;font-weight:700" disabled>Copiar al catálogo</button>'+
        '</div></div>';
    document.body.appendChild(ov);
    function cerrar(){ try{ov.remove();}catch(e){} }
    ov.addEventListener('click',function(e){
        if(e.target===ov || (e.target.getAttribute&&e.target.getAttribute('data-act')==='no')) cerrar();
    });

    var _items=[];
    document.getElementById('trNeg').addEventListener('change', async function(){
        var negId=this.value, cont=document.getElementById('trLista');
        document.getElementById('trOk').disabled=true;
        if(!negId){ cont.innerHTML=''; return; }
        cont.innerHTML='<div class="rh-vacio" style="padding:20px">Cargando…</div>';
        var tabla=_tab==='perfiles'?'perfiles_puesto':'evaluaciones';
        var r=await _supabase.from(tabla).select('datos').eq('negocio_id',negId);
        if(r.error){ cont.innerHTML='<div class="rh-vacio" style="padding:20px;color:var(--red)">'+esc(r.error.message)+'</div>'; return; }
        _items=(r.data||[]).map(function(x){return x.datos;}).filter(Boolean);
        if(!_items.length){ cont.innerHTML='<div class="rh-vacio" style="padding:20px">Ese negocio no tiene nada aquí todavía.</div>'; return; }
        cont.innerHTML=_items.map(function(d,i){
            return '<label class="rh-check"><input type="checkbox" data-i="'+i+'">'+
                '<span><span style="font-weight:600;color:var(--text)">'+esc(nombreDe(d))+'</span>'+
                '<span style="font-size:11.5px;color:var(--text-dim)"> · '+esc(metaDe(d))+'</span></span></label>';
        }).join('');
        cont.querySelectorAll('input').forEach(function(c){
            c.addEventListener('change',function(){
                document.getElementById('trOk').disabled = !cont.querySelector('input:checked');
            });
        });
    });

    document.getElementById('trOk').addEventListener('click', async function(){
        var btn=this; btn.disabled=true; btn.textContent='Copiando…';
        var sel=[].filter.call(document.querySelectorAll('#trLista input:checked'), Boolean)
            .map(function(c){ return _items[parseInt(c.getAttribute('data-i'),10)]; });
        var recs=sel.map(function(d){
            var id=(_tab==='perfiles'?'cp_':'ce_')+genId();
            var copia=JSON.parse(JSON.stringify(d));
            copia.id=id;
            delete copia.origenCatalogoId;
            if(_tab==='evals'){
                delete copia.token;           // el link público es del negocio, no de la plantilla
                delete copia.respuestas;      // por si acaso: aquí NUNCA entran respuestas
                copia.activa=false;
            }
            return { id:id, datos:copia };
        });
        var r=await _supabase.from(TABLA[_tab]).upsert(recs);
        if(r.error){ btn.disabled=false; btn.textContent='Copiar al catálogo'; alert('No se pudo copiar: '+r.error.message); return; }
        cerrar();
        await cargar();
    });
}

/* ── Init ── */
(async function(){
    try{
        var sd=await _supabase.auth.getSession();
        var session=sd.data && sd.data.session;
        if(!session || session.user.email!==ADMIN_EMAIL){ window.location.href='admin.html'; return; }
        var rn=await _supabase.from('negocios').select('id,datos');
        _negocios=(rn.data||[]).map(function(n){ return { id:n.id, nombre:((n.datos||{}).nombre)||('Negocio '+String(n.id).slice(-6)) }; })
            .sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
        await cargar();
    }catch(e){
        document.getElementById('lista').innerHTML='<div class="rh-vacio" style="color:var(--red)">Error: '+esc(e.message||e)+'</div>';
    }
})();
</script>
<script src="/modal-drag.js"></script>
<script src="/modal-dock.js"></script>
</body>
</html>
