<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<script src="/negocio-tab.js"></script><!-- negocio activo POR PESTAÑA: debe ir primero -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Evaluación · ETAAX</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#161513;--surface:#1f1e1b;--surface2:#272521;--border:#3a3733;--text:#f0ece4;--dim:#9b958a;--green:#3dbe7a;--accent:#f5c842;--red:#e05a3a;}
        *{box-sizing:border-box;}
        body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
        .ev-grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(245,200,66,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(245,200,66,.025) 1px,transparent 1px);background-size:42px 42px;}
        .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 16px 80px;}
        .topband{height:8px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,var(--green),var(--accent));}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;}
        .head{border-top:none;border-radius:0 0 14px 14px;}
        .brand{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
        h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1.5px;margin:0 0 6px;line-height:1.05;}
        .desc{font-size:14px;color:var(--dim);white-space:pre-wrap;}
        .cat-chip{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--green);background:rgba(61,190,122,.12);border:1px solid rgba(61,190,122,.3);border-radius:20px;padding:3px 11px;margin-bottom:12px;}
        .qnum{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
        .qtxt{font-size:16px;font-weight:600;margin-bottom:14px;}
        .qtxt .req{color:var(--red);margin-left:3px;}
        .opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.12s;background:var(--surface2);}
        .opt:hover{border-color:rgba(61,190,122,.45);}
        .opt.sel{border-color:var(--green);background:rgba(61,190,122,.08);}
        .opt input{accent-color:var(--green);width:18px;height:18px;flex:none;}
        .opt span{font-size:14px;}
        .scale{display:flex;gap:8px;flex-wrap:wrap;}
        .scale-btn{flex:1;min-width:42px;padding:12px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:.12s;}
        .scale-btn:hover{border-color:rgba(61,190,122,.45);}
        .scale-btn.sel{border-color:var(--green);background:var(--green);color:#0f0e0c;}
        .scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px;}
        textarea,input.txt{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;font-family:inherit;font-size:14px;outline:none;}
        textarea:focus,input.txt:focus{border-color:var(--green);}
        textarea{resize:vertical;min-height:80px;}
        .lbl{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
        .field{margin-bottom:14px;}
        .sub-btn{width:100%;background:var(--green);color:#0f0e0c;border:none;border-radius:11px;padding:15px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.15s;}
        .sub-btn:hover{filter:brightness(1.08);}
        .sub-btn:disabled{opacity:.5;cursor:default;}
        .center{text-align:center;padding:60px 20px;color:var(--dim);}
        .center h1{color:var(--text);}
        .big-ic{font-size:54px;margin-bottom:14px;}
        .err-note{font-size:12px;color:var(--red);margin-top:8px;display:none;}
        .foot{text-align:center;font-size:11px;color:var(--dim);margin-top:18px;letter-spacing:1px;}
    </style>
</head>
<body>
<div class="ev-grid-bg"></div>
<div class="wrap" id="root">
    <div class="center"><div class="big-ic">⏳</div><div>Cargando evaluación…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
var TOKEN=qs('t');
var _eval=null, _resp={};

function centro(ic,tit,sub){
    document.getElementById('root').innerHTML='<div class="center"><div class="big-ic">'+ic+'</div><h1>'+esc(tit)+'</h1><div>'+esc(sub||'')+'</div></div>';
}

async function cargar(){
    if(!TOKEN){ centro('🔗','Link inválido','Falta el código de la evaluación.'); return; }
    if(typeof _supabase==='undefined'){ centro('⚠️','Sin conexión','No se pudo conectar. Intenta más tarde.'); return; }
    try{
        var r=await _supabase.rpc('evaluacion_publica',{p_token:TOKEN});
        if(r.error) throw r.error;
        var datos=r.data;
        if(!datos){ centro('🚫','Evaluación no disponible','El link no es válido o la evaluación está cerrada.'); return; }
        _eval=datos;
        render();
    }catch(e){ centro('⚠️','Algo salió mal',(e&&e.message)||'Intenta de nuevo.'); }
}

function render(){
    var e=_eval;
    var html='<div class="topband"></div>'+
        '<div class="card head">'+
            '<div class="brand">ETAAX · Evaluación</div>'+
            (e.categoria?'<div class="cat-chip">'+esc(e.categoria)+'</div>':'')+
            '<h1>'+esc(e.titulo||'Evaluación')+'</h1>'+
            (e.descripcion?'<div class="desc">'+esc(e.descripcion)+'</div>':'')+
        '</div>'+
        // Ficha de quien contesta: la arma la evaluación (campos y obligatorios)
        '<div class="card">'+ camposFicha(e) +'</div>';
    (e.preguntas||[]).forEach(function(q,idx){
        html+='<div class="card" data-qcard="'+q.id+'">'+
            '<div class="qnum">Pregunta '+(idx+1)+'</div>'+
            '<div class="qtxt">'+esc(q.texto||'')+(q.requerida?'<span class="req">*</span>':'')+'</div>'+
            cuerpoPregunta(q)+
            '<div class="err-note" data-err="'+q.id+'">Esta pregunta es obligatoria.</div>'+
        '</div>';
    });
    html+='<button class="sub-btn" id="btnEnviar" onclick="enviar()">Enviar respuestas</button>'+
        '<div class="foot">Tus respuestas se envían de forma privada a ETAAX.</div>';
    document.getElementById('root').innerHTML=html;
}

/* ── Ficha de quien contesta ────────────────────────────────────────────
   Los campos los define cada evaluación (bloque "Datos de quien contesta").
   Son datos de identificación, no preguntas: no suman puntos. Las
   evaluaciones creadas antes de esto no traen `ficha` → nombre y puesto,
   que es exactamente lo que pedían. */
var FICHA_CAMPOS=[
    {id:'nombre', nom:'Nombre completo',    ph:'Nombre y apellido',        tipo:'text',   ac:'name'},
    {id:'puesto', nom:'Puesto / área',      ph:'Ej. Barra, Cocina, Candidato', tipo:'text' },
    {id:'edad',   nom:'Edad',               ph:'Ej. 28',                   tipo:'number', min:14, max:99},
    {id:'tel',    nom:'Celular / WhatsApp', ph:'10 dígitos',               tipo:'tel',    ac:'tel'},
    {id:'correo', nom:'Correo',             ph:'tucorreo@ejemplo.com',     tipo:'email',  ac:'email'}
];
var FICHA_DEFAULT={ nombre:{on:true,req:true}, puesto:{on:true,req:false},
                    edad:{on:false,req:false}, tel:{on:false,req:false}, correo:{on:false,req:false} };
function fichaDe(e){
    var f=(e&&e.ficha)||{}, out={};
    FICHA_CAMPOS.forEach(function(c){
        var v=f[c.id]||FICHA_DEFAULT[c.id]||{on:false,req:false};
        var on=(c.id==='nombre')?true:!!v.on;
        out[c.id]={ on:on, req:(c.id==='nombre')?true:(on&&!!v.req) };
    });
    return out;
}
function camposFicha(e){
    var f=fichaDe(e);
    return FICHA_CAMPOS.filter(function(c){ return f[c.id].on; }).map(function(c){
        var req=f[c.id].req;
        return '<div class="field">'+
            '<label class="lbl">'+esc(c.nom)+(req?' *':' (opcional)')+'</label>'+
            '<input class="txt" id="rf_'+c.id+'" type="'+c.tipo+'" placeholder="'+esc(c.ph)+'"'+
                (c.ac?' autocomplete="'+c.ac+'"':'')+
                (c.min!=null?' min="'+c.min+'"':'')+(c.max!=null?' max="'+c.max+'"':'')+
                (c.tipo==='tel'?' inputmode="numeric"':'')+'>'+
            '<div class="err-note" data-ferr="'+c.id+'"></div>'+
        '</div>';
    }).join('');
}
// Devuelve {ok, datos} — valida obligatorios y formato de correo/celular/edad.
function leerFicha(e){
    var f=fichaDe(e), datos={}, malo=null;
    function falla(id,msg){ if(!malo)malo={id:id,msg:msg}; var el=document.querySelector('[data-ferr="'+id+'"]'); if(el){ el.textContent=msg; el.style.display='block'; } }
    FICHA_CAMPOS.forEach(function(c){
        if(!f[c.id].on) return;
        var el=document.getElementById('rf_'+c.id); if(!el) return;
        var el2=document.querySelector('[data-ferr="'+c.id+'"]'); if(el2) el2.style.display='none';
        var v=(el.value||'').trim();
        if(!v){ if(f[c.id].req) falla(c.id,'Este dato es obligatorio.'); return; }
        if(c.id==='correo' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { falla(c.id,'Revisa el correo.'); return; }
        if(c.id==='tel'){
            var d=v.replace(/\D/g,'');
            if(d.length<10){ falla(c.id,'El celular debe traer 10 dígitos.'); return; }
            v=d;
        }
        if(c.id==='edad'){
            var n=parseInt(v,10);
            if(isNaN(n)||n<14||n>99){ falla(c.id,'Escribe una edad entre 14 y 99.'); return; }
            v=n;
        }
        datos[c.id]=v;
    });
    if(malo){
        var campo=document.getElementById('rf_'+malo.id);
        if(campo){ campo.focus(); campo.scrollIntoView({behavior:'smooth',block:'center'}); }
        return {ok:false};
    }
    return {ok:true, datos:datos};
}

function cuerpoPregunta(q){
    if(q.tipo==='opcion'||q.tipo==='sino'){
        return (q.opciones||[]).map(function(o,i){
            return '<label class="opt" onclick="_pick(\''+q.id+'\','+i+',this,false)">'+
                '<input type="radio" name="q_'+q.id+'"><span>'+esc(o.texto||('Opción '+(i+1)))+'</span></label>';
        }).join('');
    }
    if(q.tipo==='multiple'){
        return (q.opciones||[]).map(function(o,i){
            return '<label class="opt" onclick="_pick(\''+q.id+'\','+i+',this,true)">'+
                '<input type="checkbox"><span>'+esc(o.texto||('Opción '+(i+1)))+'</span></label>';
        }).join('');
    }
    if(q.tipo==='escala'){
        var mn=q.escalaMin!=null?q.escalaMin:1, mx=q.escalaMax!=null?q.escalaMax:5, btns='';
        for(var v=mn;v<=mx;v++) btns+='<button type="button" class="scale-btn" onclick="_scale(\''+q.id+'\','+v+',this)">'+v+'</button>';
        return '<div class="scale">'+btns+'</div><div class="scale-ends"><span>'+mn+'</span><span>'+mx+'</span></div>';
    }
    return '<textarea data-open="'+q.id+'" placeholder="Tu respuesta…"></textarea>';
}

// Selección opción única / sí-no / múltiple
function _pick(qid,i,el,multi){
    var card=el.closest('[data-qcard]');
    if(multi){
        var inp=el.querySelector('input'); inp.checked=!inp.checked;
        el.classList.toggle('sel',inp.checked);
        var sel=[]; card.querySelectorAll('.opt').forEach(function(o,ix){ if(o.querySelector('input').checked) sel.push(ix); });
        _resp[qid]={tipo:'multiple',idxs:sel};
    } else {
        card.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('sel'); o.querySelector('input').checked=false; });
        el.classList.add('sel'); el.querySelector('input').checked=true;
        _resp[qid]={tipo:'opcion',idx:i};
    }
    _clearErr(qid);
}
function _scale(qid,v,el){
    var card=el.closest('[data-qcard]');
    card.querySelectorAll('.scale-btn').forEach(function(b){b.classList.remove('sel');});
    el.classList.add('sel');
    _resp[qid]={tipo:'escala',valor:v};
    _clearErr(qid);
}
function _clearErr(qid){ var e=document.querySelector('[data-err="'+qid+'"]'); if(e)e.style.display='none'; }

function _puntosMaxPregunta(q){
    if(q.tipo==='escala') return Math.max(parseInt(q.escalaMax)||0,0);
    if(q.tipo==='opcion'||q.tipo==='sino') return (q.opciones||[]).reduce(function(m,o){return Math.max(m,parseFloat(o.valor)||0);},0);
    if(q.tipo==='multiple') return (q.opciones||[]).reduce(function(s,o){return s+(parseFloat(o.valor)||0);},0);
    return 0;
}

async function enviar(){
    var e=_eval;
    var _f=leerFicha(e);
    if(!_f.ok) return;                       // el propio campo dice qué falta
    var nombre=_f.datos.nombre||'';
    // Validar obligatorias + recoger respuestas abiertas
    var faltan=false, primeraFalta=null, respuestas=[], score=0, scoreMax=0;
    (e.preguntas||[]).forEach(function(q){
        scoreMax+=_puntosMaxPregunta(q);
        var r=_resp[q.id], txt='', val=0, contestada=false;
        if(q.tipo==='abierta'){
            var ta=document.querySelector('[data-open="'+q.id+'"]'); txt=ta?ta.value.trim():''; contestada=!!txt;
        } else if(r){
            contestada=true;
            if(r.tipo==='opcion'){ val=parseFloat((q.opciones[r.idx]||{}).valor)||0; txt=(q.opciones[r.idx]||{}).texto||''; }
            else if(r.tipo==='escala'){ val=parseFloat(r.valor)||0; txt=String(r.valor); }
            else if(r.tipo==='multiple'){ (r.idxs||[]).forEach(function(ix){ val+=parseFloat((q.opciones[ix]||{}).valor)||0; }); txt=(r.idxs||[]).map(function(ix){return (q.opciones[ix]||{}).texto;}).filter(Boolean).join(', '); contestada=(r.idxs||[]).length>0; }
        }
        if(q.requerida && !contestada){ faltan=true; if(!primeraFalta)primeraFalta=q.id; var ed=document.querySelector('[data-err="'+q.id+'"]'); if(ed)ed.style.display='block'; }
        score+=val;
        respuestas.push({preguntaId:q.id, tipo:q.tipo, texto:q.texto, respuesta:txt, puntos:val});
    });
    if(faltan){ var c=document.querySelector('[data-qcard="'+primeraFalta+'"]'); if(c)c.scrollIntoView({behavior:'smooth',block:'center'}); return; }

    var btn=document.getElementById('btnEnviar'); btn.disabled=true; btn.textContent='Enviando…';
    var datos={
        respondente:_f.datos,                // nombre + los campos que pida la evaluación
        respuestas:respuestas,
        score:score, scoreMax:scoreMax, scorePct: scoreMax>0?Math.round(score/scoreMax*100):0,
        evaluacionTitulo:e.titulo, categoria:e.categoria
    };
    try{
        var rr=await _supabase.rpc('evaluacion_responder',{p_token:TOKEN, p_datos:datos});
        if(rr.error) throw rr.error;
        gracias();
    }catch(err){ btn.disabled=false; btn.textContent='Enviar respuestas'; alert('No se pudo enviar: '+((err&&err.message)||'intenta de nuevo.')); }
}

function gracias(){
    document.getElementById('root').innerHTML='<div class="topband"></div>'+
        '<div class="card head center" style="padding:56px 24px">'+
            '<div class="big-ic">✅</div>'+
            '<h1>¡Gracias!</h1>'+
            '<div>Tu evaluación fue enviada correctamente.</div>'+
            '<div class="foot" style="margin-top:22px">ETAAX · '+esc(_eval.titulo||'')+'</div>'+
        '</div>';
    window.scrollTo(0,0);
}

cargar();
</script>
</body>
</html>
