<style>
.roles-tabs { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px; }
.rol-tab {
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface2);cursor:pointer;font-family:'DM Sans',sans-serif;
    font-size:13px;color:var(--text-muted);transition:all .2s;white-space:nowrap;
}
.rol-tab:hover { border-color:var(--green);color:var(--text); }
.rol-tab.active { border-color:var(--accent);background:var(--accent-dim);color:var(--accent);font-weight:600; }
.rol-tab-icon { font-size:16px; }

.permisos-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
}
.permiso-card {
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 20px;display:flex;align-items:center;gap:14px;
    transition:border-color .2s;
}
.permiso-card.active-perm { border-color:var(--green); background:rgba(61,190,122,.04); }
.permiso-card.locked { opacity:.5; cursor:default; }
.permiso-icon { font-size:22px;width:40px;text-align:center;flex-shrink:0; }
.permiso-info { flex:1;min-width:0; }
.permiso-label { font-size:14px;font-weight:500;color:var(--text); }
.permiso-sub { font-size:11px;color:var(--text-dim);margin-top:2px; }

/* Toggle switch */
.toggle-wrap { flex-shrink:0; }
.toggle { position:relative;display:inline-block;width:40px;height:22px; }
.toggle input { opacity:0;width:0;height:0; }
.toggle-slider {
    position:absolute;inset:0;background:var(--border2);border-radius:22px;
    cursor:pointer;transition:background .2s;
}
.toggle-slider::before {
    content:'';position:absolute;height:16px;width:16px;
    left:3px;bottom:3px;background:#fff;border-radius:50%;
    transition:transform .2s;
}
.toggle input:checked + .toggle-slider { background:var(--green); }
.toggle input:checked + .toggle-slider::before { transform:translateX(18px); }
.toggle input:disabled + .toggle-slider { cursor:default;opacity:.6; }

.save-bar {
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:14px 20px;margin-bottom:24px;flex-wrap:wrap;
}
.save-bar-info { font-size:13px;color:var(--text-muted); }
.save-bar-info strong { color:var(--text); }
.btn-save {
    background:var(--green);border:none;color:#0a0908;
    font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
    padding:9px 22px;border-radius:7px;cursor:pointer;transition:opacity .2s;
}
.btn-save:hover { opacity:.85; }
.btn-reset {
    background:transparent;border:1px solid var(--border);color:var(--text-muted);
    font-family:'DM Sans',sans-serif;font-size:12px;
    padding:8px 16px;border-radius:7px;cursor:pointer;transition:all .2s;
}
.btn-reset:hover { border-color:var(--red);color:var(--red); }

.admin-lock-note {
    font-size:11px;color:var(--text-dim);
    background:var(--surface2);border:1px solid var(--border);border-radius:7px;
    padding:8px 14px;margin-bottom:20px;display:flex;align-items:center;gap:8px;
}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:8px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);transition:all .2s;}
.theme-toggle:hover{border-color:var(--green);color:var(--green);}

</style>
</head>

<script>
(function(){
    var saved = localStorage.getItem('etaax_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', function(){
        if (saved === 'light') { document.getElementById('themeIcon').textContent='🌙'; document.getElementById('themeLabel').textContent='Modo oscuro'; }
    });
})();
function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('etaax_theme', next);
    document.getElementById('themeIcon').textContent  = next === 'light' ? '🌙' : '☀️';
    document.getElementById('themeLabel').textContent = next === 'light' ? 'Modo oscuro' : 'Modo claro';
}
function toggleNav() {
    var nav = document.getElementById('nav'); var main = document.getElementById('mainContent');
    nav.classList.toggle('cerrado'); if (main) main.classList.toggle('expandido');
    var cerrado = nav.classList.contains('cerrado');
    var btn = document.getElementById('navToggleBtn'); var txt = document.getElementById('navToggleTxt');
    if (btn) btn.childNodes[0].textContent = cerrado ? '▶' : '◀';
    if (txt) txt.textContent = cerrado ? 'Expandir' : 'Ocultar';
    if (btn) btn.setAttribute('data-tooltip', cerrado ? 'Expandir' : 'Ocultar');
}

/* ── SESSION ── */
function getNegocioActivo() { return localStorage.getItem('etaax_negocio_activo') || ''; }
function _sk(key) { var id = getNegocioActivo(); return id ? ('etaax_' + id + '_' + key) : ('etaax_' + key); }

/* ── ROLES ── */
var ROLES = [
    { key:'admin',          label:'Administrador',   icon:'👑', color:'#c87a6a' },
    { key:'gerente',        label:'Gerente',          icon:'🎯', color:'#f5c842' },
    { key:'jefe_cocina',    label:'Jefe de Cocina',   icon:'👨‍🍳', color:'#3dbe7a' },
    { key:'chef',           label:'Chef',             icon:'🍳', color:'#3dbe7a' },
    { key:'cocinero',       label:'Cocinero',         icon:'🥘', color:'#3dbe7a' },
    { key:'barman',         label:'Barman',           icon:'🍸', color:'#7ab8f5' },
    { key:'barista',        label:'Barista',          icon:'☕', color:'#c4a882' },
    { key:'mesero',         label:'Mesero',           icon:'🛎️', color:'#9b8de8' },
    { key:'administrativo', label:'Administrativo',   icon:'📋', color:'#f5c842' },
    { key:'otro',           label:'Otro',             icon:'👤', color:'#7a7570' },
];

/* ── MÓDULOS ── */
var MODULES = [
    { key:'recetas',       label:'Recetas y Escandallos', icon:'📖', sub:'Catálogo de recetas, sub-recetas y costos' },
    { key:'insumos',       label:'Catálogo de Insumos',   icon:'🧂', sub:'Ingredientes, precios y proveedores' },
    { key:'inventarios',   label:'Inventarios',           icon:'📦', sub:'Control de existencias por área' },
    { key:'requisiciones', label:'Requisiciones',         icon:'📋', sub:'Solicitudes de compra y pedidos' },
    { key:'ventas',        label:'Ventas',                icon:'💰', sub:'Registro y reporte de ventas' },
    { key:'gastos',        label:'Gastos',                icon:'📤', sub:'Captura y control de gastos' },
    { key:'menu',          label:'Menú',                  icon:'📄', sub:'Carta digital y precios de venta' },
    { key:'proveedores',   label:'Proveedores',           icon:'🚚', sub:'Directorio y condiciones de compra' },
    { key:'clientes',      label:'Clientes',              icon:'⭐', sub:'Directorio de clientes frecuentes' },
    { key:'staff',         label:'Gestión de Staff',      icon:'👥', sub:'Expedientes y datos del equipo' },
    { key:'permisos',      label:'Permisos y Roles',      icon:'🔐', sub:'Control de acceso por perfil' },
    { key:'financiero',    label:'Financiero',            icon:'📊', sub:'Costos, márgenes y análisis' },
    { key:'config',        label:'Configuración',         icon:'⚙️', sub:'Ajustes generales del negocio' },
];

/* ── DEFAULT PERMISSIONS ──
   Fuente única en /page-guard.js (ETAAX_PERM_DEFAULTS) — el guard
   de las páginas usa el mismo mapa para hacer el enforcement. */
var DEFAULTS = window.ETAAX_PERM_DEFAULTS;

/* ── STORAGE ── */
function loadPermisos() {
    try { return JSON.parse(localStorage.getItem(_sk('permisos'))) || {}; } catch(e){ return {}; }
}
async function savePermisos(d) {
    localStorage.setItem(_sk('permisos'), JSON.stringify(d));
    var negId = getNegocioActivo();
    if (!negId) return;
    var rows = Object.keys(d).map(function(rol){
        return { negocio_id: negId, rol: rol, datos: d[rol], updated_at: new Date().toISOString() };
    });
    if (!rows.length) return;
    var r = await _supabase.from('permisos').upsert(rows, { onConflict: 'negocio_id,rol' });
    if (r.error) _sbToastError('permisos upsert: ' + r.error.message);
}
async function syncPermisos() {
    var negId = getNegocioActivo();
    if (!negId) return;
    var res = await _supabase.from('permisos').select('rol, datos').eq('negocio_id', negId);
    if (res.error || !res.data || !res.data.length) return;
    var combined = {};
    res.data.forEach(function(row){ combined[row.rol] = row.datos; });
    localStorage.setItem(_sk('permisos'), JSON.stringify(combined));
}

function getRolPermisos(rolKey) {
    var all = loadPermisos();
    return all[rolKey] || JSON.parse(JSON.stringify(DEFAULTS[rolKey] || {}));
}
function setRolPermisos(rolKey, perms) {
    var all = loadPermisos();
    all[rolKey] = perms;
    savePermisos(all);
}

/* ── STATE ── */
var _rolActivo = 'gerente';

/* ── RENDER ── */
function renderTabs() {
    var tabs = document.getElementById('rolesTabs');
    tabs.innerHTML = ROLES.map(function(r){
        return '<button class="rol-tab' + (r.key === _rolActivo ? ' active' : '') + '" ' +
            'onclick="selectRol(\'' + r.key + '\')" ' +
            'style="' + (r.key === _rolActivo ? 'border-color:' + r.color + ';color:' + r.color + ';background:' + r.color + '15' : '') + '">' +
            '<span class="rol-tab-icon">' + r.icon + '</span>' + r.label +
        '</button>';
    }).join('');
    document.getElementById('rolActivoLabel').textContent = (ROLES.find(function(r){ return r.key === _rolActivo; })||{}).label || _rolActivo;
}

function renderGrid() {
    var isAdmin = _rolActivo === 'admin';
    var perms   = getRolPermisos(_rolActivo);
    var grid    = document.getElementById('permisosGrid');
    document.getElementById('adminLockNote').style.display = isAdmin ? '' : 'none';

    grid.innerHTML = MODULES.map(function(m){
        var checked  = perms[m.key] !== false && (perms[m.key] || DEFAULTS[_rolActivo][m.key]);
        var disabled = isAdmin;
        return '<div class="permiso-card' + (checked ? ' active-perm' : '') + (disabled ? ' locked' : '') + '" ' +
            (disabled ? '' : 'onclick="togglePermiso(\'' + m.key + '\')"') + ' id="pcard_' + m.key + '">' +
            '<div class="permiso-icon">' + m.icon + '</div>' +
            '<div class="permiso-info">' +
                '<div class="permiso-label">' + m.label + '</div>' +
                '<div class="permiso-sub">' + m.sub + '</div>' +
            '</div>' +
            '<div class="toggle-wrap">' +
                '<label class="toggle">' +
                    '<input type="checkbox"' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '') +
                    ' id="tog_' + m.key + '" onchange="togglePermiso(\'' + m.key + '\')">' +
                    '<span class="toggle-slider"></span>' +
                '</label>' +
            '</div>' +
        '</div>';
    }).join('');
}

function selectRol(key) {
    _rolActivo = key;
    renderTabs();
    renderGrid();
}

function togglePermiso(modKey) {
    if (_rolActivo === 'admin') return;
    var perms = getRolPermisos(_rolActivo);
    perms[modKey] = !perms[modKey];
    // Update UI immediately
    var tog   = document.getElementById('tog_' + modKey);
    var card  = document.getElementById('pcard_' + modKey);
    if (tog)  tog.checked = perms[modKey];
    if (card) {
        card.classList.toggle('active-perm', perms[modKey]);
    }
    // Store in memory (not saved yet)
    var all = loadPermisos();
    all[_rolActivo] = perms;
    savePermisos(all);
}

function guardarPermisos() {
    var label = (ROLES.find(function(r){ return r.key === _rolActivo; })||{}).label || _rolActivo;
    showToast('Permisos de ' + label + ' guardados');
}

function resetarRol() {
    if (_rolActivo === 'admin') return;
    if (!confirm('¿Restablecer los permisos por defecto para este rol?')) return;
    var all = loadPermisos();
    all[_rolActivo] = JSON.parse(JSON.stringify(DEFAULTS[_rolActivo] || {}));
    savePermisos(all);
    renderGrid();
    showToast('Permisos restablecidos');
}

function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#0a0908;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:fadeUp .3s ease';
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
}


function _esc2(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function _mostrarNavBar() {
    var bar = document.getElementById('permNavBar');
    if (!bar) return;
    var ctx;
    try { ctx = JSON.parse(localStorage.getItem('etaax_ctx') || 'null'); } catch(e) {}
    var parts = window.location.pathname.split('/').filter(Boolean);
    var hubPath = '/hub.html';

    if (ctx) {
        var color = ctx.negColor || '#3dbe7a';
        bar.innerHTML =
            '<div class="ctx-bar-inner" style="border-color:'+color+'44">' +
            '<div class="ctx-neg-emoji-wrap" style="background:'+color+'1a;border-color:'+color+'33">'+_esc2(ctx.negEmoji)+'</div>' +
            '<div><div class="ctx-neg-name">'+_esc2(ctx.negNombre)+'</div><div class="ctx-neg-tipo">'+_esc2(ctx.negTipo)+'</div></div>' +
            '<div style="display:flex;align-items:center;gap:4px;margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.08)">' +
            '<button class="ctx-btn" onclick="history.back()" title="Atrás" style="padding:4px 9px">↩</button>' +
            '<button class="ctx-btn" onclick="history.forward()" title="Adelante" style="padding:4px 9px">↪</button>' +
            '</div>' +
            '<div style="margin-left:auto;display:flex;gap:8px;align-items:center">' +
            '<div class="ctx-user-badge"><span>'+_esc2((ctx.userName||'').split(' ')[0])+'</span>' +
            '<span class="ctx-badge-plan" style="background:'+ctx.userColor+'22;color:'+ctx.userColor+'">'+_esc2(ctx.userBadge)+'</span></div>' +
            '<a href="'+hubPath+'" class="ctx-btn">← Ir a Módulos</a>' +
            '<button class="ctx-btn ctx-btn-danger" onclick="ctxSalir()">Salir</button>' +
            '</div></div>';
    } else {
        // Fallback sin sesión: botones simples
        bar.innerHTML =
            '<div class="ctx-bar-inner">' +
            '<div style="display:flex;align-items:center;gap:4px">' +
            '<button class="ctx-btn" onclick="history.back()" style="padding:4px 9px">↩</button>' +
            '<button class="ctx-btn" onclick="history.forward()" style="padding:4px 9px">↪</button>' +
            '</div>' +
            '<div style="margin-left:auto;display:flex;gap:8px">' +
            '<a href="'+hubPath+'" class="ctx-btn">← Ir a Módulos</a>' +
            '<button class="ctx-btn ctx-btn-danger" onclick="ctxSalir()">Salir</button>' +
            '</div></div>';
    }
    bar.style.display = 'flex';
    // Aplicar los mismos ajustes de layout que has-ctx
    document.body.classList.add('has-ctx');
}

document.addEventListener('DOMContentLoaded', async function(){
    // Cargar datos en background mientras se muestra el modal de auth
    syncPermisos().then(function(){ renderTabs(); renderGrid(); });
    // Pedir contraseña admin para acceder
    _pedirClaveAdmin('Permisos y roles — Acceso restringido', function(){
        _mostrarNavBar();
    }, '🔐 Desbloquear');
});

function ctxSalir() {
    var ctx = null;
    try { ctx = JSON.parse(localStorage.getItem('etaax_ctx') || 'null'); } catch (e) {}
    // Admin maestro: volver al panel sin cerrar su sesión de Supabase
    if (ctx && ctx.ctxAdmin) {
        sessionStorage.removeItem('etaax_admin_impersonate');
        localStorage.removeItem('etaax_negocio_activo');
        localStorage.removeItem('etaax_ctx');
        window.location.href = '/admin.html';
        return;
    }
    if (typeof _etaaxWipeCache === 'function') _etaaxWipeCache();
    localStorage.removeItem('etaax_negocio_activo');
    localStorage.removeItem('etaax_ctx');
    sessionStorage.clear();
    window.location.href = '/hub.html?salir=1';
}
</script>
<script src="../admin-guard.js"></script>
