body{overflow:hidden}
.org-top{position:fixed;left:0;right:0;z-index:150;display:flex;align-items:center;gap:8px;padding:10px 16px;background:linear-gradient(180deg,rgba(10,9,8,.95),rgba(10,9,8,.6));flex-wrap:wrap}

    box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 22px var(--node-glow,rgba(61,190,122,.22)),0 10px 24px rgba(0,0,0,.45);
    cursor:grab;user-select:none;transition:box-shadow .2s,transform .08s}
.org-node:hover{box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 30px var(--node-glow,rgba(61,190,122,.4)),0 12px 28px rgba(0,0,0,.5)}
.org-node.sel{outline:2px solid #7ab8f5;outline-offset:2px}
.org-node-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.org-dot{width:9px;height:9px;border-radius:50%;background:var(--node-c,#3dbe7a);box-shadow:0 0 8px var(--node-c,#3dbe7a);flex-shrink:0}
.org-puesto{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;color:var(--text);line-height:1.05}
.org-nombre{font-size:12px;color:var(--text-muted);line-height:1.3}
.org-meta{font-size:10px;color:var(--text-dim);margin-top:7px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-dim);text-align:center;pointer-events:none;z-index:50}

.save-ind.show{opacity:1}
/* modal */
.org-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px}
.org-ov.open{display:flex}

.om-field input,.om-field textarea,.om-field select{width:100%;box-sizing:border-box;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none}

.om-actions{display:flex;gap:8px;margin-top:18px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="/etaax-store.js"></script><!-- almacenamiento grande: la cola de salida no cabe en localStorage -->
<script src="/etaax-db.js"></script>
<script>
function getNegocioActivo(){return localStorage.getItem('etaax_negocio_activo')||'';}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toggleNav(){var nav=document.getElementById('nav');nav.classList.toggle('cerrado');var c=nav.classList.contains('cerrado');var b=document.getElementById('navToggleBtn'),t=document.getElementById('navToggleTxt');if(b)b.childNodes[0].textContent=c?'▶':'◀';if(t)t.textContent=c?'Expandir':'Ocultar';if(b)b.setAttribute('data-tooltip',c?'Expandir':'Ocultar');document.body.classList.toggle('nav-open',!c);}

var COLORS=['#3dbe7a','#7ab8f5','#f5c842','#e0a93d','#c87a6a','#b98cff'];
var _nodos=[], _conex=[], _perfiles=[];
var pan={x:0,y:0}, zoom=1;
var _editId=null, _editColor=COLORS[0];
var _connectMode=false, _disconnectMode=false, _connectFrom=null;
var _orgRtCh=null, _orgGuardarTs=0, _orgRtT=null;

var viewport=document.getElementById('viewport'), world=document.getElementById('world'), svg=document.getElementById('links');

/* ── Carga ── */
async function _sbInit(){
    var negId=getNegocioActivo();
    if(!negId||typeof _supabase==='undefined'){ render(); return; }
    var r=await _supabase.from('organigrama').select('datos').eq('negocio_id',negId).maybeSingle();
    if(!r.error && r.data && r.data.datos){ _nodos=r.data.datos.nodos||[]; _conex=r.data.datos.conexiones||[]; }
    var rp=await _supabase.from('perfiles_puesto').select('datos').eq('negocio_id',negId);
    if(!rp.error) _perfiles=(rp.data||[]).map(function(x){return x.datos;}).filter(Boolean);
    resetVista(true);
    render();
    _subOrgRealtime(negId);
}

/* ── Guardado (debounce) ── */
var _saveT=null;
function guardar(){
    clearTimeout(_saveT);
    _saveT=setTimeout(function(){
        _orgGuardarTs=Date.now(); // marca para ignorar el eco de realtime de nuestro propio write
        if(typeof sbUpsertDoc==='function') sbUpsertDoc('organigrama',{nodos:_nodos,conexiones:_conex,updatedAt:new Date().toISOString()});
        var s=document.getElementById('saveInd'); s.classList.add('show'); setTimeout(function(){s.classList.remove('show');},1400);
    },700);
}

// Realtime: si otro dispositivo cambia el organigrama, se actualiza solo (estilo
// Drive). Ignora el eco de nuestro propio guardado y no interrumpe si estás
// arrastrando, moviendo el lienzo o editando un nodo.
function _subOrgRealtime(negId){
    if(!negId||typeof sbRealtime!=='function') return;
    if(_orgRtCh&&_supabase.removeChannel){ try{_supabase.removeChannel(_orgRtCh);}catch(e){} }
    _orgRtCh=sbRealtime('organigrama',negId,function(){
        if(getNegocioActivo()!==negId) return;
        if(Date.now()-_orgGuardarTs < 3000) return;
        if(dragId||panning) return;
        if(document.getElementById('nodeOv').classList.contains('open')) return;
        clearTimeout(_orgRtT);
        _orgRtT=setTimeout(async function(){
            if(dragId||panning||document.getElementById('nodeOv').classList.contains('open')) return;
            var r=await _supabase.from('organigrama').select('datos').eq('negocio_id',negId).maybeSingle();
            if(r.error||!r.data||!r.data.datos) return;
            _nodos=r.data.datos.nodos||[]; _conex=r.data.datos.conexiones||[]; render();
        },450);
    });
}

/* ── Transform / pan / zoom ── */
function applyTransform(){ world.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')'; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function zoomBtn(f){
    var r=viewport.getBoundingClientRect(), mx=r.width/2, my=r.height/2, prev=zoom;
    zoom=clamp(zoom*f,0.3,2.5);
    pan.x=mx-((mx-pan.x)/prev)*zoom; pan.y=my-((my-pan.y)/prev)*zoom; applyTransform();
}
viewport.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=viewport.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top, prev=zoom;
    zoom=clamp(zoom*(e.deltaY<0?1.1:0.9),0.3,2.5);
    pan.x=mx-((mx-pan.x)/prev)*zoom; pan.y=my-((my-pan.y)/prev)*zoom; applyTransform();
},{passive:false});

var panning=false, panStart=null, dragId=null, dragStart=null, moved=0, _lastPt=null;
function _startPan(cx,cy){ panning=true; viewport.classList.add('grabbing'); panStart={x:cx-pan.x,y:cy-pan.y}; }
function _moveTo(cx,cy){
    if(panning){ pan.x=cx-panStart.x; pan.y=cy-panStart.y; applyTransform(); return; }
    if(dragId){
        var nd=_nodos.find(function(n){return n.id===dragId;}); if(!nd) return;
        nd.x=dragStart.x+(cx-dragStart.mx)/zoom;
        nd.y=dragStart.y+(cy-dragStart.my)/zoom;
        if(_lastPt) moved+=Math.abs(cx-_lastPt.x)+Math.abs(cy-_lastPt.y); // sirve para mouse y touch
        _lastPt={x:cx,y:cy};
        var el=document.getElementById('nd_'+nd.id); if(el){ el.style.left=nd.x+'px'; el.style.top=nd.y+'px'; }
        renderConex();
    }
}
function _endPointer(){
    _lastPt=null; _pinch=null;
    if(panning){ panning=false; viewport.classList.remove('grabbing'); }
    if(dragId){
        var id=dragId; dragId=null;          // limpiar SIEMPRE → nunca se queda pegado
        if(moved<=4){ if(!_connectMode && !_disconnectMode) abrirModal(id); }   // clic/tap sin arrastre → editar
        else { guardar(); }                                  // arrastre real → guardar posición
    }
}
var _pinch=null; // estado del pinch-zoom (2 dedos) en tablet
// Mouse
viewport.addEventListener('mousedown',function(e){
    if(e.target.closest('.org-node')) return;
    _startPan(e.clientX,e.clientY);
});
document.addEventListener('mousemove',function(e){ _moveTo(e.clientX,e.clientY); });
document.addEventListener('mouseup',_endPointer);
// Touch (tablet) — mismos gestos con un dedo
viewport.addEventListener('touchstart',function(e){
    if(e.target.closest('.org-node')) return;
    if(e.touches.length!==1) return;
    _startPan(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
document.addEventListener('touchmove',function(e){
    // Pinch-zoom con 2 dedos (tablet) — equivalente a la rueda del mouse
    if(e.touches.length===2){
        e.preventDefault();
        panning=false; dragId=null;           // 2 dedos → no es pan/arrastre
        var t0=e.touches[0], t1=e.touches[1];
        var dist=Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
        var r=viewport.getBoundingClientRect();
        var mx=(t0.clientX+t1.clientX)/2 - r.left, my=(t0.clientY+t1.clientY)/2 - r.top;
        if(!_pinch){ _pinch={dist:dist, zoom:zoom, mx:mx, my:my, panx:pan.x, pany:pan.y}; return; }
        var nz=clamp(_pinch.zoom*(dist/_pinch.dist), 0.3, 2.5);
        pan.x=_pinch.mx-((_pinch.mx-_pinch.panx)/_pinch.zoom)*nz; // zoom centrado en el punto medio
        pan.y=_pinch.my-((_pinch.my-_pinch.pany)/_pinch.zoom)*nz;
        zoom=nz; applyTransform();
        return;
    }
    _pinch=null;
    if(!panning&&!dragId) return;
    if(e.touches.length!==1) return;
    e.preventDefault();                       // evita el scroll de la página al arrastrar/panear
    _moveTo(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
document.addEventListener('touchend',_endPointer);
document.addEventListener('touchcancel',_endPointer);

/* ── Nodos ── */
function nuevoNodo(){
    var r=viewport.getBoundingClientRect();
    var cx=(r.width/2-pan.x)/zoom-94, cy=(r.height/2-pan.y)/zoom-40;
    var nd={id:'nd_'+genId(),x:cx,y:cy,puesto:'',nombre:'',acceso:'',contexto:'',perfilId:'',color:COLORS[_nodos.length%COLORS.length]};
    _nodos.push(nd); render(); abrirModal(nd.id);
}
function nodeEl(nd){
    var el=document.createElement('div');
    el.className='org-node'; el.id='nd_'+nd.id;
    el.style.left=nd.x+'px'; el.style.top=nd.y+'px';
    el.style.setProperty('--node-c',nd.color||'#3dbe7a');
    el.style.setProperty('--node-glow',(nd.color||'#3dbe7a')+'3a');
    var perfil=nd.perfilId&&_perfiles.find(function(p){return p.id===nd.perfilId;});
    el.innerHTML='<div class="org-node-top"><span class="org-dot"></span><span class="org-puesto">'+esc(nd.puesto||'Nuevo puesto')+'</span></div>'+
        (nd.nombre?'<div class="org-nombre">'+esc(nd.nombre)+'</div>':'')+
        (nd.acceso?'<div class="org-meta">🔗 '+esc(nd.acceso)+'</div>':'')+
        (perfil?'<div class="org-meta" style="color:var(--green)">📋 '+esc(perfil.puesto)+'</div>':'');
    el.addEventListener('mousedown',function(e){
        e.stopPropagation();
        if(_connectMode){ _connectClick(nd.id); return; }
        if(_disconnectMode){ _disconnectClick(nd.id); return; }
        dragId=nd.id; moved=0; _lastPt=null; dragStart={mx:e.clientX,my:e.clientY,x:nd.x,y:nd.y};
        document.querySelectorAll('.org-node.sel').forEach(function(n){n.classList.remove('sel');});
    });
    el.addEventListener('touchstart',function(e){
        if(e.touches.length!==1) return;
        e.stopPropagation(); e.preventDefault();   // evita scroll y el "ghost click" del mouse sintético
        if(_connectMode){ _connectClick(nd.id); return; }
        if(_disconnectMode){ _disconnectClick(nd.id); return; }
        var t=e.touches[0];
        dragId=nd.id; moved=0; _lastPt=null; dragStart={mx:t.clientX,my:t.clientY,x:nd.x,y:nd.y};
        document.querySelectorAll('.org-node.sel').forEach(function(n){n.classList.remove('sel');});
    },{passive:false});
    // OJO: el soltar (mouseup/touchend) lo maneja el listener del document para que SIEMPRE
    // limpie dragId. Si lo manejáramos aquí con stopPropagation, el nodo se quedaba
    // "pegado" al cursor y el siguiente clic abría el editor.
    return el;
}
function render(){
    document.querySelectorAll('.org-node').forEach(function(n){n.remove();});
    _nodos.forEach(function(nd){ world.appendChild(nodeEl(nd)); });
    document.getElementById('orgEmpty').style.display=_nodos.length?'none':'flex';
    requestAnimationFrame(renderConex);
}
function _center(nd){
    var el=document.getElementById('nd_'+nd.id);
    var w=el?el.offsetWidth:188, h=el?el.offsetHeight:64;
    return {x:nd.x+w/2, y:nd.y+h/2};
}
function renderConex(){
    // limpiar paths (deja defs)
    Array.prototype.slice.call(svg.querySelectorAll('path,.hit')).forEach(function(p){p.remove();});
    _conex.forEach(function(cx,i){
        var a=_nodos.find(function(n){return n.id===cx.from;}), b=_nodos.find(function(n){return n.id===cx.to;});
        if(!a||!b) return;
        var p1=_center(a), p2=_center(b), dy=(p2.y-p1.y)/2;
        var d='M'+p1.x+' '+p1.y+' C '+p1.x+' '+(p1.y+dy)+', '+p2.x+' '+(p2.y-dy)+', '+p2.x+' '+p2.y;
        var hit=document.createElementNS('http://www.w3.org/2000/svg','path');
        hit.setAttribute('d',d); hit.setAttribute('class','hit'); hit.setAttribute('stroke','transparent'); hit.setAttribute('stroke-width','16'); hit.setAttribute('fill','none'); hit.style.pointerEvents='stroke'; hit.style.cursor='pointer';
        hit.addEventListener('click',function(ev){ ev.stopPropagation(); borrarConex(i); });
        var path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',d); path.setAttribute('stroke','url(#lg)'); path.setAttribute('stroke-width','2.5'); path.setAttribute('fill','none'); path.setAttribute('opacity','.8'); path.style.pointerEvents='none';
        svg.appendChild(hit); svg.appendChild(path);
    });
}

/* ── Conectar ── */
function toggleConnect(){
    _connectMode=!_connectMode; _connectFrom=null;
    if(_connectMode && _disconnectMode){ _disconnectMode=false; document.getElementById('btnDisconnect').classList.remove('on'); } // exclusivos
    document.getElementById('btnConnect').classList.toggle('on',_connectMode);
    viewport.classList.toggle('connect',_connectMode);
    document.getElementById('orgHint').textContent=_connectMode
        ? 'Modo conectar: clic en el puesto ORIGEN y luego en el DESTINO. Clic en una línea para borrarla.'
        : 'Arrastra el fondo para mover · rueda para zoom · clic en un nodo para editar';
    document.querySelectorAll('.org-node.sel').forEach(function(n){n.classList.remove('sel');});
}
function _connectClick(id){
    if(!_connectFrom){ _connectFrom=id; var el=document.getElementById('nd_'+id); if(el) el.classList.add('sel'); return; }
    if(_connectFrom===id){ _connectFrom=null; var e2=document.getElementById('nd_'+id); if(e2)e2.classList.remove('sel'); return; }
    var dup=_conex.some(function(c){return (c.from===_connectFrom&&c.to===id)||(c.from===id&&c.to===_connectFrom);});
    if(!dup){ _conex.push({from:_connectFrom,to:id}); guardar(); }
    var prev=document.getElementById('nd_'+_connectFrom); if(prev)prev.classList.remove('sel');
    _connectFrom=null; renderConex();
}
/* ── Desconectar ── (clic en los DOS puestos para quitar su línea; fácil en tablet) */
function toggleDisconnect(){
    _disconnectMode=!_disconnectMode; _connectFrom=null;
    if(_disconnectMode && _connectMode){ _connectMode=false; document.getElementById('btnConnect').classList.remove('on'); viewport.classList.remove('connect'); }
    document.getElementById('btnDisconnect').classList.toggle('on',_disconnectMode);
    viewport.classList.toggle('connect',_disconnectMode);
    document.getElementById('orgHint').textContent=_disconnectMode
        ? 'Modo desconectar: clic en los DOS puestos conectados para quitar su línea.'
        : 'Arrastra el fondo para mover · rueda para zoom · clic en un nodo para editar';
    document.querySelectorAll('.org-node.sel').forEach(function(n){n.classList.remove('sel');});
}
function _disconnectClick(id){
    if(!_connectFrom){ _connectFrom=id; var el=document.getElementById('nd_'+id); if(el) el.classList.add('sel'); return; }
    if(_connectFrom===id){ _connectFrom=null; var e2=document.getElementById('nd_'+id); if(e2)e2.classList.remove('sel'); return; }
    var antes=_conex.length;
    _conex=_conex.filter(function(c){ return !((c.from===_connectFrom&&c.to===id)||(c.from===id&&c.to===_connectFrom)); });
    var prev=document.getElementById('nd_'+_connectFrom); if(prev)prev.classList.remove('sel');
    _connectFrom=null; renderConex();
    if(_conex.length!==antes) guardar();
    else if(window.etaaxAlert) etaaxAlert('Esos dos puestos no están conectados.');
}
function borrarConex(i){ _conex.splice(i,1); renderConex(); guardar(); }

/* ── Modal editar ── */
function abrirModal(id){
    var nd=_nodos.find(function(n){return n.id===id;}); if(!nd) return;
    _editId=id; _editColor=nd.color||COLORS[0];
    document.getElementById('nmTitle').textContent=nd.puesto||'Nuevo puesto';
    document.getElementById('nmPuesto').value=nd.puesto||'';
    document.getElementById('nmNombre').value=nd.nombre||'';
    document.getElementById('nmAcceso').value=nd.acceso||'';
    document.getElementById('nmContexto').value=nd.contexto||'';
    _llenarPerfilesSelect(nd.perfilId);
    var cc=document.getElementById('nmColors');
    cc.innerHTML=COLORS.map(function(c){return '<div class="om-color'+(c===_editColor?' sel':'')+'" style="background:'+c+'" onclick="pickColor(\''+c+'\')"></div>';}).join('');
    document.getElementById('nodeOv').classList.add('open');
    _refrescarPerfiles(nd.perfilId); // re-consulta perfiles por si se crearon después de cargar
}
function _llenarPerfilesSelect(selId){
    var sel=document.getElementById('nmPerfil');
    sel.innerHTML='<option value="">— Sin perfil —</option>'+_perfiles.map(function(p){return '<option value="'+p.id+'"'+(p.id===selId?' selected':'')+'>'+esc(p.puesto||'')+'</option>';}).join('');
}
async function _refrescarPerfiles(selId){
    var negId=getNegocioActivo();
    if(!negId||typeof _supabase==='undefined') return;
    try{
        var rp=await _supabase.from('perfiles_puesto').select('datos').eq('negocio_id',negId);
        if(rp.error) return;
        _perfiles=(rp.data||[]).map(function(x){return x.datos;}).filter(Boolean);
        if(document.getElementById('nodeOv').classList.contains('open')) _llenarPerfilesSelect(selId);
    }catch(e){}
}
function pickColor(c){
    _editColor=c;
    document.querySelectorAll('.om-color').forEach(function(el,i){ el.classList.toggle('sel',COLORS[i]===c); });
}
function _perfilElegido(){
    var pid=document.getElementById('nmPerfil').value;
    if(!pid) return;
    var p=_perfiles.find(function(x){return x.id===pid;}); if(!p) return;
    var pu=document.getElementById('nmPuesto');
    if(!pu.value.trim()) pu.value=p.puesto||'';           // solo si está vacío (no piso lo que escribiste)
    var ctx=document.getElementById('nmContexto');
    if(!ctx.value.trim()){
        var prop=(p.funciones&&p.funciones.proposito)||[];
        if(prop.length) ctx.value=prop.join(' ');
    }
    document.getElementById('nmTitle').textContent=pu.value||'Nuevo puesto';
}
function abrirPerfilDeNodo(){
    var pid=document.getElementById('nmPerfil').value;
    if(!pid){ if(window.etaaxAlert) etaaxAlert('Primero vincula un perfil de puesto en la lista.'); else alert('Primero vincula un perfil de puesto.'); return; }
    window.location.href='perfiles-puesto.html?ver='+encodeURIComponent(pid);
}
function cerrarModal(){ document.getElementById('nodeOv').classList.remove('open'); _editId=null; }
function guardarNodo(){
    var nd=_nodos.find(function(n){return n.id===_editId;}); if(!nd) return;
    nd.puesto=document.getElementById('nmPuesto').value.trim();
    nd.nombre=document.getElementById('nmNombre').value.trim();
    nd.acceso=document.getElementById('nmAcceso').value.trim();
    nd.contexto=document.getElementById('nmContexto').value.trim();
    nd.perfilId=document.getElementById('nmPerfil').value;
    nd.color=_editColor;
    cerrarModal(); render(); guardar();
}
function borrarNodo(){
    var id=_editId;
    var go=function(){
        _nodos=_nodos.filter(function(n){return n.id!==id;});
        _conex=_conex.filter(function(c){return c.from!==id&&c.to!==id;});
        cerrarModal(); render(); guardar();
    };
    if(window.etaaxConfirm) etaaxConfirm('Eliminar puesto','Se quitará del organigrama junto con sus conexiones.',go,null,{yesLabel:'Sí, eliminar'});
    else { if(confirm('¿Eliminar este puesto?')) go(); }
}
document.getElementById('nodeOv').addEventListener('click',cerrarModal);

/* ── Vista ── */
function resetVista(silent){
    var w=viewport.clientWidth, h=viewport.clientHeight;
    if(_nodos.length){
        var xs=_nodos.map(function(n){return n.x;}), ys=_nodos.map(function(n){return n.y;});
        var minx=Math.min.apply(null,xs), miny=Math.min.apply(null,ys);
        var maxx=Math.max.apply(null,xs)+188, maxy=Math.max.apply(null,ys)+74; // + tamaño aprox del nodo
        zoom=1;
        var cx=(minx+maxx)/2, cy=(miny+maxy)/2;           // centro del contenido (world)
        pan.x=w/2-cx*zoom; pan.y=h/2-cy*zoom;             // → al centro de la pantalla
    } else { zoom=1; pan.x=w/2-94; pan.y=h/2-40; }
    applyTransform();
    if(!silent) renderConex();
}

document.addEventListener('DOMContentLoaded',function(){ applyTransform(); _sbInit(); });
