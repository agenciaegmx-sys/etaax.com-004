        <div class="nav-section">

    <main class="main-content" id="mainContent">

            </div>
        </div>

        <div class="wrap">

                    <div style="font-size:48px;margin-bottom:16px">🏢</div>
                    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--text);margin-bottom:8px">Control Administrativo</div>

                </div>
            </div>
        </div>

</div>

<style>
.theme-toggle {
    position:fixed;bottom:20px;right:20px;z-index:999;background:var(--surface);
    border:1px solid var(--border);border-radius:50px;padding:8px 16px;cursor:pointer;
    font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-muted);
    display:flex;align-items:center;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);transition:all .2s;
}
.theme-toggle:hover{border-color:var(--green);color:var(--green);}
</style>
<button class="theme-toggle" onclick="toggleTheme()">
    <span id="themeIcon">☀️</span><span id="themeLabel">Modo claro</span>
</button>

<script>
(function(){
    var saved = localStorage.getItem('etaax_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.addEventListener('DOMContentLoaded', function(){
        if (saved === 'light') {
            document.getElementById('themeIcon').textContent = '🌙';
            document.getElementById('themeLabel').textContent = 'Modo oscuro';
        }
    });
})();
function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('etaax_theme', next);
    document.getElementById('themeIcon').textContent  = next === 'light' ? '🌙' : '☀️';
    document.getElementById('themeLabel').textContent = next === 'light' ? 'Modo oscuro' : 'Modo claro';
}
function toggleNav() {
    var nav = document.getElementById('nav');
    var main = document.getElementById('mainContent');
    nav.classList.toggle('cerrado');
    if (main) main.classList.toggle('expandido');
    var cerrado = nav.classList.contains('cerrado');
    var btn = document.getElementById('navToggleBtn');
    var txt = document.getElementById('navToggleTxt');
    if (btn) btn.childNodes[0].textContent = cerrado ? '▶' : '◀';
    if (txt) txt.textContent = cerrado ? 'Expandir' : 'Ocultar';
    if (btn) btn.setAttribute('data-tooltip', cerrado ? 'Expandir' : 'Ocultar');
}
</script>
</body>
