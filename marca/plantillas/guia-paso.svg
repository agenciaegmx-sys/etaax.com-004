<?xml version="1.0" encoding="UTF-8"?>
<!--
  ETAAX — GUÍA DE USO · PÁGINA DE PASO
  ───────────────────────────────────────────────────────────────────────────
  La hermana de guia-portada.svg: mismo lienzo (960 × 720 pt), mismo margen de
  54 y el mismo pie, medidos sobre el PDF real. Duplica ESTE archivo una vez
  por paso de la guía.

  CÓMO SE USA
  1. Cambia el antetítulo (FASE 0X · NOMBRE DE LA FASE) y el número del paso.
  2. Escribe el título en imperativo: lo que la persona va a hacer.
  3. El párrafo va alineado con el TÍTULO, no con el número — ese sangrado de
     62 pt es lo que hace que la página se lea como una columna y no como dos.
  4. Arrastra la captura dentro de su marco. Si solo llevas una, borra el
     grupo "05-Bloque-2" y estira el primero hasta y=630.

  FUENTES · Display: Bebas Neue (respaldo: Arial Narrow Bold, la que quedó
  incrustada en los PDF que ya hiciste). Texto: DM Sans.

  LA RETÍCULA
    margen izquierdo 54 · derecho 906 · sangrado del texto 116
    antetítulo    y  62 (10/2.5)   número 46 + título 40, base y 113
    párrafo       y 141 y 157 (11.5) · sangrado 116
    bloque 1      rótulo y 197 · marco y 208 – 410
    bloque 2      rótulo y 438 · marco y 449 – 630
    filete del pie y 665      ·  pie  y 688
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720"
     viewBox="0 0 960 720" font-family="'DM Sans', Inter, Arial, sans-serif">

  <defs>
    <style><![CDATA[
      .bg      { fill: #0f0e0c; }
      .crema   { fill: #f0ece4; }
      .verde   { fill: #3dbe7a; }
      .gris    { fill: #8b867e; }
      .tenue   { fill: #6b6560; }
      .filete  { stroke: #24221e; stroke-width: 1; }
      .marco   { fill: #141210; stroke: #24221e; stroke-width: 1; }
      .display { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
                 font-weight: 700; }
    ]]></style>
  </defs>

  <g id="00-Fondo">
    <rect x="0" y="0" width="960" height="720" class="bg"/>
  </g>

  <g id="01-Antetitulo">
    <text x="54" y="62" class="tenue" font-size="10" letter-spacing="2.5">FASE 02 · DATOS DEL GASTO</text>
  </g>

  <!-- El número en verde manda la vista; el título dice qué se hace. -->
  <g id="02-Titulo">
    <text id="02a-Numero" x="54" y="113" class="display verde" font-size="46">06</text>
    <text id="02b-Texto"  x="116" y="113" class="display crema" font-size="40">CONCEPTO Y PROVEEDOR</text>
  </g>

  <!-- Sangrado a 116: alineado con el TÍTULO, no con el número. -->
  <g id="03-Parrafo">
    <text x="116" y="141" class="gris" font-size="11.5">El concepto es el nombre con el que lo vas a reconocer en la lista cada mes. El proveedor aparece debajo de la categoría en el listado, y</text>
    <text x="116" y="157" class="gris" font-size="11.5">sirve para saber a quién le pagas sin abrir el registro.</text>
  </g>

  <!-- ── Bloque de captura 1 ─────────────────────────────────────────────── -->
  <g id="04-Bloque-1">
    <text x="54" y="197" class="tenue" font-size="9.5" letter-spacing="2.2">CONCEPTO</text>
    <rect id="04a-Marco" x="54" y="208" width="852" height="202" rx="10" class="marco"/>
    <text x="480" y="305" class="tenue" font-size="11" text-anchor="middle">ARRASTRA AQUÍ LA CAPTURA · 852 × 202 pt</text>
    <text x="480" y="323" class="tenue" font-size="9.5" text-anchor="middle" opacity="0.7">Recorta la pantalla a lo que importa: si hay que buscar el dato, la captura sobra</text>
  </g>

  <!-- ── Bloque de captura 2 · bórralo si el paso lleva una sola ──────────── -->
  <g id="05-Bloque-2">
    <text x="54" y="438" class="tenue" font-size="9.5" letter-spacing="2.2">PROVEEDOR (OPCIONAL)</text>
    <rect id="05a-Marco" x="54" y="449" width="852" height="181" rx="10" class="marco"/>
    <text x="480" y="545" class="tenue" font-size="11" text-anchor="middle">ARRASTRA AQUÍ LA CAPTURA · 852 × 181 pt</text>
  </g>

  <g id="06-Pie">
    <line x1="54" y1="665" x2="906" y2="665" class="filete"/>
    <text x="54"  y="688" class="tenue" font-size="10">etaax · Agregar un gasto fijo</text>
    <text x="906" y="688" class="tenue" font-size="10" text-anchor="end" font-weight="600">7 / 12</text>
  </g>
</svg>
