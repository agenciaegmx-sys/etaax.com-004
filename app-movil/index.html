<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + los safe-area del CSS: sin esto, en un iPhone la barra
     de acciones de abajo queda tapada por la rayita del gesto de inicio. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#13120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETAAX Registro">
<title>ETAAX · Registro de barra y cocina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono-192.png">
<link rel="apple-touch-icon" href="icons/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ CABECERA ══════════════════════════════════════════════════════════════
     Fija arriba porque en estas pantallas uno se pierde: el título dice SIEMPRE
     en qué flujo está parado y quién lo está registrando. -->
<header class="hdr" id="hdr">
    <button class="hdr-volver" id="btnVolver" onclick="irMenu()" hidden>←</button>
    <div class="hdr-txt">
        <div class="hdr-tit" id="hdrTit">Registro</div>
        <div class="hdr-sub" id="hdrSub">barra / cocina</div>
    </div>
    <button class="hdr-tema" onclick="toggleTema()" aria-label="Cambiar tema"><span id="temaIco">☀️</span></button>
</header>

<main id="main">

<!-- ══ 0 · LA PORTADA ════════════════════════════════════════════════════════
     Lo PRIMERO es el acceso, y son dos puertas que no se mezclan (Edwin, 25-nov):
       · LA CLAVE (el NIP de 5 dígitos) abre VISTAS: lo que el equipo consulta y
         registra en su turno, ordenado por módulo (Cost·ax, Equip·ax, Learn·ax).
         Quien trabaja en barra o cocina no tiene cuenta, tiene NIP.
       · USUARIO Y CONTRASEÑA abre los MÓDULOS para usarlos: lo que mueve dinero
         o cambia el catálogo. Es la misma cuenta de la computadora. -->
<section class="pant" id="pInicio" hidden>
    <div class="marca"><img src="icons/icono-192.png" alt="" width="54" height="54"><div>
        <div class="marca-n">ETAAX</div><div class="marca-s" id="inicioSub">Tu operación, en el bolsillo</div></div></div>

    <div class="menu-grupo" style="margin-top:22px">¿Cómo vas a entrar?</div>
    <div class="menu">
        <button class="mcard puerta" id="btnPuertaClave" onclick="irNip('menu')">
            <span class="mcard-ico" data-ic="aut-candado">🔢</span>
            <span class="mcard-txt"><b>Entrar con mi clave</b>
                <small>Tu NIP de 5 dígitos · para ver y registrar en tu turno: entradas, recetario, horarios y check lists</small></span>
        </button>
        <button class="mcard puerta" onclick="verCuenta()">
            <span class="mcard-ico" data-ic="usuario">🔐</span>
            <span class="mcard-txt"><b>Entrar con usuario y contraseña</b>
                <small>Tu cuenta de ETAAX · para usar los módulos: gastos, insumos, recetas y resultados</small></span>
        </button>
    </div>

    <div class="avisos" id="inicioAviso"></div>
</section>

<!-- ══ 0b · ENTRAR CON LA CUENTA ═════════════════════════════════════════════ -->
<section class="pant" id="pCuenta" hidden>
    <label class="lbl" for="ctaCorreo">Correo</label>
    <input class="campo" id="ctaCorreo" type="email" inputmode="email" autocomplete="username"
           autocapitalize="none" spellcheck="false" placeholder="tu@correo.com">
    <label class="lbl" for="ctaPwd">Contraseña</label>
    <input class="campo" id="ctaPwd" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="nip-msg" id="ctaMsg" style="text-align:left"></div>
    <button class="btn btn-ok" id="ctaBtn" onclick="entrarCuenta()" style="margin-top:8px">Entrar</button>
    <div class="avisos">Es la misma cuenta con la que entras al sistema desde la computadora.</div>
</section>

<!-- ══ 0c · EL CANDADO DE ESTE TELÉFONO ══════════════════════════════════════ -->
<section class="pant" id="pCandado" hidden>
    <div class="candado" id="candadoOferta"></div>
</section>

<section class="pant" id="pPin" hidden>
    <div class="nip-wrap">
        <div class="nip-lbl" id="pinTit">PIN de la app</div>
        <div class="nip-puntos" id="pinPts"></div>
        <div class="nip-msg" id="pinErr"></div>
    </div>
    <div class="teclado" id="pinTeclado"></div>
</section>

<!-- ══ 0d · EL MENÚ DE LA CUENTA ═════════════════════════════════════════════
     Los módulos llegan por fases. Lo que todavía no está se enseña APAGADO y
     diciendo dónde sí se hace: esconderlo haría pensar que la app está rota o
     incompleta, y eso es justo lo que hace que nadie la vuelva a abrir. -->
<section class="pant" id="pHome" hidden>
    <div class="quien" id="homeQuien"></div>
    <div class="menu" id="homeMenu"></div>
    <button class="salir" onclick="salirCuenta()">Cerrar sesión</button>
</section>

<!-- ══ 1 · ENTRAR CON EL NIP ═════════════════════════════════════════════════
     Teclado propio, no el del sistema: con dedos mojados y en media luz, cinco
     botones grandes se aciertan y un campo de texto no. -->
<section class="pant" id="pLogin">
    <div class="marca"><img src="icons/icono-192.png" alt="" width="54" height="54"><div>
        <div class="marca-n">ETAAX</div><div class="marca-s">Registro de barra y cocina</div></div></div>

    <div class="nip-wrap">
        <div class="nip-lbl">Tu NIP de 5 dígitos</div>
        <div class="nip-puntos" id="nipPuntos" aria-live="polite"></div>
        <div class="nip-msg" id="nipMsg"></div>
    </div>

    <div class="teclado" id="teclado"></div>
    <div class="avisos" id="loginAviso"></div>
</section>

<!-- ══ 2 · LO QUE SE VE CON LA CLAVE, POR MÓDULO ═════════════════════════════
     Cada vista va con el módulo de ETAAX al que pertenece —el mismo nombre que ve
     el dueño en la computadora—:
       · Cost·ax:  entradas, mermas, cortesías, conteo, recetario y lo registrado
       · Equip·ax: mis horarios, mis check lists y evaluaciones
       · Learn·ax: las guías de uso
     Lo arma pintarPortal(): lo que la sucursal no contrató no se ve (portal_apps,
     v91) y el recetario solo sale a quien cocina o prepara. -->
<section class="pant" id="pMenu" hidden>
    <div class="quien" id="quienCard"></div>
    <div id="menuPortal"></div>
    <!-- La tarjeta se arma por plataforma: en Android hay un botón que de verdad
         instala; en iPhone no existe tal cosa —Apple solo permite «Agregar a
         inicio»— así que ahí van los pasos, no un botón que promete y explica. -->
    <div class="instalar" id="instalar" hidden></div>
    <button class="salir" onclick="salir()">Cerrar sesión</button>
</section>

<!-- ══ 3 · CAPTURA (los cuatro flujos comparten esta pantalla) ════════════════
     Son el mismo gesto —elegir producto, poner cuánto, agregar al lote— y
     mantenerlos en una sola pantalla es lo que evita que se vayan separando. -->
<section class="pant" id="pFlujo" hidden>
    <div id="flujoArea" class="chips-area"></div>
    <div id="flujoExtra"></div>

    <label class="lbl" for="buscar">Producto</label>
    <input class="campo" id="buscar" type="search" autocomplete="off"
           placeholder="Escribe para buscar…" oninput="buscar(this.value)">
    <div class="sugs" id="sugs"></div>

    <div id="elegido" hidden>
        <div class="elegido-card">
            <div style="flex:1;min-width:0">
                <div class="elegido-nom" id="elegidoNom"></div>
                <!-- Los datos que lo distinguen de sus hermanos. En la lista de
                     resultados se ven; al elegirlo se perdían, y es justo la
                     pantalla donde ya no se puede comparar con las de al lado. -->
                <div class="elegido-meta" id="elegidoMeta"></div>
            </div>
            <button class="elegido-x" onclick="limpiarElegido()" aria-label="Quitar">✕</button>
        </div>
        <div class="fila">
            <div style="flex:1.2">
                <label class="lbl" for="cant">Cantidad</label>
                <input class="campo campo-num" id="cant" type="text" inputmode="decimal" placeholder="0">
            </div>
            <div style="flex:1" id="boxUnidad">
                <label class="lbl" for="unidad">Unidad</label>
                <select class="campo" id="unidad"></select>
            </div>
        </div>
        <div id="camposFlujo"></div>
        <button class="btn btn-add" onclick="agregarAlLote()">+ Agregar a la lista</button>
    </div>

    <div class="lote" id="lote"></div>

    <label class="lbl" for="nota">Comentario <span class="opt">opcional</span></label>
    <textarea class="campo" id="nota" rows="2" placeholder="Lo que haga falta explicar…"></textarea>

    <div class="fotos-wrap">
        <label class="lbl">Fotos <span class="opt">opcional · hasta 10</span></label>
        <div class="fotos" id="fotos"></div>
        <label class="btn btn-sec btn-foto">
            📷 Agregar foto
            <input type="file" accept="image/*" capture="environment" multiple hidden onchange="tomarFoto(this)">
        </label>
    </div>
</section>

<!-- ══ 5 · CHECKLISTS ════════════════════════════════════════════════════════ -->
<section class="pant" id="pChecks" hidden>
    <div id="checksList"></div>
</section>

<!-- Ejecutar un checklist. Las tareas se tocan para marcarlas: ✓ cumplida,
     ✗ no se pudo, y otra vez para dejarla pendiente. Tres estados y no dos,
     porque «no se pudo» y «no lo he hecho» no son lo mismo y revolverlos hace
     inútil el reporte. -->
<section class="pant" id="pRun" hidden>
    <div class="run-barra">
        <div class="run-prog"><i id="runProgBar"></i></div>
        <div class="run-cuenta" id="runCuenta">—</div>
    </div>
    <div id="runTareas"></div>

    <label class="lbl" for="runNota">Comentario <span class="opt">opcional</span></label>
    <textarea class="campo" id="runNota" rows="2" placeholder="Lo que haga falta explicar…"></textarea>

    <div class="fotos-wrap">
        <label class="lbl">Fotos <span class="opt">opcional · hasta 10</span></label>
        <div class="fotos" id="runFotos"></div>
        <label class="btn btn-sec btn-foto">
            📷 Agregar foto
            <input type="file" accept="image/*" capture="environment" multiple hidden onchange="tomarFotoRun(this)">
        </label>
    </div>
</section>

<!-- ══ EQUIP·AX · MIS HORARIOS (portal_horarios, v91) ═══════════════════════════
     Solo los turnos de quien entró: esta semana y la que sigue. -->
<section class="pant" id="pHorarios" hidden>
    <div id="horariosLista"></div>
</section>

<!-- ══ EQUIP·AX · EVALUACIONES (portal_evaluaciones, v91) ══════════════════════ -->
<section class="pant" id="pEvals" hidden>
    <div id="evalsLista"></div>
</section>

<!-- ══ 6 · RECETARIO OPERATIVO (sin un solo costo) ════════════════════════════ -->
<section class="pant" id="pRecetas" hidden>
    <input class="campo" id="recBuscar" type="search" autocomplete="off"
           placeholder="🔍 Buscar receta…" oninput="filtrarRecetario(this.value)">
    <div class="chips-area" id="recTabs"></div>
    <div id="recLista"></div>
</section>
<section class="pant" id="pReceta" hidden>
    <div id="recFicha"></div>
</section>

<!-- ══ 7 · GUÍAS DE USO ══════════════════════════════════════════════════════ -->
<section class="pant" id="pGuias" hidden>
    <div id="guiasLista"></div>
</section>

<!-- ══ 4 · LO REGISTRADO ═════════════════════════════════════════════════════ -->
<section class="pant" id="pHist" hidden>
    <div class="hist-sub" id="histSub">Cargando…</div>
    <div class="hist-chips" id="histChips"></div>
    <div id="histBody"></div>
</section>

</main>

<!-- ══ BARRA DE ACCIÓN ═══════════════════════════════════════════════════════
     Abajo y pegada al pulgar. Arriba del todo no se alcanza con una mano, y
     este teléfono se usa con la otra ocupada. -->
<div class="barra" id="barra" hidden>
    <div class="barra-msg" id="barraMsg"></div>
    <button class="btn btn-ok" id="btnEnviar" onclick="enviarLote()">Registrar</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="cuenta.js"></script><!-- la otra puerta: cuenta, candado y biometría -->
<script src="../staff-area.js?v=f7366b4c"></script><!-- quién ve qué: la MISMA regla del resto del sistema -->
<script src="../insumo-label.js?v=789551ec"></script><!-- de qué sucursal es un insumo: la MISMA regla -->
<script src="../etaax-iconos.js?v=7a651810"></script><!-- los íconos de la marca: nada de emojis en los menús -->
<script src="app.js"></script>
</body>
</html>
