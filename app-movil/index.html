<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover + los safe-area del CSS: sin esto, en un iPhone la barra
     de acciones de abajo queda tapada por la rayita del gesto de inicio. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#13120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETAAX Registro">
<title>ETAAX · Registro de barra y cocina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono-192.png">
<link rel="apple-touch-icon" href="icons/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ CABECERA (25-nov, como la del sistema) ═════════════════════════════════
     Tres líneas a la izquierda (el menú), el isotipo al centro, y a la derecha
     el tema y quién está en sesión. La misma en el navegador y en la app
     instalada: nada aquí depende de cómo se abrió. -->
<header class="hdr" id="hdr">
    <div class="hdr-izq">
        <button class="hdr-ico" id="btnCajon" onclick="abrirCajon()" aria-label="Menú" aria-controls="cajon" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="hdr-ico" onclick="toggleTema()" aria-label="Cambiar tema"><span id="temaIco"></span></button>
    </div>
    <button class="hdr-marca" onclick="irInicio()" aria-label="Inicio"><img src="../favicon.svg" alt="ETAAX" width="34" height="34"></button>
    <div class="hdr-der">
        <button class="hdr-cuenta" id="hdrCuenta" onclick="abrirCajon()" aria-label="Tu sesión">
            <span class="hdr-avatar" id="hdrAvatar"></span>
            <span class="hdr-quien"><b id="hdrNombre">Sin sesión</b><small id="hdrEstado">entra con tu clave</small></span>
        </button>
    </div>
</header>

<!-- ══ EL MENÚ DE TRES LÍNEAS ════════════════════════════════════════════════
     Quién está en sesión, a dónde ir, instalarla en el teléfono, el tema y
     cerrar sesión. Lo arma pintarCajon(). -->
<div class="cajon-fondo" id="cajonFondo" hidden onclick="cerrarCajon()"></div>
<aside class="cajon" id="cajon" aria-label="Menú" hidden>
    <div id="cajonSesion"></div>
    <nav class="cajon-nav" id="cajonNav"></nav>
    <!-- La tarjeta se arma por plataforma: en Android hay un botón que de verdad
         instala; en iPhone no existe tal cosa —Apple solo permite «Agregar a
         inicio»— así que ahí van los pasos, no un botón que promete y explica. -->
    <div class="instalar" id="instalar" hidden></div>
    <div class="cajon-pie" id="cajonPie"></div>
</aside>

<main id="main">

<!-- La barra del título: la pantalla en la que estás y cómo regresar. En la
     portada y en el inicio no hace falta; ahí el contenido se presenta solo. -->
<div class="tit-barra" id="titBarra" hidden>
    <button class="hdr-volver" id="btnVolver" onclick="volver()" aria-label="Regresar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="hdr-txt"><div class="hdr-tit" id="hdrTit">ETAAX</div><div class="hdr-sub" id="hdrSub"></div></div>
</div>

<!-- ══ 0 · LA PORTADA: ENTRAR ════════════════════════════════════════════════
     Por default, la CLAVE (el NIP de 5 dígitos): es lo que usa el equipo, y abre
     las VISTAS del turno. Abajo, desplegable, el usuario y la contraseña: abre
     los módulos para usarlos (dueño, gerente y colaboradores con acceso al
     sistema). Mismo estilo que el inicio de sesión del sistema. -->
<section class="pant" id="pInicio" hidden>
    <!-- (25-nov) COMO EL ACCESO DEL SISTEMA (hub.html): la tarjeta, los campos
         con su ícono, el ojo y el botón en terracota. -->
    <!-- (25-nov, después) Arriba, la SUCURSAL —su logo y su nombre— donde iba
         el título grande; «Inicia sesión» pasa, en chico, al recuadro de la
         clave: juntos se comían lo alto de la pantalla. -->
    <div class="suc-marca suc-top" id="sucMarca" hidden></div>
    <!-- Las dos puertas, en dos botones (la clave por default): cada uno
         enseña su recuadro y esconde el otro. Así no se apilan los dos. -->
    <div class="ini-puertas" role="group" aria-label="Cómo entrar">
        <button class="ini-puerta on" id="tabClave" aria-pressed="true" onclick="verPuerta('clave')"><span data-ic="candado"></span>Entrar con clave</button>
        <button class="ini-puerta" id="btnUsuario" aria-expanded="false" aria-controls="cuentaForm" onclick="verPuerta('cuenta')"><span data-ic="usuario"></span>Iniciar sesión</button>
    </div>
    <div class="auth-card clave-card" id="claveCard">
        <div class="clave-tit">Inicia <span>sesión</span></div>
        <div class="auth-sub centro" id="inicioSub">Ingresa tu clave de 5 dígitos</div>
        <div id="nipZona">
            <div class="nip-wrap">
                <div class="nip-puntos" id="nipPuntos" aria-live="polite"></div>
                <div class="nip-msg" id="nipMsg"></div>
            </div>
            <div class="teclado" id="teclado"></div>
        </div>
        <div class="avisos" id="inicioAviso"></div>
    </div>

    <div class="auth-card cuenta-form" id="cuentaForm" hidden>
        <div class="auth-sub">Ingresa tus datos de cuenta</div>
        <div class="cuenta-aviso" id="cuentaAviso"></div>
        <div class="auth-field">
            <label class="auth-label" for="ctaCorreo">Correo o usuario</label>
            <div class="auth-caja">
                <span class="auth-ic" data-ic="usuario"></span>
                <input class="auth-input" id="ctaCorreo" type="text" inputmode="email" autocomplete="username"
                       autocapitalize="none" spellcheck="false" placeholder="tu@correo.com o tu_usuario"
                       onkeydown="if(event.key==='Enter')entrarCuenta()">
            </div>
        </div>
        <div class="auth-field">
            <label class="auth-label" for="ctaPwd">Contraseña</label>
            <div class="auth-caja">
                <span class="auth-ic" data-ic="candado"></span>
                <input class="auth-input" id="ctaPwd" type="password" autocomplete="current-password" placeholder="Tu contraseña"
                       onkeydown="if(event.key==='Enter')entrarCuenta()">
                <button type="button" class="pwd-toggle" id="ctaOjo" data-ic="ojo" onclick="toggleOjo()" tabindex="-1" aria-label="Mostrar contraseña"></button>
            </div>
        </div>
        <div class="auth-error" id="ctaMsg"></div>
        <button class="btn-auth" id="ctaBtn" onclick="entrarCuenta()"><span>Iniciar sesión</span><span class="btn-auth-fl" data-ic="flecha"></span></button>
        <div class="auth-switch"><span class="auth-ic" data-ic="asesor"></span>
            <span>Es tu cuenta del sistema: el dueño entra con su correo y los colaboradores con acceso, con su usuario.</span></div>
    </div>
</section>

<!-- ══ 0c · EL CANDADO DE ESTE TELÉFONO ══════════════════════════════════════ -->
<section class="pant" id="pCandado" hidden>
    <div class="candado" id="candadoOferta"></div>
</section>

<section class="pant" id="pPin" hidden>
    <div class="nip-wrap">
        <div class="nip-lbl" id="pinTit">PIN de la app</div>
        <div class="nip-puntos" id="pinPts"></div>
        <div class="nip-msg" id="pinErr"></div>
    </div>
    <div class="teclado" id="pinTeclado"></div>
</section>

<!-- ══ 0d · EL INICIO CON LA CUENTA ═════════════════════════════════════════
     El mismo diseño que con la clave: un botón por módulo del plan, con lo que
     se podrá hacer ahí. Lo que todavía no está se enseña APAGADO («pronto») y no
     escondido: esconderlo haría pensar que la app está rota. -->
<section class="pant" id="pHome" hidden>
    <div class="saludo-fila">
        <div class="saludo" id="homeQuien"></div>
        <button class="btn-salir" onclick="salirCuenta()"><span data-ic="cerrar-sesion"></span>Cerrar sesión</button>
    </div>
    <div id="homeMenu"></div>
</section>

<!-- ══ 2 · EL INICIO CON LA CLAVE: LOS MÓDULOS ═══════════════════════════════
     Como en el sistema: una tarjeta cuadrada por módulo (ícono, «Módulo N» y su
     isla), su título y «Ver» en terracota. «Cerrar sesión», arriba a la
     derecha. Lo arma pintarPortal(); lo no contratado no se ve (portal_apps,
     v91). -->
<section class="pant" id="pMenu" hidden>
    <div class="saludo-fila">
        <div class="saludo" id="quienCard"></div>
        <button class="btn-salir" onclick="salir()"><span data-ic="cerrar-sesion"></span>Cerrar sesión</button>
    </div>
    <div id="menuPortal"></div>
</section>

<!-- ══ 2b · DENTRO DE UN MÓDULO ═══════════════════════════════════════════════
     Cost·ax: dos desplegables, Inventarios y Recetas, con sus opciones en
     rectángulos de dos columnas. Equip·ax: mis horarios, check list y, si hay,
     evaluaciones. Lo arma pintarModulo(). -->
<section class="pant" id="pModulo" hidden>
    <div id="modCuerpo"></div>
</section>

<!-- ══ 3 · CAPTURA (los cuatro flujos comparten esta pantalla) ════════════════
     Son el mismo gesto —elegir producto, poner cuánto, agregar al lote— y
     mantenerlos en una sola pantalla es lo que evita que se vayan separando. -->
<section class="pant" id="pFlujo" hidden>
    <!-- (25-nov) ENTRADAS, COMO EN EL SISTEMA: dos vistas arriba —el catálogo
         para registrar y lo ya registrado (con sus notas y «Agrupar en nota»)—,
         la tarjeta del producto con los tipos de entrada en botones y la nota /
         factura para una compra de varios productos. Solo en entradas. -->
    <div class="ent-vistas" id="entVistas" hidden>
        <button class="ent-vista" data-vista="catalogo" onclick="setVistaEnt('catalogo')"><span data-ic="mod-inventarios"></span>Catálogo</button>
        <button class="ent-vista" data-vista="registradas" onclick="setVistaEnt('registradas')"><span data-ic="ins-historial"></span>Entradas registradas</button>
    </div>
    <div id="vistaCaptura">
    <div id="flujoArea" class="chips-area"></div>
    <div id="flujoExtra"></div>

    <label class="lbl" for="buscar">Producto</label>
    <input class="campo" id="buscar" type="search" autocomplete="off"
           placeholder="Escribe para buscar…" oninput="buscar(this.value)">
    <div class="sugs" id="sugs"></div>

    <div id="elegido" hidden>
        <div class="elegido-card">
            <div style="flex:1;min-width:0">
                <div class="elegido-nom" id="elegidoNom"></div>
                <!-- Los datos que lo distinguen de sus hermanos. En la lista de
                     resultados se ven; al elegirlo se perdían, y es justo la
                     pantalla donde ya no se puede comparar con las de al lado. -->
                <div class="elegido-meta" id="elegidoMeta"></div>
            </div>
            <button class="elegido-x" onclick="limpiarElegido()" aria-label="Quitar">✕</button>
        </div>
        <div id="elegidoTipos"></div>
        <div class="fila">
            <div style="flex:1.2">
                <label class="lbl" for="cant">Cantidad</label>
                <input class="campo campo-num" id="cant" type="text" inputmode="decimal" placeholder="0">
            </div>
            <div style="flex:1" id="boxUnidad">
                <label class="lbl" for="unidad">Unidad</label>
                <select class="campo" id="unidad"></select>
            </div>
        </div>
        <div id="camposFlujo"></div>
        <button class="btn btn-add" id="btnAgregar" onclick="agregarAlLote()">+ Agregar a la lista</button>
    </div>

    <div class="lote" id="lote"></div>

    <label class="lbl" for="nota">Comentario <span class="opt">opcional</span></label>
    <textarea class="campo" id="nota" rows="2" placeholder="Lo que haga falta explicar…"></textarea>

    <div class="fotos-wrap">
        <label class="lbl" id="fotosLbl">Fotos <span class="opt">opcional · hasta 10</span></label>
        <div class="fotos" id="fotos"></div>
        <label class="btn btn-sec btn-foto">
            📷 Agregar foto
            <input type="file" accept="image/*" capture="environment" multiple hidden onchange="tomarFoto(this)">
        </label>
    </div>
    </div>
    <div id="vistaRegistradas" hidden></div>
</section>

<!-- ══ 5 · CHECKLISTS ════════════════════════════════════════════════════════ -->
<section class="pant" id="pChecks" hidden>
    <div id="checksList"></div>
</section>

<!-- Ejecutar un checklist. Las tareas se tocan para marcarlas: ✓ cumplida,
     ✗ no se pudo, y otra vez para dejarla pendiente. Tres estados y no dos,
     porque «no se pudo» y «no lo he hecho» no son lo mismo y revolverlos hace
     inútil el reporte. -->
<section class="pant" id="pRun" hidden>
    <div class="run-barra">
        <div class="run-prog"><i id="runProgBar"></i></div>
        <div class="run-cuenta" id="runCuenta">—</div>
    </div>
    <div id="runTareas"></div>

    <label class="lbl" for="runNota">Comentario <span class="opt">opcional</span></label>
    <textarea class="campo" id="runNota" rows="2" placeholder="Lo que haga falta explicar…"></textarea>

    <div class="fotos-wrap">
        <label class="lbl">Fotos <span class="opt">opcional · hasta 10</span></label>
        <div class="fotos" id="runFotos"></div>
        <label class="btn btn-sec btn-foto">
            📷 Agregar foto
            <input type="file" accept="image/*" capture="environment" multiple hidden onchange="tomarFotoRun(this)">
        </label>
    </div>
</section>

<!-- ══ EQUIP·AX · MIS HORARIOS (portal_horarios, v91) ═══════════════════════════
     Solo los turnos de quien entró: esta semana y la que sigue. -->
<section class="pant" id="pHorarios" hidden>
    <div id="horariosLista"></div>
</section>

<!-- ══ EQUIP·AX · EVALUACIONES (portal_evaluaciones, v91) ══════════════════════ -->
<section class="pant" id="pEvals" hidden>
    <div id="evalsLista"></div>
</section>

<!-- ══ 6 · RECETARIO OPERATIVO (sin un solo costo) ════════════════════════════ -->
<section class="pant" id="pRecetas" hidden>
    <input class="campo" id="recBuscar" type="search" autocomplete="off"
           placeholder="🔍 Buscar receta…" oninput="filtrarRecetario(this.value)">
    <div class="chips-area" id="recTabs"></div>
    <div id="recLista"></div>
</section>
<section class="pant" id="pReceta" hidden>
    <div id="recFicha"></div>
</section>

<!-- ══ 4 · LO REGISTRADO ═════════════════════════════════════════════════════ -->
<section class="pant" id="pHist" hidden>
    <div class="hist-sub" id="histSub">Cargando…</div>
    <div class="hist-chips" id="histChips"></div>
    <div id="histBody"></div>
</section>

</main>

<!-- ══ BARRA DE ACCIÓN ═══════════════════════════════════════════════════════
     Abajo y pegada al pulgar. Arriba del todo no se alcanza con una mano, y
     este teléfono se usa con la otra ocupada. -->
<div class="barra" id="barra" hidden>
    <div class="barra-msg" id="barraMsg"></div>
    <button class="btn btn-ok" id="btnEnviar" onclick="enviarLote()">Registrar</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="cuenta.js"></script><!-- la otra puerta: cuenta, candado y biometría -->
<script src="../staff-area.js?v=c06b1fe0"></script><!-- quién ve qué: la MISMA regla del resto del sistema -->
<script src="../insumo-label.js?v=40991fbf"></script><!-- de qué sucursal es un insumo: la MISMA regla -->
<script src="../etaax-iconos.js?v=7a651810"></script><!-- los íconos de la marca: nada de emojis en los menús -->
<script src="app.js"></script>
</body>
</html>
