<style>
.rs-wrap { max-width:1180px; margin:0 auto; padding:26px 20px 120px; }
.rs-head { display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px; }
.rs-title { font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--text);line-height:1; }
.rs-title .g { color:var(--green); }
.rs-sub { font-size:12px;color:var(--text-dim);margin-top:4px; }

/* Barra de periodo */
.rs-bar { display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px; }
.rs-tab { padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);
  cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--text-muted);transition:all .18s; }
.rs-tab:hover { border-color:var(--green);color:var(--text); }
.rs-tab.on { border-color:var(--green);background:rgba(61,190,122,.12);color:var(--green);font-weight:600; }
.rs-in { background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:7px 11px;border-radius:8px;font-family:inherit;font-size:12.5px;outline:none; }

/* La tabla: real · proyección */
.rs-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden; }
.rs-tbl { width:100%;border-collapse:collapse; }
.rs-tbl th { padding:11px 14px;font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--text-dim);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap; }
.rs-tbl th:first-child { text-align:left; }
.rs-tbl td { padding:10px 14px;font-size:13.5px;text-align:right;border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums;white-space:nowrap; }
.rs-tbl td:first-child { text-align:left;color:var(--text); }
.rs-tbl tr:last-child td { border-bottom:none; }
/* La columna de proyección, separada con una línea para que se lea como otra cosa */
.rs-proy { border-left:2px solid rgba(122,184,245,.35);background:rgba(122,184,245,.04); }
.rs-tbl th.rs-proy { color:var(--blue,#7ab8f5); }
.rs-util td { background:var(--surface2);font-weight:700;font-size:15px; }
.rs-util td:first-child { font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1.4px; }

/* Entradas de la proyección */
.rs-ed { width:88px;background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--blue,#7ab8f5);font-family:inherit;font-size:13.5px;text-align:right;padding:4px 6px;
  outline:none;font-variant-numeric:tabular-nums; }
.rs-ed:hover { border-color:var(--border); }
.rs-ed:focus { border-color:var(--blue,#7ab8f5);background:var(--surface2); }
.rs-ed.tocado { font-weight:700;background:rgba(122,184,245,.10);border-color:rgba(122,184,245,.4); }

/* Score */
.rs-score { display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:16px 20px;flex-wrap:wrap; }
.rs-score-num { font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:.9;letter-spacing:1px; }
.rs-score-lbl { font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--text-dim); }
.rs-chips { display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:240px; }
.rs-chip { font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text-muted);white-space:nowrap; }
.rs-chip b { color:var(--text); }

/* KPIs: tarjetas chicas, el dato grande y qué significa abajo */
.rs-kpis { display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:14px; }
.rs-kpi { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px; }
.rs-kpi-lbl { font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px; }
.rs-kpi-val { font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:.8px;color:var(--text);line-height:1; }
.rs-kpi-sub { font-size:10.5px;color:var(--text-dim);margin-top:4px;line-height:1.45; }
.rs-kpi-barra { height:5px;border-radius:4px;background:var(--surface2);margin-top:8px;overflow:hidden; }
.rs-kpi-barra i { display:block;height:100%;border-radius:4px; }
.rs-kpi-grupo { grid-column:1/-1;font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--text-dim);margin:8px 0 -2px; }

.rs-nota { font-size:11.5px;color:var(--text-dim);line-height:1.6;margin-top:10px; }
.rs-delta { font-size:12px;font-weight:600; }
.rs-vacio { text-align:center;padding:50px 20px;color:var(--text-dim);line-height:1.7; }
@media (max-width:700px){ .rs-tbl td,.rs-tbl th{padding:8px 9px;font-size:12.5px} .rs-ed{width:72px} }

<script>
function toggleNav() {
    var nav = document.getElementById('nav'); var main = document.getElementById('mainContent');
    nav.classList.toggle('cerrado'); if (main) main.classList.toggle('expandido');
    var cerrado = nav.classList.contains('cerrado');
    var btn = document.getElementById('navToggleBtn'); var txt = document.getElementById('navToggleTxt');
    if (btn) btn.childNodes[0].textContent = cerrado ? '▶' : '◀';
    if (txt) txt.textContent = cerrado ? 'Expandir' : 'Ocultar';
    if (btn) btn.setAttribute('data-tooltip', cerrado ? 'Expandir' : 'Ocultar');
}

function n(v){ var x=parseFloat(v); return isNaN(x)?0:x; }
function esc(s){ return window.etx?etx(String(s==null?'':s)):String(s==null?'':s); }
function fmtM(v){ return '$'+Math.round(n(v)).toLocaleString('es-MX'); }
function fmtP(v){ return (n(v)).toFixed(1)+'%'; }
function getNegocioActivo(){ return localStorage.getItem('etaax_negocio_activo')||''; }
function _sk(k){ var id=getNegocioActivo(); return id?('etaax_'+id+'_'+k):('etaax_'+k); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mesStr(){ return todayStr().slice(0,7); }

/* ── Datos ───────────────────────────────────────────────────────────────────
   Se leen las MISMAS tablas que KPIs y con las MISMAS reglas del núcleo. Si
   esta pantalla calculara por su cuenta, un día diría una utilidad distinta a
   la de KPIs sobre el mismo mes y no habría forma de saber cuál creer. */
var _c = { cortes:[], otros:[], gastos:[], deps:[], ctas:[], fijos:[], staff:[], targets:null, metas:{} };

async function cargar(){
    var negId = getNegocioActivo(); if(!negId) return;
    var r = await Promise.all([
        _supabase.from('cortes').select('datos').eq('negocio_id',negId),
        _supabase.from('sf_otros').select('datos').eq('negocio_id',negId),
        _supabase.from('gastos').select('datos').eq('negocio_id',negId),
        _supabase.from('depositos').select('datos').eq('negocio_id',negId),
        _supabase.from('tarjetas_credito').select('datos').eq('negocio_id',negId),
        _supabase.from('gf_fijos').select('datos').eq('negocio_id',negId),
        _supabase.from('staff').select('datos').eq('negocio_id',negId),
        _supabase.from('kpi_targets').select('datos').eq('negocio_id',negId).maybeSingle(),
        _supabase.from('sf_metas').select('datos').eq('negocio_id',negId).maybeSingle()
    ]);
    var fila = function(x){ return (x.data||[]).map(function(y){return y.datos;}).filter(Boolean); };
    _c.cortes=fila(r[0]); _c.otros=fila(r[1]); _c.gastos=fila(r[2]); _c.deps=fila(r[3]);
    _c.ctas=fila(r[4]); _c.fijos=fila(r[5]); _c.staff=fila(r[6]);
    _c.targets=(r[7].data&&r[7].data.datos)||null;
    /* La meta de VENTA es otra cosa que las metas de porcentaje: vive en
       sf_metas por mes y la pone el encargado desde Ventas Totales. Se lee aquí
       para poder decir «vas al 86% de tu meta» sin que haya que cambiar de
       pantalla a averiguarlo. */
    _c.metas=(r[8].data&&r[8].data.datos)||{};
}

/* Alcance por sucursal: vacío = el negocio entero. Misma regla del resto. */
function _suc(){ return localStorage.getItem('etaax_sucursal_activa')||''; }
function _deSuc(x){ var s=_suc(); if(!s) return true; return (x&&(x.sucursalId||''))===s || !(x&&x.sucursalId); }

var periodoTipo='mes';
function _pVal(){ var e=document.getElementById('pickerInput'); return (e&&e.value)||mesStr(); }
function _pEnd(){ var e=document.getElementById('pickerEnd'); return (e&&e.value)||todayStr(); }
function rango(){ return EtaaxCore.getRange(periodoTipo,_pVal(),_pEnd()); }

function setPeriodo(t){
    periodoTipo=t;
    _mdCache={};   // el reparto diario depende del mes: al cambiar de periodo se rearma
    [['dia','tbDia'],['semana','tbSem'],['mes','tbMes'],['rango','tbRan']].forEach(function(p){
        var b=document.getElementById(p[1]); if(b) b.className='rs-tab'+(t===p[0]?' on':'');
    });
    var i=document.getElementById('pickerInput'), e=document.getElementById('pickerEnd');
    i.type = t==='mes'?'month':(t==='semana'?'week':'date');
    if(t==='mes') i.value=mesStr(); else if(t!=='semana') i.value=todayStr();
    e.style.display = t==='rango'?'':'none';
    render();
}

/* El P&L del periodo, armado con el núcleo. */
function plDelPeriodo(){
    var r=rango(), desde=r.from, hasta=r.to;
    var dentro=function(f){ return f && f>=desde && f<=hasta; };
    var cortes=_c.cortes.filter(_deSuc).filter(function(c){return dentro(c.fecha);});
    var otros =_c.otros.filter(_deSuc).filter(function(o){return dentro(o.fecha);});
    var gastos=_c.gastos.filter(_deSuc).filter(function(g){return dentro(g.fecha);});

    /* VENTA = venta bruta, SIN propinas: la propina es del staff, no ingreso
       del negocio. Misma base que KPIs, Ventas y Estadísticas. */
    var ventas=cortes.reduce(function(s,c){return s+EtaaxCore.ventasBruta(c);},0);
    var otrosT=otros.reduce(function(s,o){return s+n(o.monto);},0);
    var ingresos=ventas+otrosT;

    var ctasDeb=(_c.ctas||[]).filter(function(c){return c&&c.tipo==='debito';});
    var comision=cortes.reduce(function(s,c){return s+EtaaxCore.comisionBancoCorte(c,ctasDeb,_c.deps);},0);
    var cl=EtaaxCore.clasificarGastos(gastos,{fijos:_c.fijos,staff:_c.staff,comisionBanco:comision});
    /* OJO: clasificarGastos recibe su propio objeto porque lo MUTA (memoiza las
       categorías de fijos adentro). Compartir la misma referencia haría que el
       segundo llamado arrastrara el memo del primero — funciona, pero depende
       de un detalle interno que mañana puede cambiar. */
    var prevs=EtaaxCore.previsionApartadoRango(_c.deps||[],desde,hasta);

    /* El MISMO `opts` para las dos llamadas. Si costoInsumos clasificara con
       otras reglas que clasificarGastos, un mismo gasto podría contarse en dos
       renglones —o en ninguno— y la suma dejaría de cuadrar con los egresos. */
    var opts = {fijos:_c.fijos, staff:_c.staff, comisionBanco:comision};

    /* ── DE DÓNDE SALIÓ CADA RENGLÓN ───────────────────────────────────────────
       Un total sin forma de abrirlo es un número que hay que creer. «Food cost
       $67,006» no se puede discutir, corregir ni auditar: para saber si está
       bien había que irse a Gastos, filtrar por fechas y sumar a mano — y para
       entonces ya nadie lo revisa.

       El desglose se arma AQUÍ, en la misma pasada que el total y con la misma
       regla del núcleo (EtaaxCore.grupoGasto). Calcularlo aparte sería abrir la
       puerta a que la lista sume una cosa y el renglón diga otra, que es peor
       que no tener lista. */
    var DET = { ventas:[], food:[], nom:[], fijos:[], otros:[], prevs:[] };
    cortes.forEach(function(c){
        DET.ventas.push({ fecha:c.fecha, concepto:'Corte'+(c.turno?' · '+c.turno:''),
                          sub:_sucNom(c.sucursalId), monto:EtaaxCore.ventasBruta(c) });
    });
    otros.forEach(function(o){
        DET.ventas.push({ fecha:o.fecha, concepto:o.concepto||o.nombre||'Otro ingreso',
                          sub:'ingreso extra', monto:n(o.monto) });
    });
    gastos.forEach(function(g){
        /* Un gasto PENDIENTE está capturado pero no ha salido de la caja: no
           suma al renglón, así que tampoco puede aparecer en su lista. */
        if(EtaaxCore.gastoEstatus(g)!=='pagado') return;
        var grupo=EtaaxCore.grupoGasto(g,opts);
        if(grupo==='propina') return;              // la propina es del staff, no gasto
        var reng={ fecha:g.fecha, concepto:g.concepto||g.descripcion||g.proveedor||'(sin concepto)',
                   sub:g.categoria||'', monto:n(g.monto) };
        if(grupo==='variable'&&EtaaxCore.esGastoInsumo(g)) DET.food.push(reng);
        else if(grupo==='variable') DET.otros.push(reng);
        else if(grupo==='fijo')     DET.fijos.push(reng);
        else { reng.sub = grupo==='imss'?'IMSS':(grupo==='nomAdm'?'Administrativa':'Operativa');
               reng.grupo = grupo; DET.nom.push(reng); }
    });
    (_c.deps||[]).filter(_deSuc).forEach(function(d){
        if(!EtaaxCore.esApartado(d)) return;
        if(!dentro(d.fecha)) return;
        DET.prevs.push({ fecha:d.fecha, concepto:d.concepto||d.prevNombre||'Apartado',
                         sub:EtaaxCore.apartadoFondo(d)==='banco'?'banco':'caja fuerte', monto:n(d.monto) });
    });
    Object.keys(DET).forEach(function(k){
        DET[k].sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')); });
    });
    /* Los comensales del periodo salen de los mismos cortes que la venta: el
       cheque promedio tiene que medirse contra la venta que se está enseñando,
       no contra otra. */
    DET._comensales = cortes.reduce(function(t,c){ return t+n(c.comensales); },0);
    DET._cortes = cortes.length;
    _DET = DET;

    return EtaaxCore.resumenPL({
        ingresos: ingresos,
        food:      EtaaxCore.costoInsumos(gastos, opts),
        nom:       cl.nomOp+cl.nomAdm+cl.imss,
        fijos:     cl.fijo,
        variables: cl.variable,
        prevs:     prevs
    });
}

var _DET = null;   // el desglose del último periodo calculado

/* El nombre de la sucursal del corte, para que la lista diga de dónde vino cada
   venta cuando se está mirando el negocio completo. */
function _sucNom(id){
    if(!id) return 'Matriz';
    try {
        var l=JSON.parse(localStorage.getItem(_sk('sucursales'))||'[]');
        var x=l.find(function(y){ return y.id===id; });
        return (x&&x.nombre)||id;
    } catch(e){ return id; }
}

/* ── La proyección ───────────────────────────────────────────────────────── */
var _proy = {};                 // lo que el usuario movió
function _tocado(){ return Object.keys(_proy).length>0; }

function edVentas(el){
    var v=parseFloat(String(el.value).replace(/[^0-9.\-]/g,''));
    if(isNaN(v)||v<0){ delete _proy.ventas; } else { _proy.ventas=v; }
    render(true);
}
function edPct(k, el){
    var v=parseFloat(String(el.value).replace(/[^0-9.\-]/g,''));
    if(isNaN(v)){ delete _proy[k]; } else { _proy[k]={pct:v}; }
    render(true);
}
function edMonto(k, el){
    var v=parseFloat(String(el.value).replace(/[^0-9.\-]/g,''));
    if(isNaN(v)){ delete _proy[k]; } else { _proy[k]={monto:v}; }
    render(true);
}
function limpiarProyeccion(){ _proy={}; render(); }

/* El concepto, con la cuenta de movimientos que hay detrás. El número de
   renglones a la vista es lo que invita a abrirlo: «Food cost · 23» se lee como
   algo que se puede revisar; «Food cost» a secas, como un dato dado. */
function _conLupa(k, nom){
    var cuantos = (_DET && _DET[k]) ? _DET[k].length : 0;
    if(!cuantos) return esc(nom);
    return '<button onclick="verDetalle(\''+k+'\')" title="Ver los movimientos que suman este renglón" '+
        'style="background:none;border:none;padding:0;font:inherit;color:var(--text);cursor:pointer;'+
        'text-align:left;display:inline-flex;align-items:center;gap:7px">'+esc(nom)+
        '<span style="font-size:10px;color:var(--text-dim);border:1px solid var(--border);border-radius:20px;'+
        'padding:1px 7px;font-variant-numeric:tabular-nums">'+cuantos+' ⌄</span></button>';
}

function render(mantenFoco){
    var foco = mantenFoco ? (document.activeElement&&document.activeElement.id) : null;
    var selStart = null;
    try { if(foco) selStart = document.activeElement.selectionStart; } catch(e){}

    var base = plDelPeriodo();
    var proy = EtaaxCore.proyectarPL(base, _proy);
    var metas = _c.targets || {};
    /* La meta de food cost no existía en KPIs (ahí no se medía). Se usa 30 como
       punto de partida —el rango sano de la industria— y es editable desde
       KPIs como las demás en cuanto se guarde una. */
    var m = { food: n(metas.food)||30, nom: (n(metas.nomOp)+n(metas.nomAdm))||30,
              fijos: n(metas.fijos)||15, otros: n(metas.variables)||10,
              prevs: n(metas.prev)||5,  util: n(metas.util)||20 };
    var sc = EtaaxCore.scorePL(base, m);

    document.getElementById('rsSub').textContent =
        _periodoTxt() + (_suc()? ' · esta sucursal' : ' · todo el negocio');

    // ── Score ──
    var col = sc.score===null ? 'var(--text-dim)'
            : sc.score>=85 ? 'var(--green)' : sc.score>=70 ? 'var(--accent-text,var(--accent))' : 'var(--red)';
    document.getElementById('rsScore').innerHTML =
        '<div style="text-align:center;min-width:92px">' +
          '<div class="rs-score-num" style="color:'+col+'">'+(sc.score===null?'—':sc.score)+'</div>' +
          '<div class="rs-score-lbl">Score</div>' +
        '</div>' +
        '<div class="rs-chips">' +
          sc.detalle.map(function(d){
              if(d.punto===null) return '';
              var c = d.punto>=100?'var(--green)':d.punto>=80?'var(--accent-text,var(--accent))':'var(--red)';
              return '<span class="rs-chip"><b>'+esc(d.nom)+'</b> '+fmtP(d.real)+
                     ' <span style="color:'+c+'">· meta '+d.meta+'%</span></span>';
          }).join('') +
        '</div>';

    // ── La tabla ──
    var filas = base.lineas.map(function(l,i){
        var p = proy.lineas[i];
        var dif = p.monto - l.monto;
        /* En un gasto, bajar es bueno: el verde va al que REDUCE. Pintarlo al
           revés haría leer una mejora como un problema. */
        var cDif = Math.abs(dif)<0.5 ? 'var(--text-dim)' : (dif<0 ? 'var(--green)' : 'var(--red)');
        var tocado = !!_proy[l.k];
        return '<tr>'+
            '<td>'+_conLupa(l.k, l.nom)+'</td>'+
            '<td>'+fmtM(l.monto)+'</td>'+
            '<td style="color:var(--text-muted)">'+fmtP(l.pct)+'</td>'+
            '<td class="rs-proy"><input class="rs-ed'+(tocado&&_proy[l.k].monto!==undefined?' tocado':'')+'" id="ed_m_'+l.k+'" '+
                'value="'+Math.round(p.monto)+'" onchange="edMonto(\''+l.k+'\',this)" '+
                'title="Escribe el monto; el porcentaje se recalcula"></td>'+
            '<td class="rs-proy"><input class="rs-ed'+(tocado&&_proy[l.k].pct!==undefined?' tocado':'')+'" id="ed_p_'+l.k+'" '+
                'value="'+p.pct.toFixed(1)+'" onchange="edPct(\''+l.k+'\',this)" '+
                'title="Escribe el porcentaje; el monto se recalcula"></td>'+
            '<td class="rs-delta" style="color:'+cDif+'">'+(dif>=0?'+':'−')+fmtM(Math.abs(dif))+'</td>'+
        '</tr>';
    }).join('');

    var difU = proy.utilidad - base.utilidad;
    var cU = Math.abs(difU)<0.5?'var(--text-dim)':(difU>0?'var(--green)':'var(--red)');

    document.getElementById('rsBody').innerHTML =
        // Ventas arriba: todo lo demás es un porcentaje de esto
        '<tr>'+
            '<td style="font-weight:600">'+_conLupa('ventas','Ventas')+'</td>'+
            '<td style="font-weight:600">'+fmtM(base.ventas)+'</td>'+
            '<td style="color:var(--text-muted)">100%</td>'+
            '<td class="rs-proy"><input class="rs-ed'+(_proy.ventas!==undefined?' tocado':'')+'" id="ed_ventas" '+
                'value="'+Math.round(proy.ventas)+'" onchange="edVentas(this)" '+
                'title="Súbelas o bájalas: todo lo demás se recalcula"></td>'+
            '<td class="rs-proy" style="color:var(--text-dim)">100%</td>'+
            '<td class="rs-delta" style="color:'+((proy.ventas-base.ventas)>0?'var(--green)':((proy.ventas-base.ventas)<0?'var(--red)':'var(--text-dim)'))+'">'+
                ((proy.ventas-base.ventas)>=0?'+':'−')+fmtM(Math.abs(proy.ventas-base.ventas))+'</td>'+
        '</tr>'+
        filas +
        // La utilidad es RESULTADO: no se edita, se observa
        '<tr class="rs-util">'+
            '<td>Utilidad</td>'+
            '<td>'+fmtM(base.utilidad)+'</td>'+
            '<td>'+fmtP(base.utilidadPct)+'</td>'+
            '<td class="rs-proy" style="color:var(--blue,#7ab8f5)">'+fmtM(proy.utilidad)+'</td>'+
            '<td class="rs-proy" style="color:var(--blue,#7ab8f5)">'+fmtP(proy.utilidadPct)+'</td>'+
            '<td class="rs-delta" style="color:'+cU+'">'+(difU>=0?'+':'−')+fmtM(Math.abs(difU))+'</td>'+
        '</tr>';

    renderKpis(base, m);

    document.getElementById('btnLimpiar').style.display = _tocado()?'':'none';

    // ── La nota: de dónde salen los números ──
    /* Decir la base de medición no es letra chica: el mismo mes da utilidades
       distintas según si se mide por flujo o por consumo, y quien lee tiene
       derecho a saber cuál está viendo. */
    var nota = '🧾 Esto es <b>ingresos contra egresos por categoría</b> del periodo: lo que entró y lo que ' +
               'salió de la caja. El food cost es lo <b>comprado</b> en alimentos, bebidas e insumos de barra ' +
               '— no el consumo de inventario, que todavía no alimenta este resumen.';
    nota += '<br>La utilidad no se edita: es lo que sale de los demás renglones. ' +
            'Los <b>gastos fijos</b> no suben si subes las ventas — por eso el margen mejora solo al vender más.';
    if (!sc.metasPuestas) nota += '<br>⚠️ Sin metas configuradas no hay Score. Ponlas en <a href="kpis.html" style="color:var(--green)">KPIs</a>.';
    document.getElementById('rsNota').innerHTML = nota;

    /* Devolver el foco donde estaba: sin esto, escribir un número repinta la
       tabla y el cursor salta fuera del campo a media captura. */
    if (foco) {
        var el = document.getElementById(foco);
        if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch(e){} }
    }
}

/* ══ LOS INDICADORES ═══════════════════════════════════════════════════════
   El P&L dice CUÁNTO; los KPIs dicen DE QUÉ MANERA. Dos meses con la misma
   venta pueden venir de 900 cuentas de $380 o de 400 de $870, y lo que hay que
   hacer con cada uno no se parece en nada.

   Van debajo de la tabla y leen el MISMO periodo y los MISMOS cortes: si
   salieran de otra consulta, un día el cheque promedio no cuadraría con la
   venta de arriba y no habría forma de saber cuál creer. */

/* La meta de venta del periodo. Vive por mes en sf_metas y se reparte por día
   (EtaaxCore.calcMetaDiaria), así que para un rango suelto o una semana se suman
   los días que caen dentro — no se prorratea el mes, que daría una meta falsa
   para un periodo de cuatro días. */
var _mdCache = {};
function _metaDelDia(fecha){
    var mes=fecha.slice(0,7);
    if(!_mdCache[mes]){
        var md=(_c.metas||{})[mes];
        _mdCache[mes]= md ? EtaaxCore.calcMetaDiaria(mes, md.meta, md.dist||'uniforme', md.manualDays||null) : {};
    }
    return _mdCache[mes][fecha]||0;
}
function metaDelRango(){
    var r=rango(), t=0, hay=false;
    var d0=new Date(r.from+'T12:00:00'), d1=new Date(r.to+'T12:00:00');
    for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
        var f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        var m=_metaDelDia(f);
        if(m>0) hay=true;
        t+=m;
    }
    return hay ? t : null;    // sin meta puesta se dice «sin definir», no «$0»
}

function _kpiCard(lbl, val, sub, color, barraPct, barraColor){
    var barra = (barraPct===null||barraPct===undefined) ? '' :
        '<div class="rs-kpi-barra"><i style="width:'+Math.max(0,Math.min(100,barraPct))+'%;background:'+
        (barraColor||'var(--green)')+'"></i></div>';
    return '<div class="rs-kpi"><div class="rs-kpi-lbl">'+esc(lbl)+'</div>'+
        '<div class="rs-kpi-val"'+(color?' style="color:'+color+'"':'')+'>'+val+'</div>'+
        '<div class="rs-kpi-sub">'+sub+'</div>'+barra+'</div>';
}

function renderKpis(base, m){
    var cont=document.getElementById('rsKpis'); if(!cont) return;
    var com=(_DET&&_DET._comensales)||0;
    var cortes=(_DET&&_DET._cortes)||0;
    /* El cheque promedio se calcula sobre la VENTA del periodo, no sumando los
       cheques de cada corte: promediar promedios le daría el mismo peso a un
       martes de 12 cuentas que a un sábado de 300. */
    var cheque = com>0 ? base.ventas/com : 0;
    var meta = metaDelRango();
    var cump = (meta&&meta>0) ? (base.ventas/meta*100) : null;
    var cCump = cump===null ? 'var(--text-dim)' : cump>=100?'var(--green)':cump>=80?'var(--accent-text,var(--accent))':'var(--red)';
    var dias = Math.max(1, Math.round((new Date(rango().to+'T12:00:00')-new Date(rango().from+'T12:00:00'))/864e5)+1);

    var html='<div class="rs-kpi-grupo">Cómo se vendió</div>';
    html+=_kpiCard('Meta del periodo',
        meta===null?'Sin definir':fmtM(meta),
        meta===null
            ? 'Ponla en <a href="ventas.html" style="color:var(--green)">Ventas Totales</a> para medir el avance'
            : (cump===null?'':'<b style="color:'+cCump+'">'+cump.toFixed(0)+'%</b> cumplido · faltan '+
               (meta-base.ventas>0?fmtM(meta-base.ventas):'$0')),
        null, cump, cCump);
    html+=_kpiCard('Comensales',
        com>0?com.toLocaleString('es-MX'):'—',
        com>0 ? (com/dias).toFixed(0)+' por día en '+dias+' días'
              : 'No se capturaron comensales en los cortes del periodo');
    html+=_kpiCard('Cheque promedio',
        com>0?fmtM(cheque):'—',
        com>0 ? 'Venta entre comensales — sin propinas'
              : 'Hace falta el número de comensales en el corte');
    html+=_kpiCard('Venta por día',
        fmtM(base.ventas/dias),
        cortes+' corte'+(cortes===1?'':'s')+' en el periodo');

    /* El mismo P&L leído como porcentajes, que es como se compara entre meses y
       contra la meta: los pesos de septiembre y los de febrero no se comparan,
       los porcentajes sí. */
    html+='<div class="rs-kpi-grupo">Cómo se gastó · % sobre la venta</div>';
    base.lineas.forEach(function(l){
        var meta2 = m[l.k==='otros'?'otros':l.k];
        /* En un gasto, estar POR DEBAJO de la meta es cumplir. Pintarlo al revés
           haría leer un ahorro como un problema. */
        var ok = meta2>0 ? (l.pct<=meta2) : null;
        var c  = ok===null?'var(--text)':ok?'var(--green)':'var(--red)';
        html+=_kpiCard(l.nom, fmtP(l.pct),
            meta2>0 ? ('meta '+meta2+'% · '+(ok?'dentro':'<b style="color:var(--red)">'+(l.pct-meta2).toFixed(1)+' pts arriba</b>'))
                    : 'sin meta configurada',
            c, meta2>0?Math.min(100,(l.pct/meta2)*100):null, ok?'var(--green)':'var(--red)');
    });
    var okU = m.util>0 ? (base.utilidadPct>=m.util) : null;
    html+=_kpiCard('Utilidad', fmtP(base.utilidadPct),
        m.util>0 ? ('meta '+m.util+'% · '+(okU?'cumplida':'<b style="color:var(--red)">'+(m.util-base.utilidadPct).toFixed(1)+' pts abajo</b>'))
                 : 'sin meta configurada',
        okU===null?'var(--text)':okU?'var(--green)':'var(--red)',
        m.util>0?Math.min(100,(base.utilidadPct/m.util)*100):null,
        okU?'var(--green)':'var(--red)');
    cont.innerHTML=html;
}

/* ══ ABRIR UN RENGLÓN ══════════════════════════════════════════════════════
   Lo que hay detrás del número, con los mismos registros que se sumaron. El
   total del pie tiene que coincidir con el renglón de la tabla: si no coincide,
   es que la lista y el cálculo se separaron, y eso se ve de inmediato. */
var _DET_TITULOS = {
    ventas:['Ventas e ingresos','Los cortes de caja y los ingresos extra del periodo. La venta se mide BRUTA, sin propinas: la propina es del staff, no ingreso del negocio.'],
    food:  ['Food cost','Lo comprado en alimentos, bebidas e insumos de barra. Es compra, no consumo de inventario.'],
    nom:   ['Nómina','Sueldos, IMSS y lo pagado a socios, separado en operativa y administrativa.'],
    fijos: ['Gastos fijos','Lo que se paga igual venda o no venda: renta, servicios, licencias.'],
    otros: ['Otros variables','Gastos que suben y bajan con la operación y no son insumo: limpieza, mantenimiento, comisiones, impuestos.'],
    prevs: ['Previsiones','Dinero apartado este periodo para un gasto futuro (aguinaldos, impuestos, reparaciones). Sale de la caja aunque todavía no se gaste.']
};
function verDetalle(k){
    if(!_DET) return;
    var t=_DET_TITULOS[k]||[k,''];
    var filas=_DET[k]||[];
    var total=filas.reduce(function(a,b){ return a+n(b.monto); },0);

    var cuerpo;
    if(!filas.length){
        cuerpo='<div class="rs-vacio">No hay movimientos de este tipo en el periodo.</div>';
    } else {
        /* La nómina se enseña partida: «$4,640 de nómina» no dice si el
           problema es que sobra administración o que falta cocina. */
        var sub='';
        if(k==='nom'){
            var g={Operativa:0,Administrativa:0,IMSS:0};
            filas.forEach(function(r){ g[r.sub]=(g[r.sub]||0)+n(r.monto); });
            sub='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+
                Object.keys(g).map(function(x){
                    return '<span class="rs-chip"><b>'+esc(x)+'</b> '+fmtM(g[x])+
                           ' <span style="color:var(--text-dim)">· '+(total>0?(g[x]/total*100).toFixed(0):0)+'%</span></span>';
                }).join('')+'</div>';
        }
        cuerpo=sub+'<table class="rs-tbl"><thead><tr>'+
            '<th style="width:88px">Fecha</th><th style="text-align:left">Concepto</th>'+
            '<th style="text-align:left;width:34%">'+(k==='ventas'?'Sucursal':'Detalle')+'</th><th>Monto</th>'+
            '</tr></thead><tbody>'+
            filas.map(function(r){
                return '<tr><td style="text-align:left;color:var(--text-dim);font-size:12px">'+esc(r.fecha||'')+'</td>'+
                    '<td style="text-align:left">'+esc(r.concepto)+'</td>'+
                    '<td style="text-align:left;color:var(--text-muted);font-size:12px">'+esc(r.sub||'—')+'</td>'+
                    '<td>'+fmtM(r.monto)+'</td></tr>';
            }).join('')+
            '</tbody><tfoot><tr class="rs-util"><td colspan="3" style="text-align:left">'+filas.length+
            ' movimiento'+(filas.length===1?'':'s')+'</td><td>'+fmtM(total)+'</td></tr></tfoot></table>';
    }

    var ov=document.getElementById('rsDetOv');
    if(ov) ov.remove();
    ov=document.createElement('div');
    ov.id='rsDetOv';
    ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;'+
        'align-items:center;justify-content:center;padding:18px';
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    ov.innerHTML='<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;'+
        'width:min(840px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden">'+
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;'+
            'padding:16px 18px;border-bottom:1px solid var(--border)">'+
            '<div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:21px;letter-spacing:1.4px;'+
                'color:var(--text)">'+esc(t[0])+'</div>'+
                '<div style="font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.55;max-width:560px">'+
                t[1]+'</div></div>'+
            '<button class="rs-tab" onclick="document.getElementById(\'rsDetOv\').remove()">✕ Cerrar</button>'+
        '</div>'+
        '<div style="flex:1;overflow:auto;padding:14px 18px 20px">'+cuerpo+'</div></div>';
    document.body.appendChild(ov);
}

function _periodoTxt(){
    var r=rango();
    if(periodoTipo==='mes') return new Date(r.from+'T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    if(periodoTipo==='dia') return new Date(r.from+'T12:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
    return r.from+' al '+r.to;
}

/* ── Imprimir: el mismo resumen, con la proyección al lado ── */
function imprimirResumen(){
    var base=plDelPeriodo(), proy=EtaaxCore.proyectarPL(base,_proy);
    var fil=function(nom,a,ap,b,bp){
        return '<tr><td class="w">'+esc(nom)+'</td><td>'+fmtM(a)+'</td><td>'+fmtP(ap)+'</td>'+
               '<td>'+fmtM(b)+'</td><td>'+fmtP(bp)+'</td><td>'+((b-a)>=0?'+':'−')+fmtM(Math.abs(b-a))+'</td></tr>';
    };
    var cuerpo='<table class="rt tnum"><thead><tr><th class="w">Concepto</th>'+
        '<th>Real</th><th>%</th><th>Proyección</th><th>%</th><th>Diferencia</th></tr></thead><tbody>'+
        fil('Ventas', base.ventas,100, proy.ventas,100)+
        base.lineas.map(function(l,i){ var p=proy.lineas[i]; return fil(l.nom,l.monto,l.pct,p.monto,p.pct); }).join('')+
        '</tbody><tfoot>'+fil('Utilidad', base.utilidad,base.utilidadPct, proy.utilidad,proy.utilidadPct)+'</tfoot></table>';
    etaaxImprimir(etaaxReporte({
        titulo:'Resumen de Resultados', subtitulo:_periodoTxt(),
        pie:'Resumen de Resultados · '+_periodoTxt(), cuerpo:cuerpo
    }));
}
